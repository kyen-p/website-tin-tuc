<!-- ===================================================
     LOAD MOCK DATA
=================================================== -->


<script src="mock-data.js"></script>





<script>
    // =======================================
// LẤY USER TỪ MOCK_DATA
// =======================================

const user = MOCK_DATA.users[0];




// =======================================
// SIDEBAR
// =======================================

document
.getElementById("sidebarName")
.innerText = user.full_name;


document
.getElementById("sidebarRole")
.innerText = roleName(user.role);


document
.getElementById("sidebarAvatar")
.src = user.avatar;






// =======================================
// FORM PROFILE
// =======================================


document
.getElementById("avatarPreview")
.src = user.avatar;


document
.getElementById("fullname")
.value = user.full_name;


document
.getElementById("username")
.value = user.username;


document
.getElementById("email")
.value = user.email;


document
.getElementById("phone")
.value = user.phone;


document
.getElementById("birthday")
.value = user.date_of_birth;


document
.getElementById("bio")
.value = user.bio;








// =======================================
// HIỂN THỊ ROLE
// =======================================

function roleName(role){


if(role==="user")
return "Độc giả";


if(role==="reporter")
return "Phóng viên";


if(role==="editor")
return "Biên tập viên";


if(role==="admin")
return "Quản trị viên";


return role;


}








// =======================================
// CHUYỂN TAB THÔNG TIN
// =======================================


function showProfile(){


document
.getElementById("profileInfo")
.style.display="block";


document
.getElementById("passwordInfo")
.style.display="none";



document
.querySelector(".profile-heading")
.innerText =
"Quản lý tài khoản";



document
.querySelector(".profile-description")
.innerText =
"Cập nhật thông tin cá nhân và bảo mật tài khoản.";


}








// =======================================
// CHUYỂN TAB ĐỔI MẬT KHẨU
// =======================================


function showPassword(){


document
.getElementById("profileInfo")
.style.display="none";


document
.getElementById("passwordInfo")
.style.display="block";



document
.querySelector(".profile-heading")
.innerText =
"Đổi mật khẩu";



document
.querySelector(".profile-description")
.innerText =
"Cập nhật mật khẩu để bảo vệ tài khoản.";


}








// =======================================
// ACTIVE MENU
// =======================================


function setActiveMenu(element){


document
.querySelectorAll(".history-menu-item")
.forEach(item=>{


item.classList.remove("active");


});



element.classList.add("active");


}








// =======================================
// ĐỔI AVATAR
// =======================================


document
.getElementById("avatar")
.addEventListener(
"change",
function(e){


let file=e.target.files[0];


if(file){


let url =
URL.createObjectURL(file);



document
.getElementById("avatarPreview")
.src=url;



document
.getElementById("sidebarAvatar")
.src=url;


}


});









// =======================================
// LƯU PROFILE
// =======================================


function saveProfile(){



let username =
document
.getElementById("username")
.value;



let email =
document
.getElementById("email")
.value;



let message =
document
.getElementById("message");






// CHECK USERNAME

let exist =
MOCK_DATA.users.find(
u =>
u.username===username
&&
u.id!==user.id
);



if(exist){


message.innerText =
"Username đã được sử dụng";


return;


}






// CHECK EMAIL


let regex =
/^[^\s@]+@[^\s@]+\.[^\s@]+$/;



if(!regex.test(email)){


message.innerText =
"Email không đúng định dạng";


return;


}






// UPDATE DATA


user.full_name =
document
.getElementById("fullname")
.value;



user.username =
username;



user.email =
email;



user.phone =
document
.getElementById("phone")
.value;



user.date_of_birth =
document
.getElementById("birthday")
.value;



user.bio =
document
.getElementById("bio")
.value;





message.innerText =
"Cập nhật thông tin tài khoản thành công";


}








// =======================================
// ĐỔI MẬT KHẨU
// =======================================


function changePassword(){



let oldPassword =
document
.getElementById("oldPassword")
.value;



let newPassword =
document
.getElementById("newPassword")
.value;



let confirmPassword =
document
.getElementById("confirmPassword")
.value;



let message =
document
.getElementById("message");







if(oldPassword !== user.password){


message.innerText =
"Mật khẩu cũ không chính xác";


return;


}






if(newPassword.length < 8){


message.innerText =
"Mật khẩu phải có ít nhất 8 ký tự";


return;


}






if(newPassword !== confirmPassword){


message.innerText =
"Xác nhận mật khẩu không khớp";


return;


}






user.password = newPassword;



message.innerText =
"Đổi mật khẩu thành công";


}









// =======================================
// NÚT LƯU CHUNG
// =======================================


function saveCurrent(){


let password =
document
.getElementById("passwordInfo");



if(password.style.display==="block"){


changePassword();


}
else{


saveProfile();


}


}



</script>
