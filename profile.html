<!doctype html>

        <!-- =================================================

          <!-- ĐỔI MẬT KHẨU -->

              ></path>

              <circle
                cx="12"
                cy="15"
                r="1"
                fill="currentColor"
              ></circle>
            </svg>

            <span class="history-menu-text">
              Đổi mật khẩu
            </span>

          </a>

          <!-- BÀI VIẾT YÊU THÍCH -->
          <a

            class="history-menu-item"
          >

            <svg
              class="history-menu-icon"
              viewBox="0 0 24 24"

            >
              <path
                d="M20.8 8.8c0 5-8.8 10-8.8 10s-8.8-5-8.8-10A4.8 4.8 0 0112 6a4.8 4.8 0 018.8 2.8z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              ></path>
            </svg>

            <span class="history-menu-text">
              Bài viết yêu thích

          </a>
          <!-- LỊCH SỬ -->
          <a

          >

            <svg

              viewBox="0 0 24 24"

              <path

                stroke="currentColor"

              ></path>

                d="M5 5.5v11M9 7h7M9 11h7"

                stroke-linecap="round"
              ></path>
            </svg>

            <span class="history-menu-text">
              Lịch sử đọc
            </span>

          </a>
          <!-- BÌNH LUẬN -->
          <a

              <path

                stroke="currentColor"
                stroke-width="1.7"

              <circle
                cx="9"

                r=".8"

              <circle

                r=".8"
                fill="currentColor"
              ></circle>

              <circle
                cx="15"

              ></circle>
            </svg>

            <span class="history-menu-text">
              Bình luận của tôi
            </span>

          <!-- THÔNG BÁO -->
          <a

            <svg

        <!-- =================================================

      <!-- ===================================================
           MAIN
      =================================================== -->

      <main class="profile-main">

        <div class="profile-main-inner">

          <h1
            class="profile-heading"
            id="pageHeading"
          >
            Quản lý tài khoản
          </h1>

          <div class="profile-heading-line"></div>

          <p
            class="profile-description"
            id="pageDescription"
          >
            Cập nhật thông tin cá nhân và bảo mật tài khoản.
          </p>

          <!-- =================================================
               THÔNG TIN CÁ NHÂN
          ================================================== -->

          <section
            class="profile-card"
            id="profileInfo"
          >

            <h2>
              Thông tin cá nhân
            </h2>
            <!-- AVATAR -->
            <div class="profile-avatar-upload">

              <img
                id="avatarPreview"
                src=""
                alt="Avatar"
              />

              <input
                type="file"
                id="avatar"
                accept="image/*"
              />

            </div>
            <!-- FORM -->

            <div class="profile-form">

              <label>
                Họ tên
              </label>

              <input
                id="fullname"
                type="text"
              />
              <label>
                Username
              </label>

              <input
                id="username"
                type="text"
              />

              <label>
                Email
              </label>

              <input
                id="email"
                type="email"
              />
              <label>
                Số điện thoại
              </label>

              <input
                id="phone"
                type="text"
              />
              <label>
                Ngày sinh
              </label>

              <input
                id="birthday"
                type="date"
              />

              <label>
                Bio
              </label>

              <textarea id="bio"></textarea>

            </div>

          </section>
          <!-- =================================================
               ĐỔI MẬT KHẨU
          ================================================== -->

          <section
            class="profile-card"
            id="passwordInfo"
            style="display: none;"
          >

            <h2>
              Đổi mật khẩu
            </h2>

            <div class="profile-form">

              <label>
                Mật khẩu cũ
              </label>

              <input
                id="oldPassword"
                type="password"
              />


              <label>
                Mật khẩu mới
              </label>

              <input
                id="newPassword"
                type="password"
              />


              <label>
                Xác nhận mật khẩu mới
              </label>

              <input
                id="confirmPassword"
                type="password"
              />

            </div>

          </section>
          <!-- BUTTON -->
          <button
            class="profile-button"
            id="saveButton"
            type="button"
          >
            Lưu thay đổi
          </button>

          <p id="message"></p>

        </div>

      </main>

    </div>

    <script src="mock-data.js"></script>

    <script>

      const user = MOCK_DATA.users[0];


      /* =====================================================
         ROLE
      ===================================================== */

      function roleName(role) {

        if (role === "user") {
          return "Độc giả";
        }

        if (role === "reporter") {
          return "Phóng viên";
        }

        if (role === "editor") {
          return "Biên tập viên";
        }

        if (role === "admin") {
          return "Quản trị viên";
        }

        return role || "Độc giả";
      }


      function getUserAvatar() {

        const savedAvatar =
          localStorage.getItem(
            "userAvatar_" + user.id
          );

        if (
          savedAvatar &&
          savedAvatar.trim() !== ""
        ) {
          return savedAvatar;
        }

        return user.avatar || "";
      }


      function loadAvatar() {

        const avatar = getUserAvatar();

        const sidebarAvatar =
          document.getElementById("sidebarAvatar");

        const avatarPreview =
          document.getElementById("avatarPreview");


        if (avatar) {

          sidebarAvatar.src = avatar;

          avatarPreview.src = avatar;

        }

      }

      /* =====================================================
         LOAD USER
      ===================================================== */

      function loadUser() {

        document.getElementById("sidebarName").textContent =
          user.full_name || user.username || "Người dùng";


        document.getElementById("sidebarRole").textContent =
          roleName(user.role);


        document.getElementById("fullname").value =
          user.full_name || "";


        document.getElementById("username").value =
          user.username || "";


        document.getElementById("email").value =
          user.email || "";


        document.getElementById("phone").value =
          user.phone || "";


        document.getElementById("birthday").value =
          user.date_of_birth || "";


        document.getElementById("bio").value =
          user.bio || "";


        loadAvatar();

      }
      /* =====================================================
         HIỂN THỊ PROFILE
      ===================================================== */

      function showProfile() {

        document.getElementById("profileInfo").style.display =
          "block";

        document.getElementById("passwordInfo").style.display =
          "none";


        document.getElementById("pageHeading").textContent =
          "Quản lý tài khoản";


        document.getElementById("pageDescription").textContent =
          "Cập nhật thông tin cá nhân và bảo mật tài khoản.";


        document
          .querySelectorAll(".history-menu-item")
          .forEach(function(item) {

            item.classList.remove("active");

          });


        document
          .getElementById("profileMenu")
          .classList.add("active");

      }

      /* =====================================================
         HIỂN THỊ PASSWORD
      ===================================================== */

      function showPassword() {

        document.getElementById("profileInfo").style.display =
          "none";

        document.getElementById("passwordInfo").style.display =
          "block";


        document.getElementById("pageHeading").textContent =
          "Đổi mật khẩu";


        document.getElementById("pageDescription").textContent =
          "Cập nhật mật khẩu để bảo vệ tài khoản.";


        document
          .querySelectorAll(".history-menu-item")
          .forEach(function(item) {

            item.classList.remove("active");

          });

        document
          .getElementById("passwordMenu")
          .classList.add("active");

      }

      /* =====================================================
         AVATAR UPLOAD
      ===================================================== */

      document
        .getElementById("avatar")
        .addEventListener("change", function(event) {

          const file = event.target.files[0];

          if (!file) {
            return;
          }

          if (!file.type.startsWith("image/")) {

            document.getElementById("message").textContent =
              "Vui lòng chọn file hình ảnh.";

            return;
          }

          const reader = new FileReader();


          reader.onload = function(e) {

            const avatarURL = e.target.result;


            document.getElementById("avatarPreview").src =
              avatarURL;


            document.getElementById("sidebarAvatar").src =
              avatarURL;


            localStorage.setItem(
              "userAvatar_" + user.id,
              avatarURL
            );


            document.getElementById("message").textContent =
              "Đã cập nhật ảnh đại diện.";

          };

          reader.readAsDataURL(file);

        });

      /* =====================================================
         SAVE PROFILE
      ===================================================== */

      function saveProfile() {

        const message =
          document.getElementById("message");


        const username =
          document
            .getElementById("username")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        /* CHECK USERNAME */

        const usernameExists =
          MOCK_DATA.users.some(function(u) {

            return (
              u.username === username &&
              u.id !== user.id
            );

          });

        if (usernameExists) {

          message.textContent =
            "Username đã được sử dụng.";

          return;

        }

        /* CHECK EMAIL */

        const emailRegex =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailRegex.test(email)) {

          message.textContent =
            "Email không đúng định dạng.";

          return;

        }
        /* UPDATE */

        user.full_name =
          document
            .getElementById("fullname")
            .value
            .trim();


        user.username =
          username;


        user.email =
          email;


        user.phone =
          document
            .getElementById("phone")
            .value
            .trim();


        user.date_of_birth =
          document
            .getElementById("birthday")
            .value;


        user.bio =
          document
            .getElementById("bio")
            .value
            .trim();


        /* UPDATE SIDEBAR */

        document.getElementById("sidebarName").textContent =
          user.full_name || user.username;


        message.textContent =
          "Cập nhật thông tin tài khoản thành công.";

      }

      /* =====================================================
         CHANGE PASSWORD
      ===================================================== */

      function changePassword() {

        const message =
          document.getElementById("message");


        const oldPassword =
          document.getElementById("oldPassword").value;


        const newPassword =
          document.getElementById("newPassword").value;


        const confirmPassword =
          document.getElementById("confirmPassword").value;


        if (oldPassword !== user.password) {

          message.textContent =
            "Mật khẩu cũ không chính xác.";

          return;

        }


        if (newPassword.length < 8) {

          message.textContent =
            "Mật khẩu phải có ít nhất 8 ký tự.";

          return;

        }


        if (newPassword !== confirmPassword) {

          message.textContent =
            "Xác nhận mật khẩu không khớp.";

          return;

        }


        user.password =
          newPassword;


        document.getElementById("oldPassword").value = "";

        document.getElementById("newPassword").value = "";

        document.getElementById("confirmPassword").value = "";


        message.textContent =
          "Đổi mật khẩu thành công.";

      }

      /* =====================================================
         NÚT LƯU
      ===================================================== */

      document
        .getElementById("saveButton")
        .addEventListener("click", function() {

          const passwordVisible =
            document.getElementById("passwordInfo").style.display
            === "block";


          if (passwordVisible) {

            changePassword();

          } else {

            saveProfile();

          }

        });


      function loadTabFromHash() {

        if (
          window.location.hash === "#password"
        ) {

          showPassword();

        } else {

          showProfile();

        }

      }

      window.addEventListener(
        "hashchange",
        function() {

          loadTabFromHash();

        }
      );

      loadUser();

      loadTabFromHash();

    </script>

  </body>
