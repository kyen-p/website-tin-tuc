<!-- ===================================================
     MOCK DATA
     my-topics.html nằm trong reporter/
     mock-data.js nằm trong assets/
     => ../assets/mock-data.js
=================================================== -->

<script src="../assets/mock-data.js"></script>



<script>


/* =====================================================
   LẤY USER HIỆN TẠI
===================================================== */

const storedUserId =
    localStorage.getItem("user_id");


let currentReporter = null;



/* =====================================================
   KIỂM TRA MOCK DATA
===================================================== */

if (
    typeof MOCK_DATA !== "undefined" &&
    Array.isArray(MOCK_DATA.users)
) {


    /* =================================================
       ƯU TIÊN USER_ID ĐANG ĐĂNG NHẬP
    ================================================= */

    if (storedUserId) {

        currentReporter =
            MOCK_DATA.users.find(
                user =>

                    String(user.id) ===
                    String(storedUserId) &&

                    user.role === "reporter"
            );

    }



    /* =================================================
       NẾU KHÔNG CÓ -> LẤY REPORTER ACTIVE
    ================================================= */

    if (!currentReporter) {

        currentReporter =
            MOCK_DATA.users.find(
                user =>

                    user.role === "reporter" &&

                    user.status === "active"
            );

    }



    /* =================================================
       NẾU KHÔNG CÓ ACTIVE -> LẤY REPORTER BẤT KỲ
    ================================================= */

    if (!currentReporter) {

        currentReporter =
            MOCK_DATA.users.find(
                user =>
                    user.role === "reporter"
            );

    }

}



/* =====================================================
   DATA
===================================================== */

const users =
    typeof MOCK_DATA !== "undefined" &&
    Array.isArray(MOCK_DATA.users)

        ? MOCK_DATA.users

        : [];


const topics =
    typeof MOCK_DATA !== "undefined" &&
    Array.isArray(MOCK_DATA.topics)

        ? MOCK_DATA.topics

        : [];


const categories =
    typeof MOCK_DATA !== "undefined" &&
    Array.isArray(MOCK_DATA.categories)

        ? MOCK_DATA.categories

        : [];


const tags =
    typeof MOCK_DATA !== "undefined" &&
    Array.isArray(MOCK_DATA.tags)

        ? MOCK_DATA.tags

        : [];


const topicTags =
    typeof MOCK_DATA !== "undefined" &&
    Array.isArray(MOCK_DATA.topic_tags)

        ? MOCK_DATA.topic_tags

        : [];



/* =====================================================
   ELEMENT
===================================================== */

const sidebarName =
    document.getElementById(
        "sidebarName"
    );


const sidebarAvatar =
    document.getElementById(
        "sidebarAvatar"
    );


const sidebarRole =
    document.getElementById(
        "sidebarRole"
    );


const topicList =
    document.getElementById(
        "topicList"
    );



/* =====================================================
   LOAD USER SIDEBAR
===================================================== */

function loadUser(user) {


    if (!user) {

        sidebarName.textContent =
            "Người dùng";


        sidebarRole.textContent =
            "Phóng viên";


        sidebarAvatar.removeAttribute(
            "src"
        );


        return;

    }



    /* =================================================
       NAME
    ================================================= */

    const name =
        user.full_name ||
        user.username ||
        "Người dùng";


    sidebarName.textContent =
        name;



    /* =================================================
       ROLE
    ================================================= */

    sidebarRole.textContent =
        "Phóng viên";



    /* =================================================
       AVATAR
       LẤY TỪ MOCK_DATA
    ================================================= */

    const savedAvatar =
        localStorage.getItem(
            "userAvatar_" + user.id
        );


    const avatarURL =
        savedAvatar ||
        user.avatar ||
        "";



    if (avatarURL) {

        sidebarAvatar.src =
            avatarURL;


        sidebarAvatar.alt =
            "Ảnh đại diện " + name;

    }

    else {

        sidebarAvatar.removeAttribute(
            "src"
        );


        sidebarAvatar.alt =
            "Ảnh đại diện " + name;

    }



    /* =================================================
       XỬ LÝ AVATAR LỖI
    ================================================= */

    sidebarAvatar.onerror =
        function () {

            sidebarAvatar.onerror =
                null;


            if (
                user.avatar &&
                user.avatar !== avatarURL
            ) {

                sidebarAvatar.src =
                    user.avatar;

            }

            else {

                sidebarAvatar.removeAttribute(
                    "src"
                );

            }

        };

}



/* =====================================================
   GET CATEGORY NAME
===================================================== */

function getCategoryName(
    categoryId
) {


    const category =
        categories.find(
            item =>
                String(item.id) ===
                String(categoryId)
        );


    return category

        ? category.name

        : "Chưa phân loại";

}



/* =====================================================
   GET TAGS OF TOPIC
===================================================== */

function getTopicTags(
    topicId
) {


    const relations =
        topicTags.filter(
            relation =>

                String(
                    relation.topic_id
                ) ===

                String(
                    topicId
                )
        );



    return relations

        .map(
            relation => {

                const tag =
                    tags.find(
                        item =>

                            String(
                                item.id
                            ) ===

                            String(
                                relation.tag_id
                            )
                    );


                return tag
                    ? tag.name
                    : null;

            }
        )

        .filter(
            Boolean
        );

}



/* =====================================================
   FORMAT DEADLINE
===================================================== */

function formatDeadline(
    dateString
) {


    if (!dateString) {

        return "Chưa có";

    }


    const date =
        new Date(
            String(
                dateString
            ).replace(
                " ",
                "T"
            )
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Chưa có";

    }


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const year =
        date.getFullYear();


    return `${day}/${month}/${year}`;

}



/* =====================================================
   STATUS
===================================================== */

function getStatusInfo(
    status
) {


    const statusMap = {


        assigned: {

            text:
                "Đã giao",

            className:
                "assigned"

        },


        submitted: {

            text:
                "Đã nộp",

            className:
                "submitted"

        },


        overdue: {

            text:
                "Quá hạn",

            className:
                "overdue"

        }

    };


    return (

        statusMap[status]

        ||

        {

            text:
                status ||
                "Chưa xác định",

            className:
                ""

        }

    );

}



/* =====================================================
   GET TOPIC BUTTON
===================================================== */

function getTopicButton(
    topic
) {


    if (
        topic.status ===
        "submitted"
    ) {

        return `

            <a
                href="../public/article-detail.html"
                class="topic-button secondary"
            >
                Xem bài đã nộp
            </a>

        `;

    }



    return `

        <a
            href="write-article.html?topic_id=${encodeURIComponent(topic.id)}"
            class="topic-button"
        >
            Bắt đầu viết
        </a>

    `;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {


    return String(
        value || ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   RENDER TOPIC
===================================================== */

function renderTopic(
    topic
) {


    const status =
        getStatusInfo(
            topic.status
        );


    const topicTagNames =
        getTopicTags(
            topic.id
        );


    const tagText =
        topicTagNames.length > 0

            ? topicTagNames
                .map(escapeHtml)
                .join(", ")

            : "Chưa có tag";



    return `

        <div class="topic-card">


            <div class="topic-header">


                <h2>

                    ${
                        escapeHtml(
                            topic.title ||
                            "Không có tiêu đề"
                        )
                    }

                </h2>


                <span
                    class="topic-status ${status.className}"
                >

                    ${escapeHtml(
                        status.text
                    )}

                </span>


            </div>



            <div class="topic-info">


                <p>

                    <strong>
                        Chuyên mục:
                    </strong>


                    ${
                        escapeHtml(
                            getCategoryName(
                                topic.category_id
                            )
                        )
                    }

                </p>



                <p>

                    <strong>
                        Tag:
                    </strong>


                    ${tagText}

                </p>



                <p>

                    <strong>
                        Deadline:
                    </strong>


                    ${
                        formatDeadline(
                            topic.deadline
                        )
                    }

                </p>


            </div>



            <div class="topic-actions">

                ${getTopicButton(topic)}

            </div>


        </div>

    `;

}



/* =====================================================
   LẤY ĐỀ TÀI CỦA REPORTER HIỆN TẠI
===================================================== */

function getMyTopics() {


    if (!currentReporter) {

        return [];

    }


    return topics.filter(
        topic =>

            String(
                topic.reporter_id
            ) ===

            String(
                currentReporter.id
            )
    );

}



/* =====================================================
   RENDER TOPIC LIST
===================================================== */

function loadTopics() {


    const myTopics =
        getMyTopics();



    if (
        myTopics.length ===
        0
    ) {


        topicList.innerHTML = `

            <div class="topic-empty">

                <p>
                    Hiện chưa có đề tài nào được phân công.
                </p>

            </div>

        `;


        return;

    }



    topicList.innerHTML =
        myTopics
            .map(
                renderTopic
            )
            .join("");

}



/* =====================================================
   LOAD PAGE
===================================================== */

loadUser(
    currentReporter
);


loadTopics();


</script>
