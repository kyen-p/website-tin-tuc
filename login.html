<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Tin Mới</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="login.html">TIN<span>MỚI</span></a>
      <a class="btn btn-outline" href="register.html">Đăng ký</a>
    </div>
  </header>

  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="auth-head">
        <h1>Đăng nhập</h1>
        <p>Đăng nhập để đọc tin và sử dụng các tính năng cá nhân.</p>
      </div>

      <form action="#" method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email"
                 placeholder="Nhập email của bạn" required>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input class="form-control" type="password" id="password" name="password"
                 placeholder="Nhập mật khẩu" required>
        </div>

        <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:20px">
          <label class="checkbox">
            <input type="checkbox" name="remember">
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="#" style="color:var(--primary);font-size:14px;font-weight:700">Quên mật khẩu?</a>
        </div>

        <button class="btn btn-primary btn-full" type="submit">Đăng nhập</button>
      </form>

      <div class="divider">hoặc</div>

      <p class="form-footer">
        Chưa có tài khoản?
        <a href="register.html">Đăng ký ngay</a>
      </p>
    </section>
  </main>
</body>
</html>
