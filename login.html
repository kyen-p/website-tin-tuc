<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng nhập — Mạch Tin</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="style.css/login.css" />
  </head>

  <body>
    <!-- =========================================
         LOGIN
    ========================================== -->
    <main>
      <div class="auth-page">
        <div class="auth-wrapper">
          <!-- =====================================
               LOGO MẠCH TIN
          ====================================== -->
          <a href="index.html" class="auth-logo">
            <svg
              class="pulse-mark"
              width="26"
              height="26"
              viewBox="0 0 26 26"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M1 13H7L9.5 6L13.5 20L16 13H25"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="logo__word"> MẠCH&nbsp;<em>TIN</em> </span>
          </a>
          <!-- =====================================
               FORM ĐĂNG NHẬP
          ====================================== -->
          <section class="auth-card">
            <h1>Đăng nhập</h1>

            <p class="dek">Đăng nhập để sử dụng các tính năng cá nhân.</p>
            <div class="alert is-error" id="login-error">
              Sai thông tin đăng nhập.
            </div>
            <div class="alert is-info" id="forgot-msg">
              Tính năng đang phát triển, vui lòng liên hệ Admin.
            </div>

            <!-- ===================================
                 LOGIN FORM
            ==================================== -->
            <form id="login-form">
              <div class="field">
                <label for="login-id"> Email hoặc username </label>

                <input
                  type="text"
                  id="login-id"
                  placeholder="email@vidu.com hoặc username"
                  required
                />
              </div>

              <div class="field">
                <label for="password"> Mật khẩu </label>

                <input
                  type="password"
                  id="password"
                  placeholder="Nhập mật khẩu"
                  required
                />
              </div>
              <!-- ===================== GHI NHỚ / QUÊN MẬT KHẨU================= -->
              <div class="auth-links">
                <label class="remember-login">
                  <input type="checkbox" id="remember" />

                  <span>Ghi nhớ đăng nhập</span>
                </label>

                <a href="#" id="forgot-link"> Quên mật khẩu? </a>
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                Đăng nhập
              </button>
            </form>
            <p class="form-footer">
              Chưa có tài khoản?

              <a href="register.html"> Đăng ký ngay </a>
            </p>
          </section>
        </div>
      </div>
    </main>

    <script src="mock-data.js"></script>

    <script>
      document
        .getElementById("forgot-link")
        .addEventListener("click", function (e) {
          e.preventDefault();
          document.getElementById("forgot-msg").style.display = "block";
          document.getElementById("login-error").style.display = "none";
        });

      document
        .getElementById("login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const loginId = document
            .getElementById("login-id")
            .value.trim()
            .toLowerCase();
          const pass = document.getElementById("password").value;
          // Tìm theo username hoặc email (không phân biệt hoa thường)
          const user = MOCK_DATA.users.find(
            (u) =>
              u.username.toLowerCase() === loginId ||
              u.email.toLowerCase() === loginId,
          );

          if (user && user.password === pass && user.status === "active") {
            window.location.href = "index.html";
          } else {
            document.getElementById("login-error").style.display = "block";
            document.getElementById("forgot-msg").style.display = "none";
          }
        });
    </script>
  </body>
</html>
