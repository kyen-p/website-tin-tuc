<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng nhập — Mạch Tin</title>

    <!-- CSS CHUNG -->
    <link rel="stylesheet" href="style.css" />

    <!-- CSS RIÊNG TRANG LOGIN -->
    <link rel="stylesheet" href="style.css/login.css" />
  </head>

  <body>
    <!-- =========================================
         LOGIN
    ========================================== -->
    <main>
      <div class="auth-page">
        <div class="auth-wrapper">
          <!-- =====================================
               LOGO MẠCH TIN
          ====================================== -->
          <a href="index.html" class="auth-logo">
            <!-- NHỊP TIM -->
            <svg
              class="pulse-mark"
              width="26"
              height="26"
              viewBox="0 0 26 26"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M1 13H7L9.5 6L13.5 20L16 13H25"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <!-- MẠCH TIN -->
            <span class="logo__word"> MẠCH&nbsp;<em>TIN</em> </span>
          </a>

          <!-- =====================================
               FORM ĐĂNG NHẬP
          ====================================== -->
          <section class="auth-card">
            <h1>Đăng nhập</h1>

            <p class="dek">Đăng nhập để sử dụng các tính năng cá nhân.</p>

            <!-- THÔNG BÁO SAI TÀI KHOẢN -->
            <div class="alert is-error" id="login-error">
              Sai thông tin đăng nhập.
            </div>

            <!-- THÔNG BÁO QUÊN MẬT KHẨU -->
            <div class="alert is-info" id="forgot-msg">
              Tính năng đang phát triển, vui lòng liên hệ Admin.
            </div>

            <!-- ===================================
                 LOGIN FORM
            ==================================== -->
            <form id="login-form">
              <!-- EMAIL / USERNAME -->
              <div class="field">
                <label for="login-id"> Email hoặc username </label>

                <input
                  type="text"
                  id="login-id"
                  placeholder="email@vidu.com hoặc username"
                  required
                />
              </div>

              <!-- MẬT KHẨU -->
              <div class="field">
                <label for="password"> Mật khẩu </label>

                <input
                  type="password"
                  id="password"
                  placeholder="Nhập mật khẩu"
                  required
                />
              </div>

              <!-- =================================
                   GHI NHỚ / QUÊN MẬT KHẨU
              ================================== -->
              <div class="auth-links">
                <label class="remember-login">
                  <input type="checkbox" id="remember" />

                  <span>Ghi nhớ đăng nhập</span>
                </label>

                <a href="#" id="forgot-link"> Quên mật khẩu? </a>
              </div>

              <!-- BUTTON -->
              <button type="submit" class="btn btn-primary btn-block">
                Đăng nhập
              </button>
            </form>

            <!-- =================================
                 ĐĂNG KÝ
            ================================== -->
            <p class="form-footer">
              Chưa có tài khoản?

              <a href="register.html"> Đăng ký ngay </a>
            </p>
          </section>
        </div>
      </div>
    </main>

    <!-- =========================================
         JAVASCRIPT
    ========================================== -->
    <script>
      /* =========================================
         QUÊN MẬT KHẨU
      ========================================== */

      document
        .getElementById("forgot-link")
        .addEventListener("click", function (e) {
          e.preventDefault();

          document.getElementById("forgot-msg").style.display = "block";

          document.getElementById("login-error").style.display = "none";
        });

      /* =========================================
         ĐĂNG NHẬP DEMO
         Mật khẩu: 12345678
      ========================================== */

      document
        .getElementById("login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const loginId = document.getElementById("login-id").value.trim();

          const pass = document.getElementById("password").value;

          /* =====================================
             TÀI KHOẢN DEMO
          ====================================== */

          const validUsers = [
            "user01",
            "user02",
            "user03",
            "user04",
            "reporter01",
            "reporter02",
            "editor01",
            "admin01",
          ];

          /* =====================================
             KIỂM TRA ĐĂNG NHẬP
          ====================================== */

          if (validUsers.includes(loginId) && pass === "12345678") {
            window.location.href = "index.html";
          } else {
            document.getElementById("login-error").style.display = "block";

            document.getElementById("forgot-msg").style.display = "none";
          }
        });
    </script>
  </body>
</html>
