  <!-- =====================================================
       MOCK DATA
       CHỈ ĐƯỜNG DẪN TỚI MOCK DATA
       ===================================================== -->
  <script src="mock-data.js"></script>


  <!-- =====================================================
       NOTIFICATION SCRIPT
       ===================================================== -->
  <script>

    // -----------------------------------------------------
    // LẤY USER HIỆN TẠI TỪ LOGIN
    // -----------------------------------------------------

    function getCurrentUserId() {

      const possibleKeys = [
        "currentUserId",
        "userId",
        "user_id",
        "loggedInUserId",
        "logged_user_id"
      ];

      for (const key of possibleKeys) {

        const value = localStorage.getItem(key);

        if (value !== null && value !== "") {

          const id = Number(value);

          if (!Number.isNaN(id)) {
            return id;
          }

        }

      }

      return null;
    }


    // -----------------------------------------------------
    // USER HIỆN TẠI
    // -----------------------------------------------------

    const currentUserId = getCurrentUserId();

    const currentUser =
      MOCK_DATA.users.find(
        user => Number(user.id) === Number(currentUserId)
      );


    // -----------------------------------------------------
    // HIỂN THỊ USER SIDEBAR
    // -----------------------------------------------------

    function renderUser() {

      const userName =
        document.getElementById("userName");

      const userRole =
        document.getElementById("userRole");

      const userAvatar =
        document.getElementById("userAvatar");


      if (!currentUser) {

        userName.textContent = "Người dùng";
        userRole.textContent = "USER";
        userAvatar.textContent = "U";

        return;
      }


      userName.textContent =
        currentUser.full_name;


      const roleNames = {
        user: "Độc giả",
        reporter: "Phóng viên",
        editor: "Biên tập viên",
        admin: "Quản trị viên"
      };


      userRole.textContent =
        roleNames[currentUser.role] ||
        currentUser.role;


      if (currentUser.avatar) {

        const image =
          document.createElement("img");

        image.src =
          currentUser.avatar;

        image.alt =
          currentUser.full_name;


        image.onerror = function () {

          userAvatar.innerHTML = "";

          userAvatar.textContent =
            getInitials(currentUser.full_name);

        };


        userAvatar.innerHTML = "";

        userAvatar.appendChild(image);

      } else {

        userAvatar.textContent =
          getInitials(currentUser.full_name);

      }

    }


    // -----------------------------------------------------
    // LẤY CHỮ CÁI ĐẦU
    // -----------------------------------------------------

    function getInitials(name) {

      if (!name) {
        return "U";
      }

      const words =
        name.trim().split(/\s+/);


      if (words.length === 1) {

        return words[0]
          .charAt(0)
          .toUpperCase();

      }


      return (
        words[0].charAt(0) +
        words[words.length - 1].charAt(0)
      ).toUpperCase();

    }


    // -----------------------------------------------------
    // FORMAT NGÀY
    // -----------------------------------------------------

    function formatDate(dateString) {

      const date =
        new Date(
          dateString.replace(" ", "T")
        );


      if (Number.isNaN(date.getTime())) {
        return dateString;
      }


      const day =
        String(date.getDate()).padStart(2, "0");

      const month =
        String(date.getMonth() + 1).padStart(2, "0");

      const year =
        date.getFullYear();

      const hours =
        String(date.getHours()).padStart(2, "0");

      const minutes =
        String(date.getMinutes()).padStart(2, "0");


      return `${day}/${month}/${year} · ${hours}:${minutes}`;

    }


    // -----------------------------------------------------
    // TÊN LOẠI THÔNG BÁO
    // -----------------------------------------------------

    function getNotificationType(type) {

      const types = {

        topic_assigned:
          "ĐỀ TÀI",

        article_rejected:
          "BÀI VIẾT",

        article_approved:
          "BÀI VIẾT",

        comment_locked:
          "BÌNH LUẬN"

      };


      return types[type] ||
        "THÔNG BÁO";

    }


    // -----------------------------------------------------
    // CHUYỂN LINK TỪ MOCK DATA
    // -----------------------------------------------------

    function resolveNotificationLink(link) {

      if (!link) {
        return "notifications.html";
      }


      if (link.startsWith("/")) {

        const parts =
          link.split("/").filter(Boolean);


        if (parts.length > 0) {

          return parts[parts.length - 1];

        }

      }


      return link;

    }


    // -----------------------------------------------------
    // CLICK THÔNG BÁO
    // -----------------------------------------------------

    function handleNotificationClick(notification) {

      notification.is_read = true;


      localStorage.setItem(
        "mockNotifications",
        JSON.stringify(MOCK_DATA.notifications)
      );


      const target =
        resolveNotificationLink(
          notification.link
        );


      window.location.href =
        target;

    }


    // -----------------------------------------------------
    // LOAD TRẠNG THÁI ĐÃ ĐỌC
    // -----------------------------------------------------

    function loadNotificationState() {

      const saved =
        localStorage.getItem(
          "mockNotifications"
        );


      if (!saved) {
        return;
      }


      try {

        const savedNotifications =
          JSON.parse(saved);


        if (!Array.isArray(savedNotifications)) {
          return;
        }


        savedNotifications.forEach(
          savedNotification => {

            const notification =
              MOCK_DATA.notifications.find(
                item =>
                  Number(item.id) ===
                  Number(savedNotification.id)
              );


            if (notification) {

              notification.is_read =
                savedNotification.is_read;

            }

          }
        );


      } catch (error) {

        console.warn(
          "Không thể đọc trạng thái thông báo:",
          error
        );

      }

    }


    // -----------------------------------------------------
    // RENDER NOTIFICATIONS
    // -----------------------------------------------------

    function renderNotifications() {

      const list =
        document.getElementById(
          "notificationsList"
        );

      const empty =
        document.getElementById(
          "notificationsEmpty"
        );

      const error =
        document.getElementById(
          "notificationsError"
        );


      list.innerHTML = "";

      error.style.display = "none";


      // Không có user đăng nhập
      if (!currentUser) {

        empty.style.display = "block";

        return;

      }


      // Chỉ lấy notification thuộc user hiện tại
      const userNotifications =
        MOCK_DATA.notifications
          .filter(
            notification =>
              Number(notification.user_id) ===
              Number(currentUser.id)
          )
          .sort(
            (a, b) =>
              new Date(
                b.created_at.replace(" ", "T")
              ) -
              new Date(
                a.created_at.replace(" ", "T")
              )
          );


      // User không có notification
      if (userNotifications.length === 0) {

        empty.style.display = "block";

        return;

      }


      empty.style.display = "none";


      userNotifications.forEach(
        notification => {

          const item =
            document.createElement("button");


          item.type = "button";

          item.className =
            "notifications-item";


          if (!notification.is_read) {

            item.classList.add("unread");

          }


          // ICON
          const icon =
            document.createElement("div");

          icon.className =
            "notifications-item-icon";

          icon.innerHTML =
            getNotificationIcon(
              notification.type
            );


          // CONTENT
          const content =
            document.createElement("div");

          content.className =
            "notifications-item-content";


          // TOP
          const top =
            document.createElement("div");

          top.className =
            "notifications-item-top";


          const type =
            document.createElement("span");

          type.className =
            "notifications-item-type";

          type.textContent =
            getNotificationType(
              notification.type
            );


          const date =
            document.createElement("time");

          date.className =
            "notifications-item-date";

          date.textContent =
            formatDate(
              notification.created_at
            );


          top.appendChild(type);
          top.appendChild(date);


          // TITLE
          const title =
            document.createElement("h2");

          title.className =
            "notifications-item-title";

          title.textContent =
            notification.title;


          // DESCRIPTION
          const description =
            document.createElement("p");

          description.className =
            "notifications-item-description";

          description.textContent =
            notification.content;


          // STATUS
          const status =
            document.createElement("span");

          status.className =
            "notifications-item-status";

          status.textContent =
            notification.is_read
              ? "Đã đọc"
              : "Chưa đọc";


          content.appendChild(top);
          content.appendChild(title);
          content.appendChild(description);
          content.appendChild(status);


          // ARROW
          const arrow =
            document.createElement("div");

          arrow.className =
            "notifications-item-arrow";

          arrow.innerHTML = `
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8">
              <path d="M9 5L16 12L9 19"></path>
            </svg>
          `;


          item.appendChild(icon);
          item.appendChild(content);
          item.appendChild(arrow);


          // CLICK
          item.addEventListener(
            "click",
            function () {

              handleNotificationClick(
                notification
              );

            }
          );


          list.appendChild(item);

        }
      );

    }


    // -----------------------------------------------------
    // ICON
    // -----------------------------------------------------

    function getNotificationIcon(type) {

      const icons = {

        topic_assigned: `
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7">
            <path d="M4 6H20"></path>
            <path d="M4 12H16"></path>
            <path d="M4 18H13"></path>
            <circle cx="18" cy="16" r="3"></circle>
            <path d="M18 14.5V16L19 17"></path>
          </svg>
        `,

        article_rejected: `
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7">
            <path d="M5 4H15L19 8V20H5V4Z"></path>
            <path d="M14 4V9H19"></path>
            <path d="M9 12L15 18"></path>
            <path d="M15 12L9 18"></path>
          </svg>
        `,

        article_approved: `
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7">
            <path d="M5 4H15L19 8V20H5V4Z"></path>
            <path d="M14 4V9H19"></path>
            <path d="M8 14L11 17L16 11"></path>
          </svg>
        `,

        comment_locked: `
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7">
            <rect x="5" y="10"
                  width="14"
                  height="10"
                  rx="1.5"></rect>
            <path d="M8 10V7.5C8 5.6 9.8 4 12 4C14.2 4 16 5.6 16 7.5V10"></path>
          </svg>
        `

      };


      return (
        icons[type] ||
        `
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7">
            <path d="M18 9C18 5.7 15.8 3.5 12 3.5C8.2 3.5 6 5.7 6 9V13L4 16H20L18 13V9Z"></path>
            <path d="M10 19C10.5 20 11.2 20.5 12 20.5C12.8 20.5 13.5 20 14 19"></path>
          </svg>
        `
      );

    }


    // -----------------------------------------------------
    // INIT
    // -----------------------------------------------------

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        loadNotificationState();

        renderUser();

        renderNotifications();

      }
    );

  </script>
