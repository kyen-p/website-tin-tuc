<script src="mock-data.js"></script>


<script>

/* =====================================================
   1. LẤY USER
===================================================== */

const CURRENT_USER_ID = 1;

const user =
    MOCK_DATA.users.find(
        u => Number(u.id) === CURRENT_USER_ID
    );


/* =====================================================
   2. ROLE
===================================================== */

function roleName(role) {

    if (role === "user") {
        return "Độc giả";
    }

    if (role === "reporter") {
        return "Phóng viên";
    }

    if (role === "editor") {
        return "Biên tập viên";
    }

    if (role === "admin") {
        return "Quản trị viên";
    }

    return role || "Độc giả";
}


/* =====================================================
   3. INITIALS
===================================================== */

function getInitials(name) {

    if (!name) {
        return "U";
    }

    const words =
        name.trim().split(/\s+/);

    if (words.length === 1) {

        return words[0]
            .substring(0, 2)
            .toUpperCase();

    }

    return (
        words[0].charAt(0) +
        words[words.length - 1].charAt(0)
    ).toUpperCase();

}


/* =====================================================
   4. LẤY AVATAR
   ƯU TIÊN:
   1. Avatar mới trong localStorage
   2. Avatar trong mock-data.js
===================================================== */

function getUserAvatar() {

    if (!user) {
        return "";
    }

    const savedAvatar =
        localStorage.getItem(
            "userAvatar_" + user.id
        );

    if (savedAvatar) {
        return savedAvatar;
    }

    return user.avatar || "";

}


/* =====================================================
   5. HIỂN THỊ USER SIDEBAR
===================================================== */

function renderUser() {

    const userName =
        document.getElementById("userName");

    const userRole =
        document.getElementById("userRole");

    const userAvatar =
        document.getElementById("userAvatar");

    const userInitials =
        document.getElementById("userInitials");


    if (!user) {

        userName.innerText =
            "Người dùng";

        userRole.innerText =
            "Độc giả";

        userInitials.innerText =
            "U";

        return;

    }


    /* TÊN */

    userName.innerText =
        user.full_name ||
        user.username ||
        "Người dùng";


    /* ROLE */

    userRole.innerText =
        roleName(user.role);


    /* AVATAR */

    const avatar =
        getUserAvatar();


    /*
       Xóa avatar cũ trước khi render
    */

    const oldImage =
        userAvatar.querySelector("img");

    if (oldImage) {
        oldImage.remove();
    }


    /*
       Nếu có avatar
    */

    if (avatar) {

        const image =
            document.createElement("img");

        image.id =
            "sidebarAvatar";

        image.src =
            avatar;

        image.alt =
            "Ảnh đại diện " +
            (user.full_name || "Người dùng");


        image.onload =
            function () {

                userInitials.style.display =
                    "none";

            };


        image.onerror =
            function () {

                image.remove();

                userInitials.innerText =
                    getInitials(
                        user.full_name ||
                        user.username
                    );

                userInitials.style.display =
                    "block";

            };


        userAvatar.appendChild(image);

    }

    else {

        userInitials.innerText =
            getInitials(
                user.full_name ||
                user.username
            );

        userInitials.style.display =
            "block";

    }

}


/* =====================================================
   6. FORMAT NGÀY
===================================================== */

function formatDate(dateString) {

    if (!dateString) {
        return "";
    }

    const date =
        new Date(
            String(dateString)
                .replace(" ", "T")
        );


    if (Number.isNaN(date.getTime())) {
        return dateString;
    }


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const year =
        date.getFullYear();


    const hours =
        String(
            date.getHours()
        ).padStart(2, "0");


    const minutes =
        String(
            date.getMinutes()
        ).padStart(2, "0");


    return (
        `${day}/${month}/${year} · ` +
        `${hours}:${minutes}`
    );

}


/* =====================================================
   7. LOẠI THÔNG BÁO
===================================================== */

function getNotificationType(type) {

    const types = {

        topic_assigned:
            "ĐỀ TÀI",

        article_rejected:
            "BÀI VIẾT",

        article_approved:
            "BÀI VIẾT",

        comment_locked:
            "BÌNH LUẬN"

    };


    return (
        types[type] ||
        "THÔNG BÁO"
    );

}


/* =====================================================
   8. LINK
===================================================== */

function resolveNotificationLink(link) {

    if (!link) {
        return "notifications.html";
    }


    if (link.startsWith("/")) {

        const parts =
            link
                .split("/")
                .filter(Boolean);


        if (parts.length > 0) {

            return parts[
                parts.length - 1
            ];

        }

    }


    return link;

}


/* =====================================================
   9. CLICK NOTIFICATION
===================================================== */

function handleNotificationClick(
    notification
) {

    notification.is_read =
        true;


    localStorage.setItem(
        "mockNotifications",
        JSON.stringify(
            MOCK_DATA.notifications
        )
    );


    const target =
        resolveNotificationLink(
            notification.link
        );


    window.location.href =
        target;

}


/* =====================================================
   10. LOAD TRẠNG THÁI ĐỌC
===================================================== */

function loadNotificationState() {

    const saved =
        localStorage.getItem(
            "mockNotifications"
        );


    if (!saved) {
        return;
    }


    try {

        const savedNotifications =
            JSON.parse(saved);


        if (
            !Array.isArray(
                savedNotifications
            )
        ) {

            return;

        }


        savedNotifications.forEach(
            savedNotification => {

                const notification =
                    MOCK_DATA.notifications.find(
                        item =>
                            Number(item.id) ===
                            Number(
                                savedNotification.id
                            )
                    );


                if (notification) {

                    notification.is_read =
                        savedNotification.is_read;

                }

            }
        );

    }

    catch (error) {

        console.warn(
            "Không thể đọc trạng thái thông báo:",
            error
        );

    }

}


/* =====================================================
   11. RENDER NOTIFICATIONS
===================================================== */

function renderNotifications() {

    const list =
        document.getElementById(
            "notificationsList"
        );


    const empty =
        document.getElementById(
            "notificationsEmpty"
        );


    const error =
        document.getElementById(
            "notificationsError"
        );


    list.innerHTML =
        "";


    empty.style.display =
        "none";


    error.style.display =
        "none";


    if (!user) {

        empty.style.display =
            "block";

        return;

    }


    const userNotifications =
        Array.isArray(
            MOCK_DATA.notifications
        )

            ? MOCK_DATA.notifications

                .filter(
                    notification =>
                        Number(
                            notification.user_id
                        ) ===
                        Number(
                            user.id
                        )
                )

                .sort(
                    (a, b) =>
                        new Date(
                            String(
                                b.created_at
                            ).replace(
                                " ",
                                "T"
                            )
                        ) -
                        new Date(
                            String(
                                a.created_at
                            ).replace(
                                " ",
                                "T"
                            )
                        )
                )

            : [];


    if (
        userNotifications.length === 0
    ) {

        empty.style.display =
            "block";

        return;

    }


    userNotifications.forEach(
        notification => {


            const item =
                document.createElement(
                    "button"
                );


            item.type =
                "button";


            item.className =
                "notifications-item";


            if (!notification.is_read) {

                item.classList.add(
                    "unread"
                );

            }


            /* ICON */

            const icon =
                document.createElement(
                    "div"
                );


            icon.className =
                "notifications-item-icon";


            icon.innerHTML =
                getNotificationIcon(
                    notification.type
                );


            /* CONTENT */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "notifications-item-content";


            /* TOP */

            const top =
                document.createElement(
                    "div"
                );


            top.className =
                "notifications-item-top";


            const type =
                document.createElement(
                    "span"
                );


            type.className =
                "notifications-item-type";


            type.textContent =
                getNotificationType(
                    notification.type
                );


            const date =
                document.createElement(
                    "time"
                );


            date.className =
                "notifications-item-date";


            date.textContent =
                formatDate(
                    notification.created_at
                );


            top.appendChild(type);

            top.appendChild(date);


            /* TITLE */

            const title =
                document.createElement(
                    "h2"
                );


            title.className =
                "notifications-item-title";


            title.textContent =
                notification.title;


            /* DESCRIPTION */

            const description =
                document.createElement(
                    "p"
                );


            description.className =
                "notifications-item-description";


            description.textContent =
                notification.content;


            /* STATUS */

            const status =
                document.createElement(
                    "span"
                );


            status.className =
                "notifications-item-status";


            status.textContent =
                notification.is_read
                    ? "Đã đọc"
                    : "Chưa đọc";


            content.appendChild(top);

            content.appendChild(title);

            content.appendChild(
                description
            );

            content.appendChild(status);


            /* ARROW */

            const arrow =
                document.createElement(
                    "div"
                );


            arrow.className =
                "notifications-item-arrow";


            arrow.innerHTML = `

                <svg
                    viewBox="0 0 24 24"
                    fill="none">

                    <path
                        d="M9 5L16 12L9 19"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                    </path>

                </svg>

            `;


            /* APPEND */

            item.appendChild(icon);

            item.appendChild(content);

            item.appendChild(arrow);


            /* CLICK */

            item.addEventListener(
                "click",
                function () {

                    handleNotificationClick(
                        notification
                    );

                }
            );


            list.appendChild(item);

        }
    );

}
