<script src="mock-data.js"></script>
<script>
    const CURRENT_REPORTER_ID = 5;
    const users = MOCK_DATA.users;
    const topics = MOCK_DATA.topics;
    const categories = MOCK_DATA.categories;
    const tags = MOCK_DATA.tags;
    const topicTags = MOCK_DATA.topic_tags;

    // =================================================
    // FIND CURRENT USER
    // =================================================

    const currentUser = users.find(
        user => user.id === CURRENT_REPORTER_ID
    );

    // =================================================
    // LOAD USER TO SIDEBAR
    // =================================================

    if (currentUser) {

        document.getElementById("sidebarName").innerText =
            currentUser.full_name;

        document.getElementById("sidebarAvatar").src =
            currentUser.avatar;

        document.getElementById("sidebarAvatar").alt =
            currentUser.full_name;

    }
    // =================================================
    // GET CATEGORY NAME
    // =================================================

    function getCategoryName(categoryId) {

        const category = categories.find(
            category => category.id === categoryId
        );

        return category
            ? category.name
            : "Chưa phân loại";
    }
    // =================================================
    // GET TAGS OF TOPIC
    // =================================================

    function getTopicTags(topicId) {

        const relations = topicTags.filter(
            relation => relation.topic_id === topicId
        );

        return relations
            .map(relation => {

                const tag = tags.find(
                    tag => tag.id === relation.tag_id
                );

                return tag ? tag.name : null;

            })
            .filter(Boolean);
    }
    // =================================================
    // FORMAT DEADLINE
    // =================================================

    function formatDeadline(dateString) {

        if (!dateString) {
            return "Chưa có";
        }

        const date = new Date(
            dateString.replace(" ", "T")
        );

        const day = String(
            date.getDate()
        ).padStart(2, "0");

        const month = String(
            date.getMonth() + 1
        ).padStart(2, "0");

        const year = date.getFullYear();

        return `${day}/${month}/${year}`;
    }
    // =================================================
    // STATUS
    // =================================================

    function getStatusInfo(status) {

        const statusMap = {

            assigned: {
                text: "Đã giao",
                className: "assigned"
            },

            submitted: {
                text: "Đã nộp",
                className: "submitted"
            },

            overdue: {
                text: "Quá hạn",
                className: "overdue"
            }

        };


        return statusMap[status] || {

            text: status,
            className: ""

        };
    }
    // =================================================
    // GET TOPIC BUTTON
    // =================================================

    function getTopicButton(topic) {

        if (topic.status === "submitted") {

            return `
                <a
                    href="article-detail.html"
                    class="topic-button secondary">

                    Xem bài đã nộp

                </a>
            `;

        }
        return `
            <a
                href="write-article.html?topic_id=${topic.id}"
                class="topic-button">

                Bắt đầu viết

            </a>
        `;
    }

    // =================================================
    // RENDER TOPIC
    // =================================================

    function renderTopic(topic) {

        const status = getStatusInfo(
            topic.status
        );

        const topicTagNames =
            getTopicTags(topic.id);


        const tagText =
            topicTagNames.length > 0
                ? topicTagNames.join(", ")
                : "Chưa có tag";


        return `

            <div class="topic-card">

                <div class="topic-header">

                    <h2>
                        ${topic.title}
                    </h2>


                    <span
                        class="topic-status ${status.className}">

                        ${status.text}

                    </span>

                </div>


                <div class="topic-info">

                    <p>

                        <strong>
                            Chuyên mục:
                        </strong>

                        ${getCategoryName(topic.category_id)}

                    </p>


                    <p>

                        <strong>
                            Tag:
                        </strong>

                        ${tagText}

                    </p>


                    <p>

                        <strong>
                            Deadline:
                        </strong>

                        ${formatDeadline(topic.deadline)}

                    </p>

                </div>


                <div class="topic-actions">

                    ${getTopicButton(topic)}

                </div>

            </div>

        `;
    }
    // =================================================
    // FILTER TOPICS BY CURRENT REPORTER
    // =================================================

    const myTopics = topics.filter(
        topic =>
            topic.reporter_id === CURRENT_REPORTER_ID
    );
    // =================================================
    // RENDER TOPIC LIST
    // =================================================

    const topicList =
        document.getElementById("topicList");


    if (myTopics.length === 0) {

        topicList.innerHTML = `

            <div class="topic-empty">

                <p>
                    Hiện chưa có đề tài nào được phân công.
                </p>

            </div>

        `;

    } else {

        topicList.innerHTML =
            myTopics.map(renderTopic).join("");

    }

</script>
