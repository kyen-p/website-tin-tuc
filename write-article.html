<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soạn bài — Mạch Tin</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Layout Reporter */
      .reporter-layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        min-height: 100vh;
      }
      .reporter-sidebar {
        background: var(--ink);
        color: #c9c6bc;
        padding: 28px 0;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .reporter-sidebar .logo-area {
        padding: 0 20px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        margin-bottom: 16px;
      }
      .reporter-sidebar .logo-area .logo__word {
        color: var(--paper);
        font-size: 22px;
      }
      .reporter-sidebar .logo-area .logo__word em {
        color: var(--brass);
      }
      .reporter-sidebar .nav a {
        display: block;
        padding: 12px 20px;
        font-size: 14.5px;
        color: #c9c6bc;
        border-left: 3px solid transparent;
      }
      .reporter-sidebar .nav a:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
      }
      .reporter-sidebar .nav a.is-active {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border-left-color: var(--brass);
        font-weight: 600;
      }
      .reporter-sidebar .nav .back-home {
        margin-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 16px;
      }

      .reporter-main {
        background: var(--paper);
      }
      .reporter-topbar {
        background: var(--white);
        border-bottom: 1px solid var(--line);
        padding: 14px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .reporter-topbar .page-title {
        font-family: var(--f-display);
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      .reporter-content {
        padding: 28px;
      }

      /* Form viết bài */
      .write-grid {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 28px;
      }
      .write-main {
        background: var(--white);
        border: 1px solid var(--line);
        padding: 28px;
      }
      .write-side {
        background: var(--white);
        border: 1px solid var(--line);
        padding: 22px;
        height: fit-content;
        position: sticky;
        top: 20px;
      }
      .write-side h3 {
        font-family: var(--f-mono);
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }
      .cover-upload {
        border: 1px dashed var(--line);
        background: var(--paper-alt);
        aspect-ratio: 16/9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .cover-upload:hover {
        border-color: var(--brass);
      }
      .cover-upload p {
        font-size: 13.5px;
        color: var(--muted);
        margin: 0;
      }
      .toolbar {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .toolbar button {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        background: var(--white);
        border-radius: 2px;
        font-size: 14px;
        color: var(--ink);
      }
      .toolbar button:hover {
        border-color: var(--ink);
      }
      .content-area {
        min-height: 280px;
        border: 1px solid var(--line);
        padding: 14px;
        background: var(--white);
        font-size: 15.5px;
        line-height: 1.7;
      }
      .content-area:focus {
        outline: none;
        border-color: var(--brass);
      }
      .form-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .tip-list {
        font-size: 13.5px;
        color: var(--ink-soft);
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
      }
      .tip-list li {
        padding-left: 14px;
        position: relative;
      }
      .tip-list li::before {
        content: "•";
        position: absolute;
        left: 0;
        color: var(--brass);
      }

      @media (max-width: 900px) {
        .reporter-layout {
          grid-template-columns: 1fr;
        }
        .reporter-sidebar {
          height: auto;
          position: static;
        }
        .write-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="reporter-layout">
      <!-- SIDEBAR REPORTER -->
      <aside class="reporter-sidebar">
        <div class="logo-area">
          <a href="index.html" class="logo" style="gap: 10px">
            <svg
              class="pulse-mark"
              width="22"
              height="22"
              viewBox="0 0 26 26"
              fill="none"
            >
              <path
                d="M1 13H7L9.5 6L13.5 20L16 13H25"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="logo__word">MẠCH&nbsp;<em>TIN</em></span>
          </a>
        </div>

        <nav class="nav">
          <a href="write-article.html" class="is-active">Soạn bài</a>
          <a href="my-articles.html">Bài viết của tôi</a>
          <a href="my-topics.html">Đề tài của tôi</a>
          <a href="dashboard.html">Thống kê</a>
          <div class="back-home">
            <a href="index.html">← Về trang chủ</a>
          </div>
        </nav>
      </aside>

      <!-- MAIN -->
      <div class="reporter-main">
        <div class="reporter-topbar">
          <h1 class="page-title">Soạn bài viết</h1>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 12px;
              font-size: 14px;
              color: var(--muted);
            "
          >
            <span>Phóng viên</span>
            <div
              style="
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: var(--paper-alt);
                border: 1px solid var(--line);
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                font-size: 13px;
              "
            >
              PV
            </div>
          </div>
        </div>

        <div class="reporter-content">
          <form id="write-form">
            <div class="write-grid">
              <!-- Cột chính -->
              <div class="write-main">
                <div class="field">
                  <label for="title">Tiêu đề bài viết *</label>
                  <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Nhập tiêu đề bài viết..."
                    required
                  />
                </div>

                <div
                  style="
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 16px;
                  "
                >
                  <div class="field">
                    <label for="category">Chuyên mục *</label>
                    <select id="category" name="category" required>
                      <option value="">-- Chọn chuyên mục --</option>
                      <option>Thời sự</option>
                      <option>Kinh doanh</option>
                      <option>Thế giới</option>
                      <option>Công nghệ</option>
                      <option>Thể thao</option>
                      <option>Giải trí</option>
                      <option>Đời sống</option>
                      <option>Giáo dục</option>
                    </select>
                  </div>
                  <div class="field">
                    <label for="tags">Tag</label>
                    <input
                      type="text"
                      id="tags"
                      name="tags"
                      placeholder="Ví dụ: thuế, quốc hội, 2027"
                    />
                  </div>
                </div>

                <div class="field">
                  <label for="sapo">Sapo / Mô tả ngắn</label>
                  <textarea
                    id="sapo"
                    name="sapo"
                    rows="3"
                    placeholder="Viết phần tóm tắt ngắn cho bài viết..."
                  ></textarea>
                </div>

                <div class="field">
                  <label>Nội dung bài viết *</label>
                  <div class="toolbar">
                    <button type="button" title="In đậm"><b>B</b></button>
                    <button type="button" title="In nghiêng"><i>I</i></button>
                    <button type="button" title="Gạch chân"><u>U</u></button>
                    <button type="button" title="Danh sách">• List</button>
                    <button type="button" title="Chèn ảnh">🖼</button>
                  </div>
                  <div
                    class="content-area"
                    contenteditable="true"
                    id="content"
                    data-placeholder="Nhập nội dung bài viết tại đây..."
                  ></div>
                </div>

                <div class="form-actions">
                  <button
                    type="button"
                    class="btn btn-ghost"
                    onclick="window.location.href = 'my-articles.html'"
                  >
                    Hủy
                  </button>
                  <button type="button" class="btn btn-ghost" id="btn-draft">
                    Lưu nháp
                  </button>
                  <button type="submit" class="btn btn-primary">
                    Gửi duyệt
                  </button>
                </div>
              </div>

              <!-- Cột phụ -->
              <aside class="write-side">
                <h3>Ảnh bìa bài viết</h3>
                <label class="cover-upload" for="cover-input">
                  <svg
                    width="32"
                    height="32"
                    viewBox="0 0 24 24"
                    fill="none"
                    style="opacity: 0.5"
                  >
                    <path
                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                    />
                  </svg>
                  <p>Chọn ảnh bìa</p>
                  <span class="btn btn-ghost btn-sm">Tải ảnh lên</span>
                </label>
                <input type="file" id="cover-input" accept="image/*" hidden />

                <ul class="tip-list">
                  <li>Tiêu đề nên ngắn gọn, rõ nội dung chính.</li>
                  <li>Chọn đúng chuyên mục trước khi gửi duyệt.</li>
                  <li>Có thể lưu ở trạng thái <b>Nháp</b>.</li>
                  <li>Tag mới sẽ được hệ thống tạo tự động.</li>
                </ul>
              </aside>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Giả lập lưu nháp / gửi duyệt
      document
        .getElementById("btn-draft")
        .addEventListener("click", function () {
          alert("Đã lưu nháp thành công!");
          window.location.href = "my-articles.html";
        });

      document
        .getElementById("write-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const title = document.getElementById("title").value.trim();
          const category = document.getElementById("category").value;
          const content = document.getElementById("content").innerText.trim();

          if (!title || !category || !content) {
            alert("Vui lòng nhập đầy đủ Tiêu đề, Chuyên mục và Nội dung.");
            return;
          }
          alert("Đã gửi duyệt thành công!");
          window.location.href = "my-articles.html";
        });
    </script>
  </body>
</html>
