<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết của tôi - Phóng viên | Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Quản trị -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin-layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <div class="admin-workspace">
    <!-- 1. SIDEBAR CỐ ĐỊNH -->
    <aside id="admin-sidebar"></aside>

    <!-- 2. VÙNG LÀM VIỆC CHÍNH -->
    <div class="admin-main">
      <!-- Topbar tối giản: Tên & Avatar -->
      <header id="admin-topbar"></header>

      <!-- Nội dung chính -->
      <main class="admin-content">
        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Bài viết của tôi</h1>
            <p class="admin-page-subtitle">Quản lý toàn bộ bài viết, theo dõi tiến độ duyệt và xử lý phản hồi từ Ban Biên tập.</p>
          </div>
        </div>

        <!-- Vùng render danh sách bài viết & bộ lọc -->
        <div id="workspace-content"></div>
      </main>
    </div>
  </div>

  <!-- Modal xác nhận xóa bài nháp -->
  <div id="delete-modal-container"></div>

  <!-- Modal Chi tiết Bài viết của Phóng viên (Đồng bộ chuẩn Editorial) -->
  <div id="article-detail-modal-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-layout.js"></script>
  <script>
    // Biến toàn cục quản lý trạng thái màn hình
    let currentTab = "all"; // all | draft | pending | rejected | published
    let searchQuery = "";
    let reporterArticles = [];
    let categoriesMap = {};
    let articleIdToDelete = null;

    document.addEventListener("DOMContentLoaded", () => {
      const currentUser = initAdminLayout("reporter", "my-articles");
      if (currentUser) {
        loadReporterArticles(currentUser);
      }
    });

    /**
     * Tải danh sách bài viết của phóng viên từ Backend PHP API
     */
    async function loadReporterArticles(currentUser) {
      try {
        const [resArticles, resCategories] = await Promise.all([
          fetch(resolveApiUrl("reporter/my-articles.php"), { credentials: "include" }).then(r => r.json()),
          fetch(resolveApiUrl("public/categories.php")).then(r => r.json())
        ]);

        reporterArticles = (resArticles.success && Array.isArray(resArticles.data)) ? resArticles.data : [];
        const allCategories = (resCategories.success && Array.isArray(resCategories.data)) ? resCategories.data : [];

        // Map danh mục
        categoriesMap = {};
        allCategories.forEach(c => {
          categoriesMap[c.id] = c.name;
        });

        // Sắp xếp mặc định theo ngày mới nhất
        reporterArticles.sort((a, b) => {
          const timeA = new Date(a.updated_at || a.published_at || a.created_at || 0).getTime();
          const timeB = new Date(b.updated_at || b.published_at || b.created_at || 0).getTime();
          return timeB - timeA;
        });

        // Kiểm tra tham số ?id= hoặc ?article_id= trên URL để chuyển tab phù hợp & tự mở modal nếu có yêu cầu
        const urlParams = new URLSearchParams(window.location.search);
        const targetArticleId = urlParams.get("id") || urlParams.get("article_id");
        if (targetArticleId) {
          const targetArt = reporterArticles.find(a => String(a.id) === String(targetArticleId));
          if (targetArt) {
            currentTab = targetArt.status; // Chuyển thẳng tới tab chứa bài viết
          }
        }

        renderUI();
        checkAndHighlightArticle();
      } catch (err) {
        console.error("Lỗi khi tải bài viết phóng viên:", err);
        reporterArticles = [];
        renderUI();
      }
    }

    /**
     * Render giao diện Tab + Search + Table
     */
    function renderUI() {
      const mount = document.getElementById("workspace-content");
      if (!mount) return;

      // Đếm số lượng theo từng trạng thái
      const counts = {
        all: reporterArticles.length,
        draft: reporterArticles.filter(a => a.status === "draft").length,
        pending: reporterArticles.filter(a => a.status === "pending").length,
        rejected: reporterArticles.filter(a => a.status === "rejected").length,
        published: reporterArticles.filter(a => a.status === "published").length
      };

      mount.innerHTML = `
        <!-- 1. Tabs Lọc Trạng Thái -->
        <div class="admin-tabs-nav">
          <button class="admin-tab-btn ${currentTab === 'all' ? 'is-active' : ''}" onclick="switchTab('all')">
            Tất cả <span class="tab-badge">${counts.all}</span>
          </button>
          <button class="admin-tab-btn ${currentTab === 'draft' ? 'is-active' : ''}" onclick="switchTab('draft')">
            Bản nháp <span class="tab-badge" style="background:#ECEFF1; color:#546E7A;">${counts.draft}</span>
          </button>
          <button class="admin-tab-btn ${currentTab === 'pending' ? 'is-active' : ''}" onclick="switchTab('pending')">
            Chờ duyệt <span class="tab-badge" style="background:#FFF3E0; color:#E65100;">${counts.pending}</span>
          </button>
          <button class="admin-tab-btn ${currentTab === 'rejected' ? 'is-active' : ''}" onclick="switchTab('rejected')">
            Bị từ chối <span class="tab-badge" style="background:#FFEBEE; color:#C62828;">${counts.rejected}</span>
          </button>
          <button class="admin-tab-btn ${currentTab === 'published' ? 'is-active' : ''}" onclick="switchTab('published')">
            Đã đăng <span class="tab-badge" style="background:#E8F5E9; color:#2E7D32;">${counts.published}</span>
          </button>
        </div>

        <!-- 2. Bảng Danh Sách Bài Viết -->
        <div class="admin-card">
          <div class="admin-card__header">
            <div class="admin-card__title-group">
              <h2 class="admin-card__title" id="tab-title-display">${getTabTitle(currentTab)}</h2>
              <span class="admin-card__count-badge" id="list-count-badge">0 bài</span>
            </div>
            <div class="admin-card__toolbar">
              <div class="admin-search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input 
                  type="text" 
                  class="admin-search-input" 
                  placeholder="Tìm theo tiêu đề bài viết..."
                  value="${escapeHtml(searchQuery)}"
                  oninput="handleSearch(this.value)"
                >
              </div>
            </div>
          </div>

          <div class="admin-table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="min-width: 320px;">Bài viết</th>
                  <th>Chuyên mục</th>
                  <th>Thời gian</th>
                  <th>Trạng thái</th>
                  <th style="text-align: right; min-width: 170px;">Hành động</th>
                </tr>
              </thead>
              <tbody id="articles-tbody">
                <!-- Sẽ được đổ bởi renderTableRows -->
              </tbody>
            </table>
          </div>
        </div>
      `;

      renderTableRows();
    }

    /**
     * Lấy tiêu đề hiển thị cho Tab
     */
    function getTabTitle(tab) {
      switch (tab) {
        case "draft": return "Danh sách bản nháp";
        case "pending": return "Bài viết đang chờ duyệt";
        case "rejected": return "Bài viết bị từ chối / cần sửa";
        case "published": return "Bài viết đã xuất bản";
        default: return "Toàn bộ bài viết";
      }
    }

    /**
     * Render ảnh thumbnail bài viết trong bảng
     */
    function renderTableCoverThumb(imagePath, title) {
      const safeAlt = escapeHtml(title || "Ảnh bài viết");
      const raw = imagePath ? String(imagePath).trim() : "";
      const resolvedUrl = raw && typeof resolveAssetPath === "function" ? resolveAssetPath(raw) : raw;

      if (!resolvedUrl) {
        return `<div class="admin-article-thumb-ph" title="Chưa có ảnh bìa"></div>`;
      }
      return `
        <div class="admin-article-thumb-ph">
          <img src="${escapeHtml(resolvedUrl)}" alt="${safeAlt}" loading="lazy" onerror="this.remove()">
        </div>
      `;
    }

    /**
     * Render các hàng dữ liệu bài viết
     */
    function renderTableRows() {
      const tbody = document.getElementById("articles-tbody");
      const countBadge = document.getElementById("list-count-badge");
      if (!tbody) return;

      // 1. Lọc theo Tab
      let filtered = reporterArticles.filter(art => {
        if (currentTab === "all") return true;
        return art.status === currentTab;
      });

      // 2. Lọc theo Search Query
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(art => {
          const title = (art.title || "").toLowerCase();
          const category = (categoriesMap[art.category_id] || "").toLowerCase();
          return title.includes(q) || category.includes(q);
        });
      }

      // Cập nhật số lượng hiển thị
      if (countBadge) {
        countBadge.textContent = `${filtered.length} bài`;
      }

      // 3. Trạng thái rỗng
      if (filtered.length === 0) {
        let emptyMsg = "Bạn chưa có bài viết nào";
        if (searchQuery.trim()) {
          emptyMsg = `Không tìm thấy bài viết nào phù hợp với từ khóa "${escapeHtml(searchQuery)}"`;
        } else if (currentTab === "draft") {
          emptyMsg = "Bạn không có bản nháp nào";
        } else if (currentTab === "pending") {
          emptyMsg = "Không có bài viết nào đang chờ duyệt";
        } else if (currentTab === "rejected") {
          emptyMsg = "Không có bài viết nào bị từ chối";
        } else if (currentTab === "published") {
          emptyMsg = "Bạn chưa có bài viết nào được đăng";
        }

        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="admin-empty-state" style="padding: 48px 20px;">
                <div class="admin-empty-state__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                  </svg>
                </div>
                <p class="admin-empty-state__text">${emptyMsg}</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      // 4. Render các dòng bài viết (Giao diện bảng gọn gàng, không nhét box lý do cồng kềnh ra ngoài)
      tbody.innerHTML = filtered.map(art => {
        const catName = categoriesMap[art.category_id] || "Tổng hợp";
        const coverImg = art.cover_image || art.image || art.thumbnail || "";
        const desc = art.sapo || art.short_description || art.summary || art.description || "";
        const timeDisplay = formatTime(art);
        const statusBadge = renderStatusBadge(art.status);
        const actionButtons = renderActionButtons(art);
        const thumbHtml = renderTableCoverThumb(coverImg, art.title);

        return `
          <tr id="article-row-${art.id}" data-id="${art.id}">
            <td>
              <div class="admin-article-cell" style="cursor: pointer;" onclick="openArticleDetailModal(${art.id})">
                ${thumbHtml}
                <div class="admin-article-info">
                  <div class="admin-article-title-text" title="Bấm để xem chi tiết bài viết" style="color: var(--ink); font-weight: 700; transition: color 0.15s ease;">
                    ${escapeHtml(art.title || "Chưa đặt tiêu đề")}
                  </div>
                  ${desc ? `<div class="admin-article-sapo-text" title="${escapeHtml(desc)}">${escapeHtml(desc)}</div>` : ''}
                </div>
              </div>
            </td>
            <td class="admin-col-category">
              <span class="admin-category-pill">${escapeHtml(catName)}</span>
            </td>
            <td class="admin-col-date">
              ${timeDisplay}
            </td>
            <td>
              ${statusBadge}
            </td>
            <td style="text-align: right;">
              <div class="admin-actions-cell" style="justify-content: flex-end;">
                ${actionButtons}
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    /**
     * Format hiển thị thời gian
     */
    function formatTime(art) {
      const raw = art.published_at || art.updated_at || art.created_at;
      if (!raw) return "--";
      if (typeof formatDate === "function") {
        return formatDate(raw);
      }
      return raw;
    }

    /**
     * Render Huy hiệu trạng thái
     */
    function renderStatusBadge(status) {
      switch (status) {
        case "draft":
          return `<span class="admin-status-badge admin-status-badge--draft">Bản nháp</span>`;
        case "pending":
          return `<span class="admin-status-badge admin-status-badge--pending">Chờ duyệt</span>`;
        case "rejected":
          return `<span class="admin-status-badge admin-status-badge--rejected">Bị từ chối</span>`;
        case "published":
          return `<span class="admin-status-badge admin-status-badge--published">Đã đăng</span>`;
        default:
          return `<span class="admin-status-badge">${escapeHtml(status)}</span>`;
      }
    }

    /**
     * Render các nút hành động theo đúng quy tắc nghiệp vụ UC-RP02 & nút Chi tiết mở Modal
     */
    function renderActionButtons(art) {
      const detailBtn = `
        <button type="button" class="admin-btn admin-btn--view" onclick="openArticleDetailModal(${art.id})" title="Xem chi tiết nội dung & phản hồi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          Chi tiết
        </button>
      `;

      if (art.status === "draft") {
        return `
          ${detailBtn}
          <a href="write-article.html?id=${art.id}" class="admin-btn admin-btn--edit" title="Sửa bản nháp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Sửa
          </a>
          <button type="button" class="admin-btn admin-btn--danger" onclick="confirmDeleteDraft(${art.id}, '${escapeHtml(art.title || '')}')" title="Xóa bản nháp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Xóa
          </button>
        `;
      }

      if (art.status === "pending") {
        return `
          ${detailBtn}
          <button type="button" class="admin-btn admin-btn--edit" onclick="handleEditPending(${art.id})" title="Chuyển về bản nháp để chỉnh sửa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Sửa
          </button>
        `;
      }

      if (art.status === "rejected") {
        return `
          ${detailBtn}
          <a href="write-article.html?id=${art.id}" class="admin-btn admin-btn--edit" title="Sửa nội dung bài viết">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Sửa
          </a>
          <button type="button" class="admin-btn admin-btn--resubmit" onclick="handleResubmit(${art.id})" title="Gửi duyệt lại lên Ban Biên tập">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            Gửi lại
          </button>
        `;
      }

      if (art.status === "published") {
        const articleSlug = art.slug || (typeof slugify === "function" ? slugify(art.title) : "") || art.id;
        const detailUrl = `../public/article-detail.html?slug=${encodeURIComponent(articleSlug)}`;
        return `
          ${detailBtn}
          <a href="${detailUrl}" target="_blank" class="admin-btn admin-btn--view" title="Xem bài viết đã xuất bản">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Đọc bài
          </a>
        `;
      }

      return detailBtn;
    }

    /**
     * MỞ MODAL XEM CHI TIẾT BÀI VIẾT (ĐỒNG BỘ CHUẨN BIÊN TẬP VIÊN)
     * Hiển thị đầy đủ: Nội dung, Hình ảnh, Lý do từ chối (nếu có) và các nút hành động trực tiếp
     */
    function openArticleDetailModal(articleId) {
      const article = reporterArticles.find(a => Number(a.id) === Number(articleId));
      if (!article) {
        showToast("Không tìm thấy bài viết này", "warning");
        return;
      }

      const catName = categoriesMap[article.category_id] || "Thời sự";

      // Trích xuất tags
      let tagNames = [];
      if (article.tags_text && Array.isArray(article.tags_text) && article.tags_text.length > 0) {
        tagNames = article.tags_text;
      } else if (Array.isArray(article.tags)) {
        tagNames = article.tags.map(t => typeof t === "object" ? t.name : t);
      }

      const rejectionText = article.reject_reason || article.rejection_reason || "";
      const modalMount = document.getElementById("article-detail-modal-container");
      if (!modalMount) return;

      // Nút hành động dưới Modal tùy theo trạng thái bài viết
      let modalActionBtns = "";
      if (article.status === "rejected") {
        modalActionBtns = `
          <a href="write-article.html?id=${article.id}" class="admin-btn admin-btn--primary" style="background: var(--ink); color: #fff; font-weight: 700; padding: 9px 20px; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px;">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Sửa bài viết ngay
          </a>
          <button type="button" class="admin-btn admin-btn--resubmit" onclick="handleResubmitFromModal(${article.id})" style="font-weight: 700; padding: 9px 20px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px;">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            Gửi duyệt lại lên BTV
          </button>
        `;
      } else if (article.status === "pending") {
        modalActionBtns = `
          <button type="button" class="admin-btn admin-btn--edit" onclick="handleEditPending(${article.id})" style="font-weight: 700; padding: 9px 20px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px;">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Thu hồi về bản nháp để sửa
          </button>
        `;
      } else if (article.status === "draft") {
        modalActionBtns = `
          <button type="button" class="admin-btn admin-btn--danger" onclick="closeArticleDetailModal(); confirmDeleteDraft(${article.id}, '${escapeHtml(article.title || '')}');" style="padding: 9px 16px; border-radius: 6px;">
            Xóa bản nháp
          </button>
          <a href="write-article.html?id=${article.id}" class="admin-btn admin-btn--primary" style="background: var(--ink); color: #fff; font-weight: 700; padding: 9px 20px; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px;">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Tiếp tục viết bài
          </a>
        `;
      } else if (article.status === "published") {
        const articleSlug = article.slug || (typeof slugify === "function" ? slugify(article.title) : "") || article.id;
        const detailUrl = `../public/article-detail.html?slug=${encodeURIComponent(articleSlug)}`;
        modalActionBtns = `
          <a href="${detailUrl}" target="_blank" class="admin-btn admin-btn--primary" style="background: #2E7D32; color: #fff; font-weight: 700; padding: 9px 20px; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Xem bài viết đã xuất bản
          </a>
        `;
      }

      modalMount.innerHTML = `
        <div id="article-detail-modal" style="display: flex; position: fixed; inset: 0; z-index: 1050; background: rgba(19, 27, 46, 0.65); backdrop-filter: blur(3px); align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
          <div class="admin-modal-container" style="max-width: 980px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; background: #FFF; border-radius: 8px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid var(--line-soft);">
            
            <!-- Modal Header -->
            <div class="admin-modal-header" style="padding: 16px 24px; border-bottom: 1px solid var(--line-soft); background: #FAF8F5; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
              <div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 2px;">
                  <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: var(--ink);">Chi tiết bài viết</h3>
                  ${renderStatusBadge(article.status)}
                </div>
                <p style="margin: 0; font-size: 12px; color: var(--muted);">Xem toàn bộ nội dung, phản hồi từ Ban Biên tập và thực hiện các hành động tiếp theo.</p>
              </div>
              <button type="button" onclick="closeArticleDetailModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; padding: 4px;">&times;</button>
            </div>

            <!-- Modal Body (2 Cột) -->
            <div class="admin-modal-body" style="padding: 24px; overflow-y: auto; flex: 1; box-sizing: border-box;">
              <div style="display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; min-width: 0;">
                
                <!-- CỘT TRÁI: NỘI DUNG BÀI VIẾT & LÝ DO TỪ CHỐI -->
                <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
                  
                  <!-- Banner LÝ DO TỪ CHỐI NỔI BẬT NẾU BÀI BỊ TRẢ VỀ -->
                  ${article.status === "rejected" && rejectionText ? `
                    <div style="background: #FFEBEE; border: 1.5px solid #FFCDD2; border-left: 4px solid #DC2626; border-radius: 6px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(220, 38, 38, 0.08);">
                      <div style="display: flex; align-items: center; gap: 7px; color: #C62828; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
                          <circle cx="12" cy="12" r="10"></circle>
                          <line x1="12" y1="8" x2="12" y2="12"></line>
                          <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        Lý do yêu cầu sửa đổi từ Ban Biên tập:
                      </div>
                      <div style="font-size: 13.5px; color: #B71C1C; line-height: 1.6; font-weight: 500;">
                        ${escapeHtml(rejectionText)}
                      </div>
                      <div style="font-size: 11.5px; color: #8F7239; margin-top: 8px; border-top: 1px dashed rgba(220, 38, 38, 0.2); padding-top: 6px;">
                         Bạn có thể bấm <strong>"Sửa bài viết ngay"</strong> ở dưới để cập nhật nội dung theo yêu cầu, sau đó gửi duyệt lại.
                      </div>
                    </div>
                  ` : ""}

                  <!-- Tiêu đề bài viết -->
                  <div class="admin-form-group">
                    <label class="admin-form-label" style="font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase;">Tiêu đề bài viết:</label>
                    <div style="font-weight: 700; font-size: 16px; font-family: var(--f-serif, serif); color: var(--ink); line-height: 1.45; padding: 10px 14px; background: #FAF9F6; border: 1px solid var(--line-soft); border-radius: 6px;">
                      ${escapeHtml(article.title || "Chưa đặt tiêu đề")}
                    </div>
                  </div>

                  <!-- Tóm tắt Sapo -->
                  <div class="admin-form-group">
                    <label class="admin-form-label" style="font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase;">Tóm tắt (Sapo):</label>
                    <div style="font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); padding: 10px 14px; background: #FAF9F6; border: 1px solid var(--line-soft); border-radius: 6px; font-style: italic;">
                      ${escapeHtml(article.sapo || article.short_description || article.summary || "Chưa có tóm tắt Sapo.")}
                    </div>
                  </div>

                  <!-- Nội dung chi tiết -->
                  <div class="admin-form-group">
                    <label class="admin-form-label" style="font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase;">Nội dung bài viết:</label>
                    <div style="border: 1px solid var(--line-soft); border-radius: 6px; padding: 16px; background: #FFF; max-height: 320px; overflow-y: auto; font-size: 13.5px; line-height: 1.65; color: var(--ink); word-break: break-word;">
                      ${article.content || "<p style='color: var(--muted); font-style: italic;'>Chưa có nội dung chi tiết.</p>"}
                    </div>
                  </div>

                </div>

                <!-- CỘT PHẢI: THÔNG TIN XUẤT BẢN & PHÂN LOẠI -->
                <div style="background: #FCFAF6; border: 1px solid var(--line-soft); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0;">
                  
                  <div style="font-size: 13px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--line-soft); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <span>Thông tin phân loại</span>
                    <span style="font-size: 11px; background: rgba(30, 41, 59, 0.08); color: var(--ink); padding: 2px 6px; border-radius: 4px; font-weight: 600;">Phóng viên</span>
                  </div>

                  <!-- Chuyên mục -->
                  <div class="admin-form-group">
                    <div style="color: var(--muted); font-size: 12px; margin-bottom: 3px; font-weight: 600;">Chuyên mục:</div>
                    <div style="padding: 7px 12px; background: #FFF; border: 1px solid var(--line-soft); border-radius: 6px; font-weight: 600; color: var(--ink); font-size: 13px; display: inline-flex; align-items: center; gap: 6px;">
                      <svg style="width: 14px; height: 14px; color: var(--brass);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                      </svg>
                      <span>${escapeHtml(catName)}</span>
                    </div>
                  </div>

                  <!-- Thẻ Tag -->
                  <div class="admin-form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                      <span style="font-weight: 600; font-size: 12px; color: var(--muted);">Thẻ Tag bài viết:</span>
                      <span style="font-size: 11px; font-family: var(--f-mono); color: var(--muted); font-weight: 600;">${tagNames.length} thẻ</span>
                    </div>

                    <div style="min-height: 42px; padding: 8px 10px; background: #FFF; border: 1px solid var(--line-soft); border-radius: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                      ${tagNames.length > 0 ? tagNames.map(t => `
                        <span style="display: inline-flex; align-items: center; gap: 4px; background: rgba(184, 147, 79, 0.12); border: 1px solid rgba(184, 147, 79, 0.35); color: #8F7239; font-weight: 600; font-size: 12px; padding: 3px 9px; border-radius: 12px;">
                          #${escapeHtml(t)}
                        </span>
                      `).join("") : `<span style="font-size: 12px; color: var(--muted); font-style: italic;">Chưa có thẻ tag nào</span>`}
                    </div>
                  </div>

                  <!-- Thời gian cập nhật / nộp -->
                  <div style="font-size: 12.5px; border-top: 1px dashed var(--line-soft); padding-top: 10px;">
                    <div style="color: var(--muted); margin-bottom: 3px;">Thời gian cập nhật:</div>
                    <div style="font-family: var(--f-mono); color: var(--ink); font-weight: 600;">
                      ${formatTime(article)}
                    </div>
                  </div>

                  <!-- Trạng thái quy trình -->
                  <div style="background: rgba(184, 147, 79, 0.08); border: 1px solid rgba(184, 147, 79, 0.25); border-radius: 6px; padding: 12px; font-size: 12px; color: #78350F; line-height: 1.55;">
                    ${article.status === "rejected" ? `
                      <strong>Lưu ý:</strong> Bài viết đang bị trả về từ Ban Biên tập. Hãy đọc kỹ lý do, chỉnh sửa và bấm <em>"Gửi duyệt lại"</em> để BTV thẩm định lần tiếp theo.
                    ` : article.status === "pending" ? `
                      <strong>Trạng thái:</strong> Bài viết đang nằm trong hàng đợi thẩm định của Ban Biên tập. Bạn có thể thu hồi về bản nháp nếu muốn chỉnh sửa trước khi BTV duyệt.
                    ` : article.status === "published" ? `
                      <strong>Chúc mừng!</strong> Bài viết đã được Ban Biên tập phê duyệt và xuất bản chính thức trên Mạch Tin.
                    ` : `
                      <strong>Bản nháp:</strong> Bài viết chỉ lưu trên hệ thống của bạn, chưa được gửi tới Ban Biên tập.
                    `}
                  </div>

                </div>

              </div>
            </div>

            <!-- Modal Footer: Các Nút Hành Động Ở Dưới -->
            <div class="admin-modal-footer" style="padding: 14px 24px; border-top: 1px solid var(--line-soft); background: #FAF8F5; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
              <div>
                <button type="button" class="admin-btn admin-btn--secondary" onclick="closeArticleDetailModal()" style="padding: 8px 18px; border-radius: 6px; cursor: pointer;">
                  ✕ Đóng
                </button>
              </div>

              <div style="display: flex; align-items: center; gap: 10px;">
                ${modalActionBtns}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    /**
     * Đóng Modal Chi tiết Bài viết
     */
    function closeArticleDetailModal() {
      const modalMount = document.getElementById("article-detail-modal-container");
      if (modalMount) modalMount.innerHTML = "";
    }

    /**
     * Gửi duyệt lại trực tiếp từ Modal
     */
    function handleResubmitFromModal(id) {
      handleResubmit(id);
      closeArticleDetailModal();
    }

    /**
     * Chuyển tab lọc trạng thái
     */
    function switchTab(tab) {
      currentTab = tab;
      renderUI();
    }

    /**
     * Tìm kiếm bài viết
     */
    function handleSearch(val) {
      searchQuery = val;
      renderTableRows();
    }

    /**
     * Nghiệp vụ: Khi sửa bài đang CHỜ DUYỆT -> Chuyển về NHÁP và chuyển trang qua API
     */
    async function handleEditPending(id) {
      try {
        const res = await fetch(resolveApiUrl("reporter/my-articles.php"), {
          method: "PUT",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ article_id: id, action: "withdraw" })
        });
        const data = await res.json();
        if (!data.success) {
          showToast(data.message || "Không thể thu hồi bài viết", "error");
          return;
        }

        showToast("Đã thu hồi bài viết về Bản nháp để chỉnh sửa", "info");
        setTimeout(() => {
          window.location.href = `write-article.html?id=${id}`;
        }, 300);
      } catch (err) {
        console.error("Lỗi khi thu hồi bài viết:", err);
        showToast("Lỗi kết nối khi thu hồi bài viết!", "error");
      }
    }

    /**
     * Nghiệp vụ: GỬI DUYỆT LẠI bài bị từ chối qua API
     */
    async function handleResubmit(id) {
      try {
        const res = await fetch(resolveApiUrl("reporter/my-articles.php"), {
          method: "PUT",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ article_id: id, action: "submit" })
        });
        const data = await res.json();
        if (!data.success) {
          showToast(data.message || "Không thể gửi duyệt lại", "error");
          return;
        }

        showToast("Đã gửi duyệt lại bài viết lên Ban Biên tập thành công!", "success");
        
        const currentUser = getCurrentUser();
        if (currentUser) {
          loadReporterArticles(currentUser);
        }
      } catch (err) {
        console.error("Lỗi khi gửi duyệt lại bài viết:", err);
        showToast("Lỗi kết nối khi gửi duyệt lại!", "error");
      }
    }

    /**
     * Bật Modal xác nhận xóa bài nháp
     */
    function confirmDeleteDraft(id, title) {
      articleIdToDelete = id;
      const container = document.getElementById("delete-modal-container");
      if (!container) return;

      container.innerHTML = `
        <div class="modal-overlay is-open" id="delete-modal" onclick="if(event.target === this) closeDeleteModal()">
          <div class="modal-box" style="max-width: 480px;">
            <div class="modal-box__head">
              <h3 class="modal-box__title" style="color: var(--crimson); display: flex; align-items: center; gap: 8px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                Xác nhận xóa bản nháp
              </h3>
              <button type="button" class="modal-box__close" onclick="closeDeleteModal()" aria-label="Đóng">✕</button>
            </div>
            <div class="modal-box__body">
              <p style="font-size: 14px; color: var(--ink-soft); margin: 0; line-height: 1.6; font-family: var(--f-sans);">
                Bạn có chắc chắn muốn xóa vĩnh viễn bài nháp <strong>"${escapeHtml(title || 'Bài viết này')}"</strong>? Hành động này không thể hoàn tác.
              </p>
            </div>
            <div class="modal-box__foot">
              <button type="button" class="btn btn-ghost btn-sm" onclick="closeDeleteModal()">Hủy bỏ</button>
              <button type="button" class="btn btn-danger btn-sm" onclick="executeDeleteDraft()">Xác nhận xóa</button>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * Đóng Modal xóa
     */
    function closeDeleteModal() {
      articleIdToDelete = null;
      const container = document.getElementById("delete-modal-container");
      if (container) container.innerHTML = "";
    }

    /**
     * Thực hiện xóa bài nháp qua Backend API
     */
    async function executeDeleteDraft() {
      if (!articleIdToDelete) return;

      try {
        const res = await fetch(resolveApiUrl("reporter/my-articles.php"), {
          method: "DELETE",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ article_id: articleIdToDelete })
        });
        const data = await res.json();
        
        closeDeleteModal();
        if (!data.success) {
          showToast(data.message || "Không thể xóa bài nháp", "error");
          return;
        }

        showToast("Đã xóa bản nháp thành công", "success");

        const currentUser = getCurrentUser();
        if (currentUser) {
          loadReporterArticles(currentUser);
        }
      } catch (err) {
        console.error("Lỗi khi xóa bài nháp:", err);
        closeDeleteModal();
        showToast("Lỗi kết nối khi xóa bài nháp!", "error");
      }
    }

    /**
     * Tự động cuộn đến bài viết và làm nổi màu (Highlight) khi có tham số ?id= hoặc ?article_id= trên URL
     */
    function checkAndHighlightArticle() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetArticleId = urlParams.get("id") || urlParams.get("article_id");
      if (!targetArticleId) return;

      setTimeout(() => {
        const targetElement = document.getElementById(`article-row-${targetArticleId}`);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: "smooth", block: "center" });
          targetElement.classList.add("admin-row-highlight-flash");
          setTimeout(() => {
            targetElement.classList.remove("admin-row-highlight-flash");
          }, 2800);
        }
      }, 250);
    }
  </script>
</body>
</html>
