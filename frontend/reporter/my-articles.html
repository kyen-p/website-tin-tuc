<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết của tôi - Phóng viên | Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Quản trị -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin-layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <div class="admin-workspace">
    <!-- 1. SIDEBAR CỐ ĐỊNH -->
    <aside id="admin-sidebar"></aside>

    <!-- 2. VÙNG LÀM VIỆC CHÍNH -->
    <div class="admin-main">
      <!-- Topbar tối giản: Tên & Avatar -->
      <header id="admin-topbar"></header>

      <!-- Nội dung chính -->
      <main class="admin-content">
        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Bài viết của tôi</h1>
            <p class="admin-page-subtitle">Quản lý toàn bộ bài viết, theo dõi tiến độ duyệt và xử lý phản hồi từ Ban Biên tập.</p>
          </div>
        </div>

        <!-- Vùng render danh sách bài viết & bộ lọc -->
        <div id="workspace-content"></div>
      </main>
    </div>
  </div>

  <!-- Modal xác nhận xóa bài nháp -->
  <div id="delete-modal-container"></div>

  <!-- Modal Chi tiết Bài viết của Phóng viên (Đồng bộ chuẩn Editorial) -->
  <div id="article-detail-modal-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-layout.js"></script>
  <script src="../assets/js/reporter-my-articles.js"></script>
</body>
</html>
