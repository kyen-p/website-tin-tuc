<!--
==============================================================================
TÊN FILE: frontend/reporter/my-articles.html
PHÂN HỆ: Bàn Làm Việc Phóng Viên - Quản Lý Bài Viết Của Tôi (Reporter My Articles View)
MÔ TẢ: Khung giao diện quản lý danh sách toàn bộ bài viết của phóng viên:
       - Sidebar điều hướng phóng viên (#admin-sidebar) được render tự động bởi admin-layout.js.
       - Thanh tiêu đề trên cùng (#admin-topbar) chứa thông tin tài khoản đăng nhập.
       - Vùng gắn nội dung (#workspace-content): các tab trạng thái (tất cả, nháp, chờ duyệt, đã duyệt, từ chối), bộ lọc tìm kiếm, bảng dữ liệu bài viết.
       - Hộp thoại xác nhận xóa bài viết nháp (#delete-modal-container).
PHỤ THUỘC:
       - frontend/assets/css/base.css, admin-layout.css
       - frontend/assets/js/common.js, admin-layout.js, reporter-my-articles.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết của tôi - Phóng viên | Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Quản trị -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin-layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- ============================================================================== -->
  <!-- KHỐI 1: BỐ CỤC KHUNG LÀM VIỆC TÒA SOẠN (SIDEBAR & TOPBAR ĐIỀU HÀNH)            -->
  <!-- ============================================================================== -->
  <div class="admin-workspace">
    <!-- Sidebar cố định (render tự động bởi admin-layout.js) -->
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <!-- Topbar tối giản: Tên & Avatar -->
      <header id="admin-topbar"></header>

      <!-- ============================================================================== -->
      <!-- KHỐI 2: VÙNG NỘI DUNG QUẢN LÝ BÀI VIẾT VÀ TIẾN ĐỘ KIỂM DUYỆT                   -->
      <!-- ============================================================================== -->
      <main class="admin-content">
        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Bài viết của tôi</h1>
            <p class="admin-page-subtitle">Quản lý toàn bộ bài viết, theo dõi tiến độ duyệt và xử lý phản hồi từ Ban Biên tập.</p>
          </div>
        </div>

        <!-- Vùng render danh sách bài viết & bộ lọc -->
        <div id="workspace-content"></div>
      </main>
    </div>
  </div>

  <!-- Modal xác nhận xóa bài nháp -->
  <div id="delete-modal-container"></div>

  <!-- ============================================================================== -->
  <!-- KHỐI 3: TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT ĐIỀU HÀNH TRANG                 -->
  <!-- ============================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-layout.js"></script>
  <script src="../assets/js/reporter-my-articles.js"></script>
</body>
</html>
