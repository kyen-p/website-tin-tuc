<!--
==============================================================================
TÊN FILE: frontend/public/search.html
PHÂN HỆ: Tra Cứu Tin Tức & Thẻ Tag (Public Search & Tag View)
MÔ TẢ: Khung giao diện tìm kiếm nội dung bài viết và lọc theo nhãn thẻ:
       - Vùng gắn Header điều hướng (#site-header) và Breadcrumb dẫn đường.
       - Thanh tìm kiếm trung tâm (#searchForm) và danh sách gợi ý Tag thịnh hành (#hotTagsMount).
       - Thanh công cụ lọc: tóm tắt kết quả (#searchSummaryText), lọc chuyên mục (#categoryFilter), sắp xếp (#sortFilter).
       - Lưới hiển thị danh sách kết quả bài viết (#searchResultsList).
       - Cột phụ: Bảng xếp hạng đọc nhiều nhất trong tuần (#topViewsMount) và Tag Cloud (#sidebarAllTagsMount).
       - Vùng gắn Footer trang tự động (#site-footer).
PHỤ THUỘC:
       - frontend/assets/css/base.css, public-layout.css, public.css
       - frontend/assets/js/common.js, search.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm kiếm tin tức - Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Công khai -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/public-layout.css">
  <link rel="stylesheet" href="../assets/css/public.css">

  <!-- Toastify JS CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- ============================================================================== -->
  <!-- KHỐI 1: HEADER & TICKER ĐIỀU HƯỚNG CÔNG KHAI (Tự động render bởi common.js)     -->
  <!-- ============================================================================== -->
  <div id="site-header"></div>

  <!-- ============================================================================== -->
  <!-- KHỐI 2: NỘI DUNG TÌM KIẾM (THANH TÌM KIẾM, BỘ LỌC, KẾT QUẢ & SIDEBAR)           -->
  <!-- ============================================================================== -->
  <main>
    <div class="wrap">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Đường dẫn trang" style="margin: 16px 0 24px;">
        <a href="index.html">Trang chủ</a>
        <span>/</span>
        <span id="breadcrumb-current">Tìm kiếm tin tức</span>
      </nav>

      <!-- 1. Thanh tìm kiếm trung tâm (Hero Search) -->
      <div class="search-hero">
        <form id="searchForm" class="search-form-row" action="search.html" method="GET">
          <div class="search-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="search" 
              id="searchInput" 
              name="q" 
              placeholder="Nhập từ khóa, tiêu đề, chủ đề bạn muốn tìm kiếm..." 
              autocomplete="off"
            >
          </div>
          <button type="submit" class="btn btn-primary" style="padding: 0 24px; font-weight: 600;">
            Tìm kiếm
          </button>
        </form>

        <!-- Danh sách gợi ý Tag thịnh hành -->
        <div class="search-hot-tags">
          <span style="font-weight: 600; font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase;">Tag nổi bật:</span>
          <div id="hotTagsMount" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
        </div>
      </div>

      <!-- 2. Thanh lọc & Thống kê kết quả -->
      <div class="search-filter-bar">
        <div class="meta" id="searchSummaryText" style="font-size: 14px; font-weight: 500;">
          Đang tải kết quả...
        </div>

        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <!-- Lọc chuyên mục -->
          <select id="categoryFilter" class="search-select" aria-label="Lọc theo chuyên mục">
            <option value="all">Tất cả chuyên mục</option>
          </select>

          <!-- Sắp xếp -->
          <select id="sortFilter" class="search-select" aria-label="Sắp xếp kết quả">
            <option value="newest">Mới nhất</option>
            <option value="views">Đọc nhiều nhất</option>
            <option value="oldest">Cũ nhất</option>
          </select>
        </div>
      </div>

      <!-- 3. Khu vực Bố cục 2 Cột: Kết quả chính + Sidebar -->
      <div class="layout-split">
        
        <!-- Cột trái: Danh sách bài viết -->
        <section aria-label="Kết quả tìm kiếm">
          <div id="searchResultsList"></div>
        </section>

        <!-- Cột phải: Sidebar hỗ trợ -->
        <aside>
          <!-- Bảng xếp hạng đọc nhiều -->
          <div class="panel">
            <h3>Đọc nhiều nhất trong tuần</h3>
            <div class="rank-list" id="topViewsMount"></div>
          </div>

          <!-- Tag Cloud - Tag nổi bật -->
          <div class="panel">
            <h3>Tag nổi bật</h3>
            <div class="tag-cloud" id="sidebarAllTagsMount"></div>
          </div>
        </aside>
      </div>

    </div>
  </main>

  <!-- ============================================================================== -->
  <!-- KHỐI 3: FOOTER CÔNG KHAI (Tự động render bởi common.js)                         -->
  <!-- ============================================================================== -->
  <div id="site-footer"></div>

  <!-- ============================================================================== -->
  <!-- KHỐI 4: TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT ĐIỀU HÀNH TRANG                 -->
  <!-- ============================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/search.js"></script>
</body>
</html>
