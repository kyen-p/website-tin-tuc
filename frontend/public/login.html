<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Mạch Tin</title>

    <!-- Google Fonts: Fraunces, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Toastify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body class="auth-page">

    <!-- 1. Logo Mạch Tin đặt trên đầu Card -->
    <a href="index.html" class="auth-top-logo" aria-label="Về trang chủ Mạch Tin">
        <svg class="pulse-mark" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
            <path d="M1 13H7L9.5 6L13.5 20L16 13H25" stroke="var(--crimson, #A6362C)" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="logo__word">MẠCH <em>TIN</em></span>
    </a>

    <!-- 2. Khung Card Đăng nhập trắng -->
    <div class="auth-card">
        <div class="auth-card__header">
            <h1 class="auth-card__title">Đăng nhập</h1>
            <p class="auth-card__desc">Đăng nhập để sử dụng các tính năng cá nhân.</p>
        </div>

        <!-- Cảnh báo nếu tài khoản bị khóa -->
        <div class="auth-locked-alert" id="lockedAlert">
            <strong>Tài khoản đã bị tạm khóa!</strong><br>
            <span id="lockedReasonText">Vi phạm quy chế cộng đồng của tòa soạn.</span>
        </div>

        <!-- Form Đăng nhập tinh gọn (2 ô: Email/Username + Password) -->
        <form class="auth-form" id="loginForm" novalidate>
            <div class="auth-field" id="accountField">
                <label for="accountInput">EMAIL HOẶC USERNAME</label>
                <input type="text" id="accountInput" placeholder="example@gmail.com hoặc username"
                    autocomplete="username" required>
                <div class="auth-field__error" id="accountError">Vui lòng nhập email hoặc username.</div>
            </div>

            <div class="auth-field" id="passwordField">
                <label for="passwordInput">MẬT KHẨU</label>
                <div class="input-password-wrap">
                    <input type="password" id="passwordInput" placeholder="Nhập mật khẩu"
                        autocomplete="current-password" required>
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Hiện mật khẩu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="auth-field__error" id="passwordError">Vui lòng nhập mật khẩu.</div>
            </div>

            <button type="submit" class="auth-btn-submit" id="loginSubmitBtn">
                Đăng nhập
            </button>
        </form>

        <div class="auth-card__footer">
            Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/login.js"></script>
</body>

</html>
