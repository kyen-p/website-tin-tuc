<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyên mục - Mạch Tin</title>
  
  <!-- CSS Nền tảng & Layout Công khai -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/public-layout.css">
  <link rel="stylesheet" href="../assets/css/public.css">
  
  <!-- Toastify JS CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- 1. HEADER & TICKER CÔNG KHAI (Tự động render bởi common.js) -->
  <div id="site-header"></div>

  <!-- 2. NỘI DUNG CHÍNH TRANG CHUYÊN MỤC -->
  <main>
    <div class="wrap">
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Đường dẫn">
        <a href="index.html">Trang chủ</a>
        <span>/</span>
        <span id="breadcrumb-category">Chuyên mục</span>
      </nav>

      <!-- Category Header Header Box -->
      <header class="category-header" style="margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid var(--ink);">
        <div>
          <h1 class="headline-xl" id="category-title" style="margin: 0 0 8px 0;"></h1>
          <p class="dek" id="category-description" style="margin: 0; max-width: 700px; color: var(--muted);"></p>
        </div>

        <!-- Tag Chips Filter -->
        <div style="margin-top: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <span class="meta" style="font-weight: 600; text-transform: uppercase;">Thẻ:</span>
          <div class="tag-cloud" id="category-tags-mount" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
        </div>
      </header>

      <!-- Bố cục Split (Nội dung chính + Sidebar) -->
      <div class="layout-split">
        <!-- Cột trái: Bài viết -->
        <section aria-label="Danh sách bài viết">
          <!-- Bài tiêu điểm -->
          <div id="category-featured-mount" style="margin-bottom: 28px;"></div>

          <!-- Lưới bài viết còn lại (2 cột trên trang chuyên mục cho thoáng mắt) -->
          <div class="grid-2" id="category-grid-mount"></div>

          <!-- Thông báo khi cuộn đến cuối danh sách -->
          <div id="category-end-notice" style="display: none; margin-top: 28px;"></div>

          <!-- Thông báo rỗng khi không có bài -->
          <div id="category-empty-mount" class="panel" style="display: none; text-align: center; padding: 40px 20px;">
            <p class="headline-md" style="color: var(--muted); margin-bottom: 8px;">Chưa có bài viết nào phù hợp.</p>
            <p class="meta">Hãy thử chọn thẻ khác hoặc quay lại trang chủ.</p>
          </div>
        </section>

        <!-- Cột phải: Sidebar -->
        <aside>
          <!-- Bảng xếp hạng đọc nhiều -->
          <div class="panel">
            <h3>Đọc nhiều nhất trong tuần</h3>
            <div class="rank-list" id="category-rank-mount"></div>
          </div>

          <!-- Tag nổi bật -->
          <div class="panel">
            <h3>Tag nổi bật</h3>
            <div class="tag-cloud" id="category-tag-cloud-mount"></div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <!-- 4. FOOTER CÔNG KHAI (Tự động render bởi common.js) -->
  <div id="site-footer"></div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/category.js"></script>
</body>
</html>
