<!--
==============================================================================
TÊN FILE: frontend/public/register.html
PHÂN HỆ: Xác Thực Người Dùng - Đăng Ký Tài Khoản (Public Authentication - Register View)
MÔ TẢ: Khung giao diện đăng ký tài khoản độc giả mới cho tòa soạn Mạch Tin:
       - Logo Mạch Tin chuyển hướng về trang chủ.
       - Form đăng ký đúng 5 trường cốt lõi (#registerForm): họ và tên, username, email, mật khẩu, xác nhận mật khẩu.
       - Các nút bật/tắt hiển thị mật khẩu độc lập (#togglePasswordBtn, #toggleConfirmPasswordBtn).
       - Nút submit đăng ký tài khoản (#registerSubmitBtn) và liên kết dẫn đến trang đăng nhập (login.html).
PHỤ THUỘC:
       - frontend/assets/css/base.css, auth.css
       - frontend/assets/js/common.js, register.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản - Mạch Tin</title>

    <!-- Google Fonts: Fraunces, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Toastify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body class="auth-page">

    <!-- ============================================================================== -->
    <!-- KHỐI 1: LOGO THƯƠNG HIỆU & ĐIỀU HƯỚNG TRANG CHỦ                                -->
    <!-- ============================================================================== -->
    <a href="index.html" class="auth-top-logo" aria-label="Về trang chủ Mạch Tin">
        <svg class="pulse-mark" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
            <path d="M1 13H7L9.5 6L13.5 20L16 13H25" stroke="var(--crimson, #A6362C)" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="logo__word">MẠCH <em>TIN</em></span>
    </a>

    <!-- ============================================================================== -->
    <!-- KHỐI 2: KHUNG CARD FORM ĐĂNG KÝ TÀI KHOẢN (5 TRƯỜNG CỐT LÕI)                    -->
    <!-- ============================================================================== -->
    <div class="auth-card">
        <div class="auth-card__header">
            <h1 class="auth-card__title">Tạo tài khoản</h1>
            <p class="auth-card__desc">Đăng ký tài khoản để bình luận, lưu bài viết và quản lý hồ sơ.</p>
        </div>

        <!-- Form Đăng ký đúng 5 trường cốt lõi, 2 ô mật khẩu xếp hàng ngang -->
        <form class="auth-form" id="registerForm" novalidate>
            <div class="auth-field" id="fullNameField">
                <label for="fullNameInput">HỌ VÀ TÊN</label>
                <input type="text" id="fullNameInput" placeholder="Nguyễn Văn A" autocomplete="name" required>
                <div class="auth-field__error" id="fullNameError">Vui lòng nhập họ và tên.</div>
            </div>

            <div class="auth-field" id="usernameField">
                <label for="usernameInput">USERNAME</label>
                <input type="text" id="usernameInput" placeholder="nguyenvana" autocomplete="username" required>
                <div class="auth-field__error" id="usernameError">Tên đăng nhập không hợp lệ hoặc đã tồn tại.</div>
            </div>

            <div class="auth-field" id="emailField">
                <label for="emailInput">EMAIL</label>
                <input type="email" id="emailInput" placeholder="example@email.com" autocomplete="email" required>
                <div class="auth-field__error" id="emailError">Email không hợp lệ hoặc đã được đăng ký.</div>
            </div>

            <!-- Hàng ngang 2 cột cho Mật khẩu và Xác nhận mật khẩu -->
            <div class="auth-row-2">
                <div class="auth-field" id="passwordField">
                    <label for="passwordInput">MẬT KHẨU</label>
                    <div class="input-password-wrap">
                        <input type="password" id="passwordInput" placeholder="Tối thiểu 8 ký tự"
                            autocomplete="new-password" required>
                        <button type="button" class="password-toggle-btn" id="togglePasswordBtn"
                            aria-label="Hiện mật khẩu">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="auth-field__error" id="passwordError">Mật khẩu tối thiểu 8 ký tự.</div>
                </div>

                <div class="auth-field" id="confirmPasswordField">
                    <label for="confirmPasswordInput">XÁC NHẬN MẬT KHẨU</label>
                    <div class="input-password-wrap">
                        <input type="password" id="confirmPasswordInput" placeholder="Nhập lại mật khẩu"
                            autocomplete="new-password" required>
                        <button type="button" class="password-toggle-btn" id="toggleConfirmPasswordBtn"
                            aria-label="Hiện mật khẩu">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="auth-field__error" id="confirmPasswordError">Mật khẩu xác nhận không khớp.</div>
                </div>
            </div>

            <button type="submit" class="auth-btn-submit" id="registerSubmitBtn">
                Đăng ký tài khoản
            </button>
        </form>

        <div class="auth-card__footer">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
    </div>

    <!-- ============================================================================== -->
    <!-- KHỐI 3: TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT ĐIỀU HÀNH TRANG                 -->
    <!-- ============================================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/register.js"></script>
</body>

</html>
