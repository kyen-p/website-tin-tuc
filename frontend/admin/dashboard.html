<!--
==============================================================================
TÊN FILE: frontend/admin/dashboard.html
PHÂN HỆ: Bàn Quản Trị Hệ Thống - Giám Sát & Thống Kê Tổng Quan 
MÔ TẢ: Khung giao diện giám sát chỉ số toàn diện dành cho Quản trị viên (Admin):
       - Sidebar điều hướng Admin (#admin-sidebar) được render tự động bởi admin-layout.js.
       - Thanh tiêu đề trên cùng (#admin-topbar) chứa thông tin tài khoản Admin.
       - Vùng gắn nội dung giám sát (#workspace-content): các thẻ chỉ số KPI (người dùng, bài viết, bình luận, tương tác), biểu đồ hoạt động và xu hướng hệ thống.
PHỤ THUỘC:
       - frontend/assets/css/base.css, admin-layout.css
       - Chart.js CDN
       - frontend/assets/js/common.js, admin-layout.js, admin-dashboard.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giám sát hệ thống - Quản trị | Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Quản trị -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin-layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- BỐ CỤC KHUNG LÀM VIỆC TÒA SOẠN (SIDEBAR & TOPBAR ĐIỀU HÀNH ADMIN) -->
  <div class="admin-workspace">
    <!-- Sidebar cố định (render tự động bởi admin-layout.js) -->
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <!-- Topbar tối giản: Tên & Avatar -->
      <header id="admin-topbar"></header>

      <!-- VÙNG NỘI DUNG GIÁM SÁT HỆ THỐNG VÀ CÁC THẺ CHỈ SỐ KPI -->
      <main class="admin-content">
        <div class="admin-page-header">
          <h1 class="admin-page-title">Giám sát hệ thống</h1>
          <p class="admin-page-subtitle">Tổng quan số liệu người dùng, bài viết, bình luận và hiệu suất vận hành toàn hệ thống.</p>
        </div>

        <div id="workspace-content">
          <!-- Render tự động bởi admin-dashboard.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-layout.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAdminLayout("admin", "dashboard");
    });
  </script>
</body>
</html>
