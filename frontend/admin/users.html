<!--
==============================================================================
TÊN FILE: frontend/admin/users.html
PHÂN HỆ: Bàn Quản Trị Hệ Thống - Quản Lý Người Dùng & Phân Quyền (Admin Users View)
MÔ TẢ: Khung giao diện quản lý tài khoản và phân quyền người dùng của tòa soạn:
       - Sidebar điều hướng Admin (#admin-sidebar) được render tự động bởi admin-layout.js.
       - Thanh tiêu đề trên cùng (#admin-topbar) chứa thông tin tài khoản Admin.
       - Vùng gắn nội dung quản trị (#workspace-content): tìm kiếm theo tên/username/email, lọc vai trò, bảng danh sách tài khoản.
       - Modal phân quyền vai trò (Role), gán chuyên mục quản lý cho Biên tập viên, khóa/mở khóa tài khoản kèm lý do.
PHỤ THUỘC:
       - frontend/assets/css/base.css, admin-layout.css
       - frontend/assets/js/common.js, admin-layout.js, admin-users-modal.js, admin-users.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý người dùng - Quản trị | Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Quản trị -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin-layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- ============================================================================== -->
  <!-- KHỐI 1: BỐ CỤC KHUNG LÀM VIỆC TÒA SOẠN (SIDEBAR & TOPBAR ĐIỀU HÀNH ADMIN)      -->
  <!-- ============================================================================== -->
  <div class="admin-workspace">
    <!-- Sidebar cố định (render tự động bởi admin-layout.js) -->
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <!-- Topbar tối giản: Tên & Avatar -->
      <header id="admin-topbar"></header>

      <!-- ============================================================================== -->
      <!-- KHỐI 2: VÙNG NỘI DUNG QUẢN LÝ TÀI KHOẢN, PHÂN QUYỀN & KHÓA TÀI KHOẢN           -->
      <!-- ============================================================================== -->
      <main class="admin-content">
        <div class="admin-page-header">
          <h1 class="admin-page-title">Quản lý người dùng</h1>
          <p class="admin-page-subtitle">Danh sách tài khoản hệ thống, thay đổi vai trò phân quyền và khóa/mở khóa tài khoản.</p>
        </div>

        <div id="workspace-content">
          <!-- Render tự động bởi admin-users.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- ============================================================================== -->
  <!-- KHỐI 3: TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT ĐIỀU HÀNH TRANG                 -->
  <!-- ============================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-layout.js"></script>
  <script src="../assets/js/admin-users-modal.js"></script>
  <script src="../assets/js/admin-users.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAdminLayout("admin", "users");
    });
  </script>
</body>
</html>
