<!--
==============================================================================
TÊN FILE: frontend/admin/comments.html
PHÂN HỆ: Bàn Quản Trị Hệ Thống - Quản Lý Bình Luận & Kiểm Duyệt 
MÔ TẢ: Khung giao diện giám sát và kiểm duyệt tương tác bình luận của độc giả:
       - Sidebar điều hướng Admin (#admin-sidebar) được render tự động bởi admin-layout.js.
       - Thanh tiêu đề trên cùng (#admin-topbar) chứa thông tin tài khoản Admin.
       - Vùng gắn nội dung quản trị (#workspace-content): bộ lọc trạng thái (chờ duyệt, đã duyệt, vi phạm), tìm kiếm từ khóa, danh sách bình luận kèm bài viết gốc và nút phê duyệt/xóa trực tiếp.
PHỤ THUỘC:
       - frontend/assets/css/base.css, admin-layout.css
       - frontend/assets/js/common.js, admin-layout.js, admin-comments.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý bình luận - Quản trị | Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Quản trị -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin-layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- BỐ CỤC KHUNG LÀM VIỆC TÒA SOẠN (SIDEBAR & TOPBAR ĐIỀU HÀNH ADMIN) -->
  <div class="admin-workspace">
    <!-- Sidebar cố định (render tự động bởi admin-layout.js) -->
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <!-- Topbar tối giản: Tên & Avatar -->
      <header id="admin-topbar"></header>

      <!-- VÙNG NỘI DUNG QUẢN LÝ BÌNH LUẬN VÀ KIỂM DUYỆT TƯƠNG TÁC ĐỘC GIẢ -->
      <main class="admin-content">
        <div class="admin-page-header">
          <h1 class="admin-page-title">Quản lý bình luận</h1>
          <p class="admin-page-subtitle">Giám sát toàn bộ bình luận của độc giả, xóa các bình luận vi phạm trực tiếp.</p>
        </div>

        <div id="workspace-content">
          <!-- Render tự động bởi admin-comments.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-layout.js"></script>
  <script src="../assets/js/admin-comments.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAdminLayout("admin", "comments");
    });
  </script>
</body>
</html>
