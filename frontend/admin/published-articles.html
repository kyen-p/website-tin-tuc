<!--
==============================================================================
TÊN FILE: frontend/admin/published-articles.html
PHÂN HỆ: Bàn Quản Trị Hệ Thống - Quản Lý Bài Đã Đăng
MÔ TẢ: Khung giao diện điều hành bài viết đã xuất bản của Admin:
       - Sidebar điều hướng Admin (#admin-sidebar) được render tự động bởi admin-layout.js.
       - Thanh tiêu đề trên cùng (#admin-topbar) chứa thông tin tài khoản Admin.
       - Vùng gắn nội dung quản trị (#workspace-content): danh sách bài viết kèm người duyệt (BTV), tạm ẩn (hide) / hiển thị lại, chỉnh sửa đè hoặc xóa bài vĩnh viễn.
PHỤ THUỘC:
       - frontend/assets/css/base.css, admin-layout.css
       - frontend/assets/js/common.js, admin-layout.js, admin-published-articles.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý bài đã đăng - Quản trị | Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Quản trị -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin-layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

  <!-- CKEditor 5 Super-build CDN (Cho phép xem và chỉnh sửa định dạng bài viết chuẩn WYSIWYG) -->
  <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/super-build/ckeditor.js"></script>
</head>
<body>

  <!-- BỐ CỤC KHUNG LÀM VIỆC TÒA SOẠN (SIDEBAR & TOPBAR ĐIỀU HÀNH ADMIN) -->
  <div class="admin-workspace">
    <!-- Sidebar cố định (render tự động bởi admin-layout.js) -->
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <!-- Topbar tối giản: Tên & Avatar -->
      <header id="admin-topbar"></header>

      <!-- ============================================================================== -->
      <!-- VÙNG NỘI DUNG QUẢN LÝ BÀI VIẾT ĐÃ XUẤT BẢN -->
      <!-- ============================================================================== -->
      <main class="admin-content">
        <div class="admin-page-header">
          <h1 class="admin-page-title">Quản lý bài viết đã đăng</h1>
          <p class="admin-page-subtitle">Xem thông tin người duyệt, chỉnh sửa đè nội dung, tạm ẩn bài viết hoặc xóa bài vĩnh viễn.</p>
        </div>

        <div id="workspace-content">
          <!-- Render tự động bởi admin-published-articles.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-layout.js"></script>
  <script src="../assets/js/ckeditor-helper.js"></script>
  <script src="../assets/js/editor-pending-articles-modal.js"></script>
  <script src="../assets/js/admin-published-articles.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAdminLayout("admin", "published-articles");
    });
  </script>
</body>
</html>
