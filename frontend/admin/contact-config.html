<!--
==============================================================================
TÊN FILE: frontend/admin/contact-config.html
PHÂN HỆ: Bàn Quản Trị Hệ Thống - Cấu Hình Liên Hệ & Tòa Soạn (Admin Contact Config View)
MÔ TẢ: Khung giao diện thiết lập thông tin liên hệ và mạng xã hội của tòa soạn:
       - Sidebar điều hướng Admin (#admin-sidebar) được render tự động bởi admin-layout.js.
       - Thanh tiêu đề trên cùng (#admin-topbar) chứa thông tin tài khoản Admin.
       - Vùng gắn nội dung cấu hình (#workspace-content): biểu mẫu cập nhật Hotline, Email tòa soạn, Địa chỉ trụ sở, và các kênh mạng xã hội (Facebook, YouTube, Telegram,...).
PHỤ THUỘC:
       - frontend/assets/css/base.css, admin-layout.css
       - frontend/assets/js/common.js, admin-layout.js, admin-contact-config.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấu hình liên hệ - Quản trị | Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Quản trị -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin-layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- ============================================================================== -->
  <!-- KHỐI 1: BỐ CỤC KHUNG LÀM VIỆC TÒA SOẠN (SIDEBAR & TOPBAR ĐIỀU HÀNH ADMIN)      -->
  <!-- ============================================================================== -->
  <div class="admin-workspace">
    <!-- Sidebar cố định (render tự động bởi admin-layout.js) -->
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <!-- Topbar tối giản: Tên & Avatar -->
      <header id="admin-topbar"></header>

      <!-- ============================================================================== -->
      <!-- KHỐI 2: VÙNG NỘI DUNG FORM CẤU HÌNH THÔNG TIN LIÊN HỆ & MẠNG XÃ HỘI             -->
      <!-- ============================================================================== -->
      <main class="admin-content">
        <div class="admin-page-header">
          <h1 class="admin-page-title">Cấu hình thông tin liên hệ</h1>
          <p class="admin-page-subtitle">Quản lý Email liên hệ, Hotline, Địa chỉ tòa soạn và các liên kết mạng xã hội chính thức.</p>
        </div>

        <div id="workspace-content">
          <!-- Render tự động bởi admin-contact-config.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- ============================================================================== -->
  <!-- KHỐI 3: TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT ĐIỀU HÀNH TRANG                 -->
  <!-- ============================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin-layout.js"></script>
  <script src="../assets/js/admin-contact-config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAdminLayout("admin", "contact-config");
    });
  </script>
</body>
</html>
