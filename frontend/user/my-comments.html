<!--
==============================================================================
TÊN FILE: frontend/user/my-comments.html
PHÂN HỆ: Không Gian Độc Giả - Lịch Sử Bình Luận (User Space - My Comments View)
MÔ TẢ: Khung giao diện xem và quản lý toàn bộ các ý kiến bình luận do chính người dùng gửi:
       - Vùng gắn Header điều hướng (#site-header) và Breadcrumb dẫn đường.
       - Tiêu đề trang và phần mô tả danh sách bình luận.
       - Vùng gắn danh sách bình luận cá nhân (#my-comments-mount) với bài viết liên quan, trạng thái duyệt và nút xóa.
       - Hộp thoại xác nhận gỡ bỏ bình luận (#deleteCommentModal).
       - Vùng gắn Footer trang tự động (#site-footer).
PHỤ THUỘC:
       - frontend/assets/css/base.css, public-layout.css, public.css
       - frontend/assets/js/common.js, my-comments.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bình luận của tôi - Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Công khai -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/public-layout.css">
  <link rel="stylesheet" href="../assets/css/public.css">

  <!-- Toastify JS CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- ============================================================================== -->
  <!-- KHỐI 1: HEADER & TICKER ĐIỀU HƯỚNG CÔNG KHAI (Tự động render bởi common.js)     -->
  <!-- ============================================================================== -->
  <div id="site-header"></div>

  <!-- ============================================================================== -->
  <!-- KHỐI 2: NỘI DUNG DANH SÁCH BÌNH LUẬN ĐÃ GỬI VÀ MODAL XÁC NHẬN XÓA               -->
  <!-- ============================================================================== -->
  <main>
    <div class="wrap">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Đường dẫn trang" style="margin: 16px 0 20px;">
        <a href="../public/index.html">Trang chủ</a>
        <span>/</span>
        <span>Bình luận của tôi</span>
      </nav>

      <!-- Khung chính danh sách bình luận của tôi -->
      <div class="user-single-container" style="max-width: 960px; margin: 0 auto 56px;">

        <section class="user-single-card" aria-label="Bình luận của tôi">
          
          <!-- Tiêu đề trang -->
          <div class="user-card-header" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft);">
            <h1 class="user-card-title" style="font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--ink); margin: 0 0 6px;">Bình luận của tôi</h1>
            <p class="user-card-subtitle" style="font-size: 14px; color: var(--ink-soft); margin: 0;">Danh sách các bình luận bạn đã gửi.</p>
          </div>

          <!-- Danh sách bình luận (Render bởi my-comments.js) -->
          <div id="my-comments-mount"></div>

        </section>

      </div>

    </div>
  </main>

  <!-- Modal xác nhận xóa bình luận -->
  <div id="deleteCommentModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="deleteCommentModalTitle" onclick="if(event.target === this) closeDeleteCommentModal()">
    <div class="modal-box" style="max-width: 480px;">
      <div class="modal-box__head">
        <h3 id="deleteCommentModalTitle" class="modal-box__title">Xác nhận xóa bình luận</h3>
        <button type="button" class="modal-box__close" onclick="closeDeleteCommentModal()" aria-label="Đóng">✕</button>
      </div>
      <div class="modal-box__body">
        <p style="font-size: 14px; color: var(--muted); margin: 0; line-height: 1.6; font-family: var(--f-sans);">
          Bạn có chắc chắn muốn xóa bình luận này không? Hành động này sẽ gỡ bỏ bình luận khỏi bài viết và không thể khôi phục.
        </p>
      </div>
      <div class="modal-box__foot">
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeDeleteCommentModal()">Hủy bỏ</button>
        <button type="button" class="btn btn-danger btn-sm" id="btn-confirm-delete-comment" onclick="confirmDeleteComment()">Xóa vĩnh viễn</button>
      </div>
    </div>
  </div>

  <!-- ============================================================================== -->
  <!-- KHỐI 3: FOOTER CÔNG KHAI (Tự động render bởi common.js)                         -->
  <!-- ============================================================================== -->
  <div id="site-footer"></div>

  <!-- ============================================================================== -->
  <!-- KHỐI 4: TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT ĐIỀU HÀNH TRANG                 -->
  <!-- ============================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/my-comments.js"></script>
</body>
</html>
