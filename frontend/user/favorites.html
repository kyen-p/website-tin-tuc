<!--
==============================================================================
TÊN FILE: frontend/user/favorites.html
PHÂN HỆ: Bài viết yêu thích
MÔ TẢ: Khung giao diện xem danh sách các bài viết đã được lưu yêu thích (Bookmark):
       - Vùng gắn Header điều hướng (#site-header) và Breadcrumb dẫn đường
       - Tiêu đề trang và phần mô tả trang bài viết yêu thích
       - Vùng gắn danh sách thẻ bài viết yêu thích (#favorites-mount)
       - Vùng gắn Footer trang tự động (#site-footer)
PHỤ THUỘC:
       - frontend/assets/css/base.css, public-layout.css, public.css
       - frontend/assets/js/common.js, favorites.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết yêu thích - Mạch Tin</title>

  <!-- CSS nền tảng và layout công khai -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/public-layout.css">
  <link rel="stylesheet" href="../assets/css/public.css">

  <!-- Toastify JS CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- 1. Header và thanh tin vắn tự động (render bởi common.js) -->
  <div id="site-header"></div>

  <!-- 2. Nội dung chính không gian bài viết yêu thích -->
  <main>
    <div class="wrap">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Đường dẫn trang" style="margin: 16px 0 20px;">
        <a href="../public/index.html">Trang chủ</a>
        <span>/</span>
        <span>Bài viết yêu thích</span>
      </nav>

      <!-- Khung chính danh sách yêu thích -->
      <div class="user-single-container" style="max-width: 960px; margin: 0 auto 56px;">

        <section class="user-single-card" aria-label="Bài viết yêu thích">
          
          <!-- Tiêu đề trang -->
          <div class="user-card-header" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft);">
            <h1 class="user-card-title" style="font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--ink); margin: 0 0 6px;">Bài viết yêu thích</h1>
            <p class="user-card-subtitle" style="font-size: 14px; color: var(--ink-soft); margin: 0;">Danh sách các bài viết bạn đã lưu vào mục yêu thích.</p>
          </div>

          <!-- Danh sách bài viết yêu thích (Render bởi favorites.js) -->
          <div id="favorites-mount"></div>

        </section>

      </div>

    </div>
  </main>

  <!-- 3. Footer công khai (render bởi common.js) -->
  <div id="site-footer"></div>

  <!-- 4. Tải các thư viện và tập lệnh JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/favorites.js"></script>
</body>
</html>
