<!--
==============================================================================
TÊN FILE: frontend/user/change-password.html
PHÂN HỆ: Không Gian Độc Giả - Đổi Mật Khẩu (User Space - Change Password View)
MÔ TẢ: Khung giao diện thiết lập và cập nhật mật khẩu mới cho tài khoản người dùng:
       - Vùng gắn Header điều hướng (#site-header) và Breadcrumb dẫn đường.
       - Tiêu đề trang và phần hướng dẫn bảo mật tài khoản.
       - Form đổi mật khẩu (#changePasswordForm): Mật khẩu hiện tại, Mật khẩu mới, Xác nhận mật khẩu mới.
       - Các nút bật/tắt hiển thị mật khẩu độc lập (.btn-toggle-password).
       - Nút Hủy thay đổi (#btnResetPasswordForm) và nút Cập nhật mật khẩu (#btnSubmitPassword).
       - Vùng gắn Footer trang tự động (#site-footer).
PHỤ THUỘC:
       - frontend/assets/css/base.css, public-layout.css, public.css
       - frontend/assets/js/common.js, change-password.js
==============================================================================
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu - Mạch Tin</title>

  <!-- CSS Nền tảng & Layout Công khai -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/public-layout.css">
  <link rel="stylesheet" href="../assets/css/public.css">

  <!-- Toastify JS CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

  <!-- ============================================================================== -->
  <!-- KHỐI 1: HEADER & TICKER ĐIỀU HƯỚNG CÔNG KHAI (Tự động render bởi common.js)     -->
  <!-- ============================================================================== -->
  <div id="site-header"></div>

  <!-- ============================================================================== -->
  <!-- KHỐI 2: NỘI DUNG FORM ĐỔI MẬT KHẨU TÀI KHOẢN (3 TRƯỜNG MẬT KHẨU)                -->
  <!-- ============================================================================== -->
  <main>
    <div class="wrap">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Đường dẫn trang" style="margin: 16px 0 20px;">
        <a href="../public/index.html">Trang chủ</a>
        <span>/</span>
        <span>Đổi mật khẩu</span>
      </nav>

      <!-- Khung trung tâm 1 khối duy nhất -->
      <div class="user-single-container" style="max-width: 680px; margin: 0 auto 48px;">

        <!-- Khối chức năng Đổi mật khẩu -->
        <section class="user-single-card" aria-label="Đổi mật khẩu">
          <div class="user-card-header" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft);">
            <h1 class="user-card-title" style="font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--ink); margin: 0 0 6px;">Đổi mật khẩu</h1>
            <p class="user-card-subtitle" style="font-size: 14px; color: var(--ink-soft); margin: 0;">Cập nhật mật khẩu định kỳ để tăng cường an toàn và bảo mật cho tài khoản của bạn.</p>
          </div>

          <form id="changePasswordForm" class="user-profile-form" novalidate>
            
            <!-- Trường Mật khẩu hiện tại -->
            <div class="form-group" style="margin-bottom: 20px;">
              <label for="currentPasswordInput" class="form-label" style="font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; color: var(--ink);">
                Mật khẩu hiện tại <span style="color: var(--vermilion);">*</span>
              </label>
              <div style="position: relative; display: flex; align-items: center;">
                <input 
                  type="password" 
                  id="currentPasswordInput" 
                  class="form-input" 
                  placeholder="Nhập mật khẩu hiện tại của bạn" 
                  required 
                  autocomplete="current-password"
                  style="width: 100%; padding-right: 42px;"
                >
                <button 
                  type="button" 
                  class="btn-toggle-password" 
                  data-target="currentPasswordInput" 
                  aria-label="Ẩn hoặc hiện mật khẩu"
                  style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 4px; display: flex; align-items: center; justify-content: center;"
                >
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Trường Mật khẩu mới -->
            <div class="form-group" style="margin-bottom: 20px;">
              <label for="newPasswordInput" class="form-label" style="font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; color: var(--ink);">
                Mật khẩu mới <span style="color: var(--vermilion);">*</span>
              </label>
              <div style="position: relative; display: flex; align-items: center;">
                <input 
                  type="password" 
                  id="newPasswordInput" 
                  class="form-input" 
                  placeholder="Nhập mật khẩu mới (tối thiểu 8 ký tự)" 
                  required 
                  autocomplete="new-password"
                  style="width: 100%; padding-right: 42px;"
                >
                <button 
                  type="button" 
                  class="btn-toggle-password" 
                  data-target="newPasswordInput" 
                  aria-label="Ẩn hoặc hiện mật khẩu"
                  style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 4px; display: flex; align-items: center; justify-content: center;"
                >
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Trường Xác nhận mật khẩu mới -->
            <div class="form-group" style="margin-bottom: 24px;">
              <label for="confirmPasswordInput" class="form-label" style="font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; color: var(--ink);">
                Xác nhận mật khẩu mới <span style="color: var(--vermilion);">*</span>
              </label>
              <div style="position: relative; display: flex; align-items: center;">
                <input 
                  type="password" 
                  id="confirmPasswordInput" 
                  class="form-input" 
                  placeholder="Nhập lại mật khẩu mới" 
                  required 
                  autocomplete="new-password"
                  style="width: 100%; padding-right: 42px;"
                >
                <button 
                  type="button" 
                  class="btn-toggle-password" 
                  data-target="confirmPasswordInput" 
                  aria-label="Ẩn hoặc hiện mật khẩu"
                  style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 4px; display: flex; align-items: center; justify-content: center;"
                >
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Nút Lưu & Hủy -->
            <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line-soft);">
              <button type="button" id="btnResetPasswordForm" class="btn btn-secondary" style="padding: 10px 20px;">Hủy thay đổi</button>
              <button type="submit" id="btnSubmitPassword" class="btn btn-primary" style="padding: 10px 28px; font-weight: 600;">Cập nhật mật khẩu</button>
            </div>

          </form>
        </section>

      </div>

    </div>
  </main>

  <!-- ============================================================================== -->
  <!-- KHỐI 3: FOOTER CÔNG KHAI (Tự động render bởi common.js)                         -->
  <!-- ============================================================================== -->
  <div id="site-footer"></div>

  <!-- ============================================================================== -->
  <!-- KHỐI 4: TẢI CÁC THƯ VIỆN & TẬP LỆNH JAVASCRIPT ĐIỀU HÀNH TRANG                 -->
  <!-- ============================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/change-password.js"></script>
</body>
</html>
