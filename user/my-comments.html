    <script src="/assets/mock-data.js"></script>


    <script>
      /* =====================================================
         CURRENT USER
      ===================================================== */

      const CURRENT_USER_ID = 1;


      /* =====================================================
         DOM
      ===================================================== */

      const commentsList =
        document.getElementById("commentsList");

      const commentsEmpty =
        document.getElementById("commentsEmpty");

      const commentsError =
        document.getElementById("commentsError");

      const userName =
        document.getElementById("userName");

      const userRole =
        document.getElementById("userRole");

      const userAvatar =
        document.getElementById("userAvatar");

      const userInitials =
        document.getElementById("userInitials");


      /* =====================================================
         ROLE NAME
      ===================================================== */

      function roleName(role) {

        switch (role) {

          case "user":
            return "Độc giả";

          case "reporter":
            return "Phóng viên";

          case "editor":
            return "Biên tập viên";

          case "admin":
            return "Quản trị viên";

          default:
            return "Độc giả";
        }
      }


      /* =====================================================
         GET INITIALS
      ===================================================== */

      function getInitials(name) {

        if (!name) {
          return "U";
        }

        const words =
          name.trim().split(/\s+/);


        if (words.length === 1) {

          return words[0]
            .substring(0, 2)
            .toUpperCase();
        }


        return (
          words[0].charAt(0) +
          words[words.length - 1].charAt(0)
        ).toUpperCase();
      }


      /* =====================================================
         GET USER AVATAR
      ===================================================== */

      function getUserAvatar(user) {

        if (!user) {
          return "";
        }


        const savedAvatar =
          localStorage.getItem(
            "userAvatar_" + user.id
          );


        if (
          savedAvatar &&
          savedAvatar.trim() !== ""
        ) {

          return savedAvatar;
        }


        return user.avatar || "";
      }


      /* =====================================================
         LOAD USER SIDEBAR
      ===================================================== */

      function loadUser(user) {

        if (!user) {
          return;
        }


        const name =
          user.full_name ||
          user.username ||
          "Người dùng";


        /* TÊN */

        userName.textContent = name;


        /* ROLE */

        userRole.textContent =
          roleName(user.role);


        /* INITIALS */

        userInitials.textContent =
          getInitials(name);


        userInitials.style.display =
          "block";


        /* XÓA AVATAR CŨ */

        const oldImage =
          userAvatar.querySelector("img");


        if (oldImage) {
          oldImage.remove();
        }


        /* LẤY AVATAR */

        const avatar =
          getUserAvatar(user);


        if (!avatar) {
          return;
        }


        const img =
          document.createElement("img");


        img.src = avatar;

        img.alt =
          "Ảnh đại diện " + name;


        img.onload = function () {

          userInitials.style.display =
            "none";
        };


        img.onerror = function () {

          img.remove();

          userInitials.style.display =
            "block";
        };


        userAvatar.appendChild(img);
      }


      /* =====================================================
         GET ARTICLE
      ===================================================== */

      function getArticle(articleId) {

        if (
          typeof MOCK_DATA === "undefined" ||
          !Array.isArray(MOCK_DATA.articles)
        ) {

          return null;
        }


        return (
          MOCK_DATA.articles.find(
            article =>
              String(article.id) ===
              String(articleId)
          ) || null
        );
      }


      /* =====================================================
         FORMAT COMMENT TIME
      ===================================================== */

      function formatCommentTime(dateString) {

        if (!dateString) {
          return "";
        }


        const value =
          String(dateString);


        /*
          Hỗ trợ:

          2026-08-20 15:30:00

          hoặc

          2026-08-20T15:30:00
        */

        const date =
          new Date(
            value.includes("T")
              ? value
              : value.replace(" ", "T")
          );


        if (isNaN(date.getTime())) {
          return value;
        }


        const day =
          String(date.getDate()).padStart(2, "0");

        const month =
          String(date.getMonth() + 1).padStart(2, "0");

        const year =
          date.getFullYear();


        const hours =
          String(date.getHours()).padStart(2, "0");

        const minutes =
          String(date.getMinutes()).padStart(2, "0");


        return (
          `${day}/${month}/${year} · ` +
          `${hours}:${minutes}`
        );
      }


      /* =====================================================
         SAVE DATA TO LOCAL STORAGE
      ===================================================== */

      function saveCommentsToStorage() {

        if (
          typeof MOCK_DATA === "undefined" ||
          !Array.isArray(MOCK_DATA.comments)
        ) {

          return;
        }


        try {

          localStorage.setItem(
            "mockComments",
            JSON.stringify(
              MOCK_DATA.comments
            )
          );

        } catch (error) {

          console.error(
            "Không thể lưu comments:",
            error
          );
        }
      }


      /* =====================================================
         LOAD COMMENTS FROM LOCAL STORAGE
      ===================================================== */

      function loadCommentsFromStorage() {

        try {

          const saved =
            localStorage.getItem(
              "mockComments"
            );


          if (!saved) {
            return;
          }


          const parsed =
            JSON.parse(saved);


          if (
            Array.isArray(parsed) &&
            typeof MOCK_DATA !== "undefined"
          ) {

            MOCK_DATA.comments =
              parsed;
          }

        } catch (error) {

          console.error(
            "Không thể đọc comments:",
            error
          );
        }
      }


      /* =====================================================
         CREATE COMMENT ITEM
      ===================================================== */

      function createCommentItem(comment) {

        const article =
          getArticle(comment.article_id);


        if (!article) {
          return null;
        }


        const item =
          document.createElement("article");


        item.className =
          "comment-item";


        item.dataset.commentId =
          String(comment.id);


        /* ===================================================
           ARTICLE LINK
        =================================================== */

        const articleLink =
          document.createElement("a");


        articleLink.className =
          "comment-article-link";


        /*
          article-detail.html nằm ở thư mục gốc.
        */

        articleLink.href =
          "../article-detail.html?slug=" +
          encodeURIComponent(
            article.slug ||
            article.id
          );


        articleLink.textContent =
          "Bài: " +
          (
            article.title ||
            "Không có tiêu đề"
          );


        item.appendChild(
          articleLink
        );


        /* ===================================================
           CONTENT
        =================================================== */

        const content =
          document.createElement("p");


        content.className =
          "comment-content";


        content.dataset.role =
          "content";


        content.textContent =
          comment.content || "";


        item.appendChild(
          content
        );


        /* ===================================================
           EDIT BOX
        =================================================== */

        const editBox =
          document.createElement("div");


        editBox.className =
          "comment-edit-box";


        editBox.dataset.role =
          "edit-box";


        const textarea =
          document.createElement("textarea");


        textarea.className =
          "comment-edit-textarea";


        textarea.dataset.role =
          "textarea";


        textarea.value =
          comment.content || "";


        editBox.appendChild(
          textarea
        );


        const editActions =
          document.createElement("div");


        editActions.className =
          "comment-actions";


        editActions.style.marginTop =
          "10px";


        const saveButton =
          document.createElement("button");


        saveButton.type =
          "button";


        saveButton.className =
          "btn-comment btn-comment--save";


        saveButton.dataset.role =
          "save";


        saveButton.textContent =
          "Lưu";


        const cancelButton =
          document.createElement("button");


        cancelButton.type =
          "button";


        cancelButton.className =
          "btn-comment btn-comment--cancel";


        cancelButton.dataset.role =
          "cancel";


        cancelButton.textContent =
          "Hủy";


        editActions.appendChild(
          saveButton
        );

        editActions.appendChild(
          cancelButton
        );


        editBox.appendChild(
          editActions
        );


        item.appendChild(
          editBox
        );


        /* ===================================================
           META ROW
        =================================================== */

        const metaRow =
          document.createElement("div");


        metaRow.className =
          "comment-meta-row";


        const time =
          document.createElement("span");


        time.className =
          "comment-time";


        time.textContent =
          formatCommentTime(
            comment.created_at
          );


        metaRow.appendChild(
          time
        );


        /* ===================================================
           ACTIONS
        =================================================== */

        const actions =
          document.createElement("div");


        actions.className =
          "comment-actions";


        actions.dataset.role =
          "actions";


        const editButton =
          document.createElement("button");


        editButton.type =
          "button";


        editButton.className =
          "btn-comment btn-comment--edit";


        editButton.dataset.role =
          "edit";


        editButton.textContent =
          "Sửa";


        const deleteButton =
          document.createElement("button");


        deleteButton.type =
          "button";


        deleteButton.className =
          "btn-comment btn-comment--delete";


        deleteButton.dataset.role =
          "delete";


        deleteButton.textContent =
          "Xóa";


        actions.appendChild(
          editButton
        );

        actions.appendChild(
          deleteButton
        );


        metaRow.appendChild(
          actions
        );


        item.appendChild(
          metaRow
        );


        /* ===================================================
           EDIT
        =================================================== */

        editButton.addEventListener(
          "click",
          function () {

            textarea.value =
              comment.content || "";


            content.classList.add(
              "is-editing"
            );


            editBox.classList.add(
              "is-open"
            );


            actions.style.display =
              "none";


            textarea.focus();
          }
        );


        /* ===================================================
           CANCEL
        =================================================== */

        cancelButton.addEventListener(
          "click",
          function () {

            textarea.value =
              comment.content || "";


            content.classList.remove(
              "is-editing"
            );


            editBox.classList.remove(
              "is-open"
            );


            actions.style.display =
              "flex";
          }
        );


        /* ===================================================
           SAVE
        =================================================== */

        saveButton.addEventListener(
          "click",
          function () {

            const newContent =
              textarea.value.trim();


            if (!newContent) {

              alert(
                "Nội dung bình luận không được để trống."
              );

              textarea.focus();

              return;
            }


            /*
              Tìm comment trong MOCK_DATA
            */

            const currentComment =
              MOCK_DATA.comments.find(
                x =>
                  String(x.id) ===
                  String(comment.id)
              );


            if (currentComment) {

              currentComment.content =
                newContent;


              currentComment.updated_at =
                new Date()
                  .toISOString()
                  .slice(0, 19)
                  .replace("T", " ");
            }


            /*
              Cập nhật object hiện tại
            */

            comment.content =
              newContent;


            comment.updated_at =
              currentComment
                ? currentComment.updated_at
                : comment.updated_at;


            /*
              Hiển thị nội dung mới
            */

            content.textContent =
              newContent;


            /*
              Đóng edit
            */

            content.classList.remove(
              "is-editing"
            );


            editBox.classList.remove(
              "is-open"
            );


            actions.style.display =
              "flex";


            /*
              Lưu localStorage
            */

            saveCommentsToStorage();
          }
        );


        /* ===================================================
           DELETE
        =================================================== */

        deleteButton.addEventListener(
          "click",
          function () {

            const ok =
              confirm(
                "Bạn có chắc muốn xóa bình luận này?"
              );


            if (!ok) {
              return;
            }


            /*
              Tìm comment
            */

            const index =
              MOCK_DATA.comments.findIndex(
                x =>
                  String(x.id) ===
                  String(comment.id)
              );


            if (index !== -1) {

              MOCK_DATA.comments.splice(
                index,
                1
              );
            }


            /*
              Lưu localStorage
            */

            saveCommentsToStorage();


            /*
              Xóa giao diện
            */

            item.remove();


            /*
              Kiểm tra rỗng
            */

            if (
              commentsList.children.length ===
              0
            ) {

              commentsEmpty.style.display =
                "block";
            }
          }
        );


        return item;
      }


      /* =====================================================
         LOAD MY COMMENTS
      ===================================================== */

      function loadMyComments() {

        try {

          /*
            Kiểm tra MOCK_DATA
          */

          if (
            typeof MOCK_DATA ===
            "undefined"
          ) {

            throw new Error(
              "Không tìm thấy mock-data.js"
            );
          }


          /*
            LOAD COMMENT ĐÃ LƯU
          */

          loadCommentsFromStorage();


          /* =================================================
             CURRENT USER
          ================================================= */

          const currentUser =
            MOCK_DATA.users.find(
              user =>
                String(user.id) ===
                String(CURRENT_USER_ID)
            );


          if (!currentUser) {

            throw new Error(
              "Không tìm thấy người dùng hiện tại."
            );
          }


          /*
            Hiển thị user
          */

          loadUser(
            currentUser
          );


          /* =================================================
             LẤY COMMENT CỦA USER
          ================================================= */

          let userComments =
            Array.isArray(
              MOCK_DATA.comments
            )
              ? MOCK_DATA.comments.filter(
                  comment =>
                    String(
                      comment.user_id
                    ) ===
                      String(
                        CURRENT_USER_ID
                      ) &&
                    comment.is_deleted !== true
                )
              : [];


          /* =================================================
             SẮP XẾP MỚI NHẤT
          ================================================= */

          userComments.sort(
            function (a, b) {

              const dateA =
                new Date(
                  String(
                    a.created_at || ""
                  ).replace(
                    " ",
                    "T"
                  )
                );


              const dateB =
                new Date(
                  String(
                    b.created_at || ""
                  ).replace(
                    " ",
                    "T"
                  )
                );


              return dateB - dateA;
            }
          );


          /* =================================================
             RESET UI
          ================================================= */

          commentsList.innerHTML =
            "";

          commentsEmpty.style.display =
            "none";

          commentsError.style.display =
            "none";


          /* =================================================
             EMPTY
          ================================================= */

          if (
            userComments.length ===
            0
          ) {

            commentsEmpty.style.display =
              "block";

            return;
          }


          /* =================================================
             HIỂN THỊ COMMENT
          ================================================= */

          userComments.forEach(
            function (comment) {

              const item =
                createCommentItem(
                  comment
                );


              if (item) {

                commentsList.appendChild(
                  item
                );
              }
            }
          );


          /* =================================================
             NẾU KHÔNG CÓ ARTICLE
          ================================================= */

          if (
            commentsList.children.length ===
            0
          ) {

            commentsEmpty.textContent =
              "Không tìm thấy bài viết tương ứng với các bình luận.";

            commentsEmpty.style.display =
              "block";
          }

        } catch (error) {

          console.error(
            "My comments error:",
            error
          );


          commentsError.textContent =
            "Không thể tải dữ liệu bình luận: " +
            error.message;


          commentsError.style.display =
            "block";
        }
      }


      /* =====================================================
         LOAD PAGE
      ===================================================== */

      document.addEventListener(
        "DOMContentLoaded",
        function () {

          loadMyComments();

        }
      );


      /* =====================================================
         PAGE SHOW
      ===================================================== */

      window.addEventListener(
        "pageshow",
        function () {

          if (
            typeof MOCK_DATA !==
            "undefined"
          ) {

            const currentUser =
              MOCK_DATA.users.find(
                user =>
                  String(user.id) ===
                  String(
                    CURRENT_USER_ID
                  )
              );


            if (currentUser) {

              loadUser(
                currentUser
              );
            }
          }

        }
      );
    </script>

  </body>
</html>
