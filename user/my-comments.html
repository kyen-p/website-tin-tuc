<!-- =====================================================
     MOCK DATA

     my-comments.html nằm trong user/
     mock-data.js nằm trong assets/
     => ../assets/mock-data.js
===================================================== -->

<script src="../assets/mock-data.js"></script>


<script>


/* =====================================================
   LẤY USER HIỆN TẠI
===================================================== */

const storedUserId =
  localStorage.getItem("user_id");


let currentUser = null;



/* =====================================================
   KIỂM TRA MOCK DATA
===================================================== */

if (
  typeof MOCK_DATA !== "undefined" &&
  Array.isArray(MOCK_DATA.users)
) {


  /* =================================================
     ƯU TIÊN USER ĐANG ĐĂNG NHẬP
  ================================================= */

  if (storedUserId) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          String(user.id) ===
          String(storedUserId) &&

          user.role === "user"
      );

  }



  /* =================================================
     NẾU KHÔNG CÓ -> USER ACTIVE
  ================================================= */

  if (!currentUser) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          user.role === "user" &&
          user.status === "active"
      );

  }



  /* =================================================
     NẾU KHÔNG CÓ ACTIVE -> USER BẤT KỲ
  ================================================= */

  if (!currentUser) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          user.role === "user"
      );

  }

}



/* =====================================================
   DATA
===================================================== */

const users =
  typeof MOCK_DATA !== "undefined" &&
  Array.isArray(MOCK_DATA.users)

    ? MOCK_DATA.users

    : [];


const articles =
  typeof MOCK_DATA !== "undefined" &&
  Array.isArray(MOCK_DATA.articles)

    ? MOCK_DATA.articles

    : [];



/* =====================================================
   ELEMENT
===================================================== */

const commentsList =
  document.getElementById(
    "commentsList"
  );


const commentsEmpty =
  document.getElementById(
    "commentsEmpty"
  );


const commentsError =
  document.getElementById(
    "commentsError"
  );


const userName =
  document.getElementById(
    "userName"
  );


const userRole =
  document.getElementById(
    "userRole"
  );


const userAvatar =
  document.getElementById(
    "userAvatar"
  );


const userInitials =
  document.getElementById(
    "userInitials"
  );



/* =====================================================
   INITIALS
===================================================== */

function getInitials(name) {

  if (!name) {

    return "U";

  }


  const words =
    name
      .trim()
      .split(/\s+/);


  if (words.length === 1) {

    return words[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (

    words[0].charAt(0) +

    words[words.length - 1].charAt(0)

  ).toUpperCase();

}



/* =====================================================
   ROLE
===================================================== */

function getRoleName(role) {

  if (role === "user") {

    return "Độc giả";

  }


  if (role === "reporter") {

    return "Phóng viên";

  }


  if (role === "editor") {

    return "Biên tập viên";

  }


  if (role === "admin") {

    return "Quản trị viên";

  }


  return role || "Độc giả";

}



/* =====================================================
   LOAD USER SIDEBAR
   AVATAR:
   LOCAL STORAGE -> MOCK DATA
===================================================== */

function loadUser(user) {

  if (!user) {

    userName.textContent =
      "Người dùng";

    userRole.textContent =
      "Độc giả";

    userInitials.textContent =
      "U";

    userInitials.style.display =
      "block";

    return;

  }



  /* =================================================
     NAME
  ================================================= */

  const name =
    user.full_name ||
    user.username ||
    "Người dùng";


  userName.textContent =
    name;



  /* =================================================
     ROLE
  ================================================= */

  userRole.textContent =
    getRoleName(user.role);



  /* =================================================
     INITIALS
  ================================================= */

  userInitials.textContent =
    getInitials(name);

  userInitials.style.display =
    "block";



  /* =================================================
     XÓA AVATAR CŨ
  ================================================= */

  const oldImage =
    userAvatar.querySelector("img");


  if (oldImage) {

    oldImage.remove();

  }



  /* =================================================
     LẤY AVATAR
  ================================================= */

  const savedAvatar =
    localStorage.getItem(
      "userAvatar_" + user.id
    );


  const avatarURL =
    savedAvatar ||
    user.avatar ||
    "";



  /* =================================================
     KHÔNG CÓ AVATAR
  ================================================= */

  if (!avatarURL) {

    return;

  }



  /* =================================================
     CREATE IMAGE
  ================================================= */

  const img =
    document.createElement("img");


  img.src =
    avatarURL;


  img.alt =
    "Ảnh đại diện " + name;



  /* =================================================
     AVATAR LOAD SUCCESS
  ================================================= */

  img.onload =
    function () {

      userInitials.style.display =
        "none";

    };



  /* =================================================
     AVATAR LOAD ERROR
  ================================================= */

  img.onerror =
    function () {

      img.remove();

      userInitials.style.display =
        "block";

    };


  userAvatar.appendChild(img);

}



/* =====================================================
   GET ARTICLE
===================================================== */

function getArticle(articleId) {

  return articles.find(
    article =>
      String(article.id) ===
      String(articleId)
  ) || null;

}



/* =====================================================
   FORMAT COMMENT TIME
===================================================== */

function formatCommentTime(
  dateString
) {

  if (!dateString) {

    return "";

  }


  const value =
    String(dateString);


  const date =
    new Date(
      value.includes("T")
        ? value
        : value.replace(
            " ",
            "T"
          )
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  const day =
    String(
      date.getDate()
    ).padStart(2, "0");


  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");


  const year =
    date.getFullYear();


  const hours =
    String(
      date.getHours()
    ).padStart(2, "0");


  const minutes =
    String(
      date.getMinutes()
    ).padStart(2, "0");


  return (
    `${day}/${month}/${year}` +
    ` · ${hours}:${minutes}`
  );

}



/* =====================================================
   SAVE COMMENTS
===================================================== */

function saveCommentsToStorage() {

  if (
    typeof MOCK_DATA === "undefined" ||
    !Array.isArray(
      MOCK_DATA.comments
    )
  ) {

    return;

  }


  try {

    localStorage.setItem(
      "mockComments",
      JSON.stringify(
        MOCK_DATA.comments
      )
    );

  }

  catch (error) {

    console.error(
      "Không thể lưu comments:",
      error
    );

  }

}



/* =====================================================
   LOAD COMMENTS
===================================================== */

function loadCommentsFromStorage() {

  try {

    const saved =
      localStorage.getItem(
        "mockComments"
      );


    if (!saved) {

      return;

    }


    const parsed =
      JSON.parse(saved);


    if (
      Array.isArray(parsed) &&
      typeof MOCK_DATA !==
        "undefined"
    ) {

      MOCK_DATA.comments =
        parsed;

    }

  }

  catch (error) {

    console.error(
      "Không thể đọc comments:",
      error
    );

  }

}



/* =====================================================
   CREATE COMMENT ITEM
===================================================== */

function createCommentItem(
  comment
) {

  const article =
    getArticle(
      comment.article_id
    );


  if (!article) {

    return null;

  }



  const item =
    document.createElement(
      "article"
    );


  item.className =
    "comment-item";


  item.dataset.commentId =
    String(comment.id);



  /* =================================================
     ARTICLE LINK
  ================================================= */

  const articleLink =
    document.createElement(
      "a"
    );


  articleLink.className =
    "comment-article-link";


  articleLink.href =
    "/frontend/public/article-detail.html?slug=" +
    encodeURIComponent(
      article.slug ||
      article.id
    );


  articleLink.textContent =
    "Bài: " +
    (
      article.title ||
      "Không có tiêu đề"
    );


  item.appendChild(
    articleLink
  );



  /* =================================================
     CONTENT
  ================================================= */

  const content =
    document.createElement(
      "p"
    );


  content.className =
    "comment-content";


  content.dataset.role =
    "content";


  content.textContent =
    comment.content ||
    "";


  item.appendChild(
    content
  );



  /* =================================================
     EDIT BOX
  ================================================= */

  const editBox =
    document.createElement(
      "div"
    );


  editBox.className =
    "comment-edit-box";


  editBox.dataset.role =
    "edit-box";


  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.className =
    "comment-edit-textarea";


  textarea.dataset.role =
    "textarea";


  textarea.value =
    comment.content ||
    "";


  editBox.appendChild(
    textarea
  );



  const editActions =
    document.createElement(
      "div"
    );


  editActions.className =
    "comment-actions";


  editActions.style.marginTop =
    "10px";



  /* =================================================
     SAVE BUTTON
  ================================================= */

  const saveButton =
    document.createElement(
      "button"
    );


  saveButton.type =
    "button";


  saveButton.className =
    "btn-comment btn-comment--save";


  saveButton.dataset.role =
    "save";


  saveButton.textContent =
    "Lưu";



  /* =================================================
     CANCEL BUTTON
  ================================================= */

  const cancelButton =
    document.createElement(
      "button"
    );


  cancelButton.type =
    "button";


  cancelButton.className =
    "btn-comment btn-comment--cancel";


  cancelButton.dataset.role =
    "cancel";


  cancelButton.textContent =
    "Hủy";


  editActions.appendChild(
    saveButton
  );


  editActions.appendChild(
    cancelButton
  );


  editBox.appendChild(
    editActions
  );


  item.appendChild(
    editBox
  );



  /* =================================================
     META ROW
  ================================================= */

  const metaRow =
    document.createElement(
      "div"
    );


  metaRow.className =
    "comment-meta-row";



  const time =
    document.createElement(
      "span"
    );


  time.className =
    "comment-time";


  time.textContent =
    formatCommentTime(
      comment.created_at
    );


  metaRow.appendChild(
    time
  );



  /* =================================================
     ACTIONS
  ================================================= */

  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "comment-actions";


  actions.dataset.role =
    "actions";



  /* =================================================
     EDIT BUTTON
  ================================================= */

  const editButton =
    document.createElement(
      "button"
    );


  editButton.type =
    "button";


  editButton.className =
    "btn-comment btn-comment--edit";


  editButton.dataset.role =
    "edit";


  editButton.textContent =
    "Sửa";



  /* =================================================
     DELETE BUTTON
  ================================================= */

  const deleteButton =
    document.createElement(
      "button"
    );


  deleteButton.type =
    "button";


  deleteButton.className =
    "btn-comment btn-comment--delete";


  deleteButton.dataset.role =
    "delete";


  deleteButton.textContent =
    "Xóa";


  actions.appendChild(
    editButton
  );


  actions.appendChild(
    deleteButton
  );


  metaRow.appendChild(
    actions
  );


  item.appendChild(
    metaRow
  );



  /* =================================================
     EDIT
  ================================================= */

  editButton.addEventListener(
    "click",
    function () {

      textarea.value =
        comment.content ||
        "";


      content.classList.add(
        "is-editing"
      );


      editBox.classList.add(
        "is-open"
      );


      actions.style.display =
        "none";


      textarea.focus();

    }
  );



  /* =================================================
     CANCEL
  ================================================= */

  cancelButton.addEventListener(
    "click",
    function () {

      textarea.value =
        comment.content ||
        "";


      content.classList.remove(
        "is-editing"
      );


      editBox.classList.remove(
        "is-open"
      );


      actions.style.display =
        "flex";

    }
  );



  /* =================================================
     SAVE
  ================================================= */

  saveButton.addEventListener(
    "click",
    function () {

      const newContent =
        textarea.value.trim();


      if (!newContent) {

        alert(
          "Nội dung bình luận không được để trống."
        );


        textarea.focus();


        return;

      }



      const currentComment =
        MOCK_DATA.comments.find(
          x =>
            String(x.id) ===
            String(comment.id)
        );


      if (currentComment) {

        currentComment.content =
          newContent;


        currentComment.updated_at =
          new Date()
            .toISOString()
            .slice(0, 19)
            .replace(
              "T",
              " "
            );

      }



      comment.content =
        newContent;


      comment.updated_at =
        currentComment
          ? currentComment.updated_at
          : comment.updated_at;



      content.textContent =
        newContent;



      content.classList.remove(
        "is-editing"
      );


      editBox.classList.remove(
        "is-open"
      );


      actions.style.display =
        "flex";



      saveCommentsToStorage();

    }
  );



  /* =================================================
     DELETE
  ================================================= */

  deleteButton.addEventListener(
    "click",
    function () {

      const ok =
        confirm(
          "Bạn có chắc muốn xóa bình luận này?"
        );


      if (!ok) {

        return;

      }



      const index =
        MOCK_DATA.comments.findIndex(
          x =>
            String(x.id) ===
            String(comment.id)
        );


      if (index !== -1) {

        MOCK_DATA.comments.splice(
          index,
          1
        );

      }



      saveCommentsToStorage();



      item.remove();



      if (
        commentsList.children.length ===
        0
      ) {

        commentsEmpty.style.display =
          "block";

      }

    }
  );



  return item;

}



/* =====================================================
   LOAD MY COMMENTS
===================================================== */

function loadMyComments() {

  try {


    /* =================================================
       CHECK MOCK DATA
    ================================================= */

    if (
      typeof MOCK_DATA ===
      "undefined"
    ) {

      throw new Error(
        "Không tìm thấy mock-data.js."
      );

    }



    /* =================================================
       LOAD SAVED COMMENTS
    ================================================= */

    loadCommentsFromStorage();



    /* =================================================
       CHECK CURRENT USER
    ================================================= */

    if (!currentUser) {

      commentsList.innerHTML =
        "";


      commentsEmpty.textContent =
        "Không tìm thấy người dùng hiện tại.";


      commentsEmpty.style.display =
        "block";


      commentsError.style.display =
        "none";


      return;

    }



    /* =================================================
       LOAD USER SIDEBAR
    ================================================= */

    loadUser(
      currentUser
    );



    /* =================================================
       GET COMMENTS
    ================================================= */

    let userComments =
      Array.isArray(
        MOCK_DATA.comments
      )

        ? MOCK_DATA.comments.filter(
            comment =>

              String(
                comment.user_id
              ) ===
              String(
                currentUser.id
              ) &&

              comment.is_deleted !==
                true
          )

        : [];



    /* =================================================
       SORT
    ================================================= */

    userComments.sort(
      function (a, b) {

        const dateA =
          new Date(
            String(
              a.created_at ||
              ""
            ).replace(
              " ",
              "T"
            )
          );


        const dateB =
          new Date(
            String(
              b.created_at ||
              ""
            ).replace(
              " ",
              "T"
            )
          );


        return dateB - dateA;

      }
    );



    /* =================================================
       RESET
    ================================================= */

    commentsList.innerHTML =
      "";


    commentsEmpty.style.display =
      "none";


    commentsError.style.display =
      "none";



    /* =================================================
       EMPTY
    ================================================= */

    if (
      userComments.length ===
      0
    ) {

      commentsEmpty.textContent =
        "Bạn chưa có bình luận nào.";


      commentsEmpty.style.display =
        "block";


      return;

    }



    /* =================================================
       RENDER
    ================================================= */

    userComments.forEach(
      function (comment) {

        const item =
          createCommentItem(
            comment
          );


        if (item) {

          commentsList.appendChild(
            item
          );

        }

      }
    );



    /* =================================================
       NO VALID ARTICLE
    ================================================= */

    if (
      commentsList.children.length ===
      0
    ) {

      commentsEmpty.textContent =
        "Không tìm thấy bài viết tương ứng với các bình luận.";


      commentsEmpty.style.display =
        "block";

    }

  }

  catch (error) {

    console.error(
      "My comments error:",
      error
    );


    commentsError.textContent =
      "Không thể tải dữ liệu bình luận: " +
      error.message;


    commentsError.style.display =
      "block";

  }

}



/* =====================================================
   LOAD PAGE
===================================================== */

loadUser(
  currentUser
);


loadMyComments();



/* =====================================================
   PAGE SHOW
===================================================== */

window.addEventListener(
  "pageshow",
  function () {

    if (
      typeof MOCK_DATA !==
      "undefined"
    ) {

      loadUser(
        currentUser
      );

    }

  }
);


/* =====================================================
   AVATAR CHANGE
===================================================== */

window.addEventListener(
  "storage",
  function (event) {

    if (
      currentUser &&
      event.key ===
        "userAvatar_" +
        currentUser.id
    ) {

      loadUser(
        currentUser
      );

    }

  }
);


</script>
