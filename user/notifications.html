<!-- =====================================================
     MOCK DATA

     notifications.html nằm trong user/
     mock-data.js nằm trong assets/
     => ../assets/mock-data.js
===================================================== -->

<script src="../assets/mock-data.js"></script>


<script>


/* =====================================================
   LẤY USER HIỆN TẠI
===================================================== */

const storedUserId =
  localStorage.getItem("user_id");


let currentUser = null;



/* =====================================================
   KIỂM TRA MOCK DATA
===================================================== */

if (
  typeof MOCK_DATA !== "undefined" &&
  Array.isArray(MOCK_DATA.users)
) {


  /* =================================================
     ƯU TIÊN USER ĐANG ĐĂNG NHẬP
  ================================================= */

  if (storedUserId) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          String(user.id) ===
          String(storedUserId) &&

          user.role === "user"
      );

  }



  /* =================================================
     NẾU KHÔNG CÓ -> USER ACTIVE
  ================================================= */

  if (!currentUser) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          user.role === "user" &&
          user.status === "active"
      );

  }



  /* =================================================
     NẾU KHÔNG CÓ ACTIVE -> USER BẤT KỲ
  ================================================= */

  if (!currentUser) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          user.role === "user"
      );

  }

}



/* =====================================================
   DATA
===================================================== */

const users =
  typeof MOCK_DATA !== "undefined" &&
  Array.isArray(MOCK_DATA.users)

    ? MOCK_DATA.users

    : [];



const notifications =
  typeof MOCK_DATA !== "undefined" &&
  Array.isArray(MOCK_DATA.notifications)

    ? MOCK_DATA.notifications

    : [];



/* =====================================================
   ELEMENT
===================================================== */

const notificationsList =
  document.getElementById(
    "notificationsList"
  );


const notificationsEmpty =
  document.getElementById(
    "notificationsEmpty"
  );


const notificationsError =
  document.getElementById(
    "notificationsError"
  );


const userName =
  document.getElementById(
    "userName"
  );


const userRole =
  document.getElementById(
    "userRole"
  );


const userAvatar =
  document.getElementById(
    "userAvatar"
  );


const userInitials =
  document.getElementById(
    "userInitials"
  );



/* =====================================================
   INITIALS
===================================================== */

function getInitials(name) {

  if (!name) {

    return "U";

  }


  const words =
    name
      .trim()
      .split(/\s+/);


  if (words.length === 1) {

    return words[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (

    words[0].charAt(0) +

    words[words.length - 1].charAt(0)

  ).toUpperCase();

}



/* =====================================================
   ROLE
===================================================== */

function getRoleName(role) {

  if (role === "user") {

    return "Độc giả";

  }


  if (role === "reporter") {

    return "Phóng viên";

  }


  if (role === "editor") {

    return "Biên tập viên";

  }


  if (role === "admin") {

    return "Quản trị viên";

  }


  return role || "Độc giả";

}



/* =====================================================
   LOAD USER SIDEBAR
   AVATAR:
   LOCAL STORAGE -> MOCK DATA
===================================================== */

function loadUser(user) {

  if (!user) {

    userName.textContent =
      "Người dùng";


    userRole.textContent =
      "Độc giả";


    userInitials.textContent =
      "U";


    userInitials.style.display =
      "block";


    return;

  }



  /* =================================================
     NAME
  ================================================= */

  const name =
    user.full_name ||
    user.username ||
    "Người dùng";


  userName.textContent =
    name;



  /* =================================================
     ROLE
  ================================================= */

  userRole.textContent =
    getRoleName(user.role);



  /* =================================================
     INITIALS
  ================================================= */

  userInitials.textContent =
    getInitials(name);


  userInitials.style.display =
    "block";



  /* =================================================
     XÓA AVATAR CŨ
  ================================================= */

  const oldImage =
    userAvatar.querySelector("img");


  if (oldImage) {

    oldImage.remove();

  }



  /* =================================================
     LẤY AVATAR
  ================================================= */

  const savedAvatar =
    localStorage.getItem(
      "userAvatar_" + user.id
    );


  const avatarURL =
    savedAvatar ||
    user.avatar ||
    "";



  /* =================================================
     KHÔNG CÓ AVATAR
  ================================================= */

  if (!avatarURL) {

    return;

  }



  /* =================================================
     CREATE IMAGE
  ================================================= */

  const img =
    document.createElement("img");


  img.src =
    avatarURL;


  img.alt =
    "Ảnh đại diện " + name;



  /* =================================================
     AVATAR LOAD SUCCESS
  ================================================= */

  img.onload =
    function () {

      userInitials.style.display =
        "none";

    };



  /* =================================================
     AVATAR LOAD ERROR
  ================================================= */

  img.onerror =
    function () {

      img.remove();


      userInitials.style.display =
        "block";

    };


  userAvatar.appendChild(img);

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(dateString) {

  if (!dateString) {

    return "";

  }


  const value =
    String(dateString);


  const date =
    new Date(
      value.includes("T")
        ? value
        : value.replace(
            " ",
            "T"
          )
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  const day =
    String(
      date.getDate()
    ).padStart(2, "0");


  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");


  const year =
    date.getFullYear();


  const hours =
    String(
      date.getHours()
    ).padStart(2, "0");


  const minutes =
    String(
      date.getMinutes()
    ).padStart(2, "0");


  return (
    `${day}/${month}/${year}` +
    ` · ${hours}:${minutes}`
  );

}



/* =====================================================
   NOTIFICATION TYPE
===================================================== */

function getNotificationType(type) {

  if (type === "topic_assigned") {

    return "ĐỀ TÀI";

  }


  if (type === "article_rejected") {

    return "BÀI VIẾT";

  }


  if (type === "article_approved") {

    return "BÀI VIẾT";

  }


  if (type === "comment_locked") {

    return "BÌNH LUẬN";

  }


  return "THÔNG BÁO";

}



/* =====================================================
   RESOLVE LINK
===================================================== */

function resolveNotificationLink(link) {

  if (!link) {

    return "notifications.html";

  }


  /*
    Nếu link bắt đầu bằng /
    lấy phần cuối cùng.
  */

  if (link.startsWith("/")) {

    const parts =
      link
        .split("/")
        .filter(Boolean);


    if (parts.length > 0) {

      return parts[
        parts.length - 1
      ];

    }

  }


  return link;

}



/* =====================================================
   LOAD NOTIFICATION STATE
===================================================== */

function loadNotificationState() {

  if (
    typeof MOCK_DATA ===
    "undefined" ||
    !Array.isArray(
      MOCK_DATA.notifications
    )
  ) {

    return;

  }


  try {

    const saved =
      localStorage.getItem(
        "mockNotifications"
      );


    if (!saved) {

      return;

    }


    const savedNotifications =
      JSON.parse(saved);


    if (
      !Array.isArray(
        savedNotifications
      )
    ) {

      return;

    }


    savedNotifications.forEach(
      savedNotification => {

        const notification =
          MOCK_DATA.notifications.find(
            item =>
              String(item.id) ===
              String(savedNotification.id)
          );


        if (notification) {

          notification.is_read =
            savedNotification.is_read;

        }

      }
    );

  }

  catch (error) {

    console.warn(
      "Không thể đọc trạng thái thông báo:",
      error
    );

  }

}



/* =====================================================
   SAVE NOTIFICATION STATE
===================================================== */

function saveNotificationState() {

  if (
    typeof MOCK_DATA ===
    "undefined" ||
    !Array.isArray(
      MOCK_DATA.notifications
    )
  ) {

    return;

  }


  try {

    localStorage.setItem(
      "mockNotifications",
      JSON.stringify(
        MOCK_DATA.notifications
      )
    );

  }

  catch (error) {

    console.error(
      "Không thể lưu trạng thái thông báo:",
      error
    );

  }

}



/* =====================================================
   CLICK NOTIFICATION
===================================================== */

function handleNotificationClick(
  notification
) {

  notification.is_read =
    true;


  saveNotificationState();


  const target =
    resolveNotificationLink(
      notification.link
    );


  window.location.href =
    target;

}

/* =====================================================
   RENDER NOTIFICATIONS
===================================================== */

function loadNotifications() {

  try {


    /* =================================================
       CHECK MOCK DATA
    ================================================= */

    if (
      typeof MOCK_DATA ===
      "undefined"
    ) {

      throw new Error(
        "Không tìm thấy mock-data.js."
      );

    }



    /* =================================================
       CHECK CURRENT USER
    ================================================= */

    if (!currentUser) {

      notificationsList.innerHTML =
        "";


      notificationsEmpty.textContent =
        "Không tìm thấy người dùng hiện tại.";


      notificationsEmpty.style.display =
        "block";


      notificationsError.style.display =
        "none";


      return;

    }



    /* =================================================
       LOAD USER SIDEBAR
    ================================================= */

    loadUser(
      currentUser
    );



    /* =================================================
       LOAD SAVED STATE
    ================================================= */

    loadNotificationState();



    /* =================================================
       GET USER NOTIFICATIONS
    ================================================= */

    let userNotifications =
      Array.isArray(
        MOCK_DATA.notifications
      )

        ? MOCK_DATA.notifications.filter(
            notification =>

              String(
                notification.user_id
              ) ===
              String(
                currentUser.id
              )
          )

        : [];



    /* =================================================
       SORT
    ================================================= */

    userNotifications.sort(
      function (a, b) {

        const dateA =
          new Date(
            String(
              a.created_at ||
              ""
            ).replace(
              " ",
              "T"
            )
          );


        const dateB =
          new Date(
            String(
              b.created_at ||
              ""
            ).replace(
              " ",
              "T"
            )
          );


        return dateB - dateA;

      }
    );



    /* =================================================
       RESET
    ================================================= */

    notificationsList.innerHTML =
      "";


    notificationsEmpty.style.display =
      "none";


    notificationsError.style.display =
      "none";



    /* =================================================
       EMPTY
    ================================================= */

    if (
      userNotifications.length ===
      0
    ) {

      notificationsEmpty.textContent =
        "Chưa có thông báo mới.";


      notificationsEmpty.style.display =
        "block";


      return;

    }



    /* =================================================
       RENDER
    ================================================= */

    userNotifications.forEach(
      function (notification) {


        /* =============================================
           ITEM
        ============================================= */

        const item =
          document.createElement(
            "button"
          );


        item.type =
          "button";


        item.className =
          "notifications-item";


        if (
          !notification.is_read
        ) {

          item.classList.add(
            "unread"
          );

        }



        /* =============================================
           ICON
        ============================================= */

        const icon =
          document.createElement(
            "div"
          );


        icon.className =
          "notifications-item-icon";


        icon.innerHTML =
          getNotificationIcon(
            notification.type
          );



        /* =============================================
           CONTENT
        ============================================= */

        const content =
          document.createElement(
            "div"
          );


        content.className =
          "notifications-item-content";



        /* =============================================
           TOP
        ============================================= */

        const top =
          document.createElement(
            "div"
          );


        top.className =
          "notifications-item-top";


        const type =
          document.createElement(
            "span"
          );


        type.className =
          "notifications-item-type";


        type.textContent =
          getNotificationType(
            notification.type
          );


        const date =
          document.createElement(
            "time"
          );


        date.className =
          "notifications-item-date";


        date.textContent =
          formatDate(
            notification.created_at
          );


        top.appendChild(
          type
        );


        top.appendChild(
          date
        );



        /* =============================================
           TITLE
        ============================================= */

        const title =
          document.createElement(
            "h2"
          );


        title.className =
          "notifications-item-title";


        title.textContent =
          notification.title ||
          "Thông báo";



        /* =============================================
           DESCRIPTION
        ============================================= */

        const description =
          document.createElement(
            "p"
          );


        description.className =
          "notifications-item-description";


        description.textContent =
          notification.content ||
          "";



        /* =============================================
           STATUS
        ============================================= */

        const status =
          document.createElement(
            "span"
          );


        status.className =
          "notifications-item-status";


        status.textContent =
          notification.is_read
            ? "Đã đọc"
            : "Chưa đọc";



        /* =============================================
           APPEND CONTENT
        ============================================= */

        content.appendChild(
          top
        );


        content.appendChild(
          title
        );


        content.appendChild(
          description
        );


        content.appendChild(
          status
        );



        /* =============================================
           ARROW
        ============================================= */

        const arrow =
          document.createElement(
            "div"
          );


        arrow.className =
          "notifications-item-arrow";


        arrow.innerHTML = `

          <svg
            viewBox="0 0 24 24"
            fill="none"
          >

            <path
              d="M9 5L16 12L9 19"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>

        `;



        /* =============================================
           APPEND ITEM
        ============================================= */

        item.appendChild(
          icon
        );


        item.appendChild(
          content
        );


        item.appendChild(
          arrow
        );



        /* =============================================
           CLICK
        ============================================= */

        item.addEventListener(
          "click",
          function () {

            handleNotificationClick(
              notification
            );

          }
        );


        notificationsList.appendChild(
          item
        );

      }
    );

  }

  catch (error) {

    console.error(
      "Notifications error:",
      error
    );


    notificationsError.textContent =
      "Không thể tải thông báo: " +
      error.message;


    notificationsError.style.display =
      "block";

  }

}



/* =====================================================
   LOAD PAGE
===================================================== */

loadUser(
  currentUser
);


loadNotifications();



/* =====================================================
   PAGE SHOW
===================================================== */

window.addEventListener(
  "pageshow",
  function () {

    if (
      typeof MOCK_DATA !==
      "undefined"
    ) {

      loadUser(
        currentUser
      );


      loadNotificationState();

      loadNotifications();

    }

  }
);



/* =====================================================
   AVATAR CHANGE
===================================================== */

window.addEventListener(
  "storage",
  function (event) {

    if (
      currentUser &&
      event.key ===
        "userAvatar_" +
        currentUser.id
    ) {

      loadUser(
        currentUser
      );

    }

  }
);


</script>


</body>

</html>
