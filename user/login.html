<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng nhập — Mạch Tin</title>

    <link rel="stylesheet" href="/assets/style.css/login.css" />
  </head>

  <body>
    <!-- =========================================
         LOGIN
    ========================================== -->

    <main>
      <div class="auth-page">
        <div class="auth-wrapper">
          <!-- =====================================
               LOGO MẠCH TIN
          ====================================== -->

          <a href="../index.html" class="auth-logo">
            <svg
              class="pulse-mark"
              width="26"
              height="26"
              viewBox="0 0 26 26"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M1 13H7L9.5 6L13.5 20L16 13H25"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <span class="logo__word"> MẠCH&nbsp;<em>TIN</em> </span>
          </a>

          <!-- =====================================
               FORM ĐĂNG NHẬP
          ====================================== -->

          <section class="auth-card">
            <h1>Đăng nhập</h1>

            <p class="dek">Đăng nhập để sử dụng các tính năng cá nhân.</p>

            <!-- =================================
                 ERROR
            ================================== -->

            <div class="alert is-error" id="login-error">
              Sai thông tin đăng nhập.
            </div>

            <!-- =================================
                 FORGOT PASSWORD
            ================================== -->

            <div class="alert is-info" id="forgot-msg">
              Tính năng đang phát triển, vui lòng liên hệ Admin.
            </div>

            <!-- =================================
                 LOGIN FORM
            ================================== -->

            <form id="login-form">
              <!-- EMAIL / USERNAME -->

              <div class="field">
                <label for="login-id"> Email hoặc username </label>

                <input
                  type="text"
                  id="login-id"
                  placeholder="email@vidu.com hoặc username"
                  autocomplete="username"
                  required
                />
              </div>

              <!-- PASSWORD -->

              <div class="field">
                <label for="password"> Mật khẩu </label>

                <input
                  type="password"
                  id="password"
                  placeholder="Nhập mật khẩu"
                  autocomplete="current-password"
                  required
                />
              </div>

              <!-- ===============================
                   GHI NHỚ / QUÊN MẬT KHẨU
              ================================= -->

              <div class="auth-links">
                <!-- GHI NHỚ -->

                <label class="remember-login">
                  <input type="checkbox" id="remember" />

                  <span> Ghi nhớ đăng nhập </span>
                </label>

                <!-- QUÊN MẬT KHẨU -->

                <a href="#" id="forgot-link"> Quên mật khẩu? </a>
              </div>

              <!-- ===============================
                   BUTTON LOGIN
              ================================= -->

              <button type="submit" class="btn btn-primary btn-block">
                Đăng nhập
              </button>
            </form>

            <!-- =================================
                 REGISTER
            ================================== -->

            <p class="form-footer">
              Chưa có tài khoản?

              <a href="register.html"> Đăng ký ngay </a>
            </p>
          </section>
        </div>
      </div>
    </main>

    <!-- =========================================
         MOCK DATA
    ========================================== -->

    <script src="/assets/mock-data.js"></script>

    <script>
      // =====================================================
      // ELEMENT
      // =====================================================

      const loginForm = document.getElementById("login-form");

      const loginError = document.getElementById("login-error");

      const forgotMsg = document.getElementById("forgot-msg");

      const forgotLink = document.getElementById("forgot-link");

      // =====================================================
      // ẨN THÔNG BÁO BAN ĐẦU
      // =====================================================

      loginError.style.display = "none";

      forgotMsg.style.display = "none";

      // =====================================================
      // QUÊN MẬT KHẨU
      // =====================================================

      forgotLink.addEventListener("click", function (e) {
        e.preventDefault();

        loginError.style.display = "none";

        forgotMsg.style.display = "block";
      });

      // =====================================================
      // ĐĂNG NHẬP
      // =====================================================

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();

        // -----------------------------------------------
        // LẤY DỮ LIỆU FORM
        // -----------------------------------------------

        const loginId = document
          .getElementById("login-id")
          .value.trim()
          .toLowerCase();

        const password = document.getElementById("password").value;

        // -----------------------------------------------
        // ẨN THÔNG BÁO CŨ
        // -----------------------------------------------

        loginError.style.display = "none";

        forgotMsg.style.display = "none";

        // -----------------------------------------------
        // KIỂM TRA MOCK_DATA
        // -----------------------------------------------

        if (
          typeof MOCK_DATA === "undefined" ||
          !Array.isArray(MOCK_DATA.users)
        ) {
          console.error("Không tìm thấy MOCK_DATA.users");

          loginError.textContent = "Không thể tải dữ liệu người dùng.";

          loginError.style.display = "block";

          return;
        }

        // -----------------------------------------------
        // TÌM USER
        // -----------------------------------------------

        const user = MOCK_DATA.users.find(function (u) {
          const username = String(u.username || "")
            .trim()
            .toLowerCase();

          const email = String(u.email || "")
            .trim()
            .toLowerCase();

          return username === loginId || email === loginId;
        });

        // -----------------------------------------------
        // KIỂM TRA LOGIN
        // -----------------------------------------------

        if (user && user.password === password && user.status === "active") {
          // =============================================
          // LƯU USER ĐANG ĐĂNG NHẬP
          // =============================================

          localStorage.setItem("currentUserId", String(user.id));

          // =============================================
          // GHI NHỚ ĐĂNG NHẬP
          // =============================================

          const remember = document.getElementById("remember").checked;

          if (remember) {
            localStorage.setItem("rememberLogin", "true");
          } else {
            localStorage.removeItem("rememberLogin");
          }

          // =============================================
          // CHUYỂN VỀ TRANG CHỦ
          // =============================================

          window.location.href = "../index.html";
        } else {
          // =============================================
          // LOGIN SAI
          // =============================================

          loginError.textContent = "Sai thông tin đăng nhập.";

          loginError.style.display = "block";
        }
      });

      // =====================================================
      // TỰ ĐIỀN TÀI KHOẢN NẾU ĐÃ GHI NHỚ
      // =====================================================

      document.addEventListener("DOMContentLoaded", function () {
        const rememberLogin = localStorage.getItem("rememberLogin");

        const currentUserId = localStorage.getItem("currentUserId");

        if (
          rememberLogin === "true" &&
          currentUserId &&
          typeof MOCK_DATA !== "undefined" &&
          Array.isArray(MOCK_DATA.users)
        ) {
          const savedUser = MOCK_DATA.users.find(function (user) {
            return String(user.id) === String(currentUserId);
          });

          if (savedUser) {
            document.getElementById("login-id").value =
              savedUser.username || savedUser.email || "";

            document.getElementById("remember").checked = true;
          }
        }
      });
    </script>
  </body>
</html>
