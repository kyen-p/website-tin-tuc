<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng ký — Mạch Tin</title>

    <link rel="stylesheet" href="/assets/style.css/register.css" />
  </head>

  <body>
    <main>
      <div class="auth-page">
        <div class="auth-wrapper">

          <!-- =====================================================
               LOGO
          ====================================================== -->

          <a href="login.html" class="auth-logo">
            <svg
              class="pulse-mark"
              width="26"
              height="26"
              viewBox="0 0 26 26"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M1 13H7L9.5 6L13.5 20L16 13H25"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <span class="logo__word">
              MẠCH&nbsp;<em>TIN</em>
            </span>
          </a>

          <!-- =====================================================
               FORM ĐĂNG KÝ
          ====================================================== -->

          <section class="auth-card">

            <div class="auth-head">
              <h1>Tạo tài khoản</h1>

              <p>
                Đăng ký tài khoản để bình luận, lưu bài viết và quản lý hồ sơ.
              </p>
            </div>

            <form id="registerForm">

              <!-- HỌ VÀ TÊN -->

              <div class="form-group">
                <label for="name">Họ và tên</label>

                <input
                  class="form-control"
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Nguyễn Văn A"
                  autocomplete="name"
                  required
                />
              </div>

              <!-- USERNAME -->

              <div class="form-group">
                <label for="username">Username</label>

                <input
                  class="form-control"
                  type="text"
                  id="username"
                  name="username"
                  placeholder="nguyenvana"
                  autocomplete="username"
                  minlength="3"
                  required
                />
              </div>

              <!-- EMAIL -->

              <div class="form-group">
                <label for="email">Email</label>

                <input
                  class="form-control"
                  type="email"
                  id="email"
                  name="email"
                  placeholder="example@email.com"
                  autocomplete="email"
                  required
                />
              </div>

              <!-- SỐ ĐIỆN THOẠI -->

              <div class="form-group">
                <label for="phone">Số điện thoại</label>

                <input
                  class="form-control"
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="0912345678"
                  autocomplete="tel"
                />
              </div>

              <!-- MẬT KHẨU + XÁC NHẬN -->

              <div class="row">

                <div class="form-group">
                  <label for="password">Mật khẩu</label>

                  <input
                    class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Tối thiểu 8 ký tự"
                    minlength="8"
                    autocomplete="new-password"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="confirm">Xác nhận mật khẩu</label>

                  <input
                    class="form-control"
                    type="password"
                    id="confirm"
                    name="confirm"
                    placeholder="Nhập lại mật khẩu"
                    minlength="8"
                    autocomplete="new-password"
                    required
                  />
                </div>

              </div>

              <!-- ĐIỀU KHOẢN -->

              <label class="checkbox">
                <input
                  type="checkbox"
                  id="terms"
                  required
                />

                <span>
                  Tôi đồng ý với Điều khoản sử dụng và Chính sách bảo mật.
                </span>
              </label>

              <!-- THÔNG BÁO -->

              <p
                id="registerMessage"
                class="register-message"
                aria-live="polite"
              ></p>

              <!-- BUTTON -->

              <button
                class="btn btn-primary btn-block"
                type="submit"
              >
                Đăng ký tài khoản
              </button>

            </form>

            <!-- FOOTER -->

            <p class="form-footer">
              Đã có tài khoản?
              <a href="login.html">Đăng nhập</a>
            </p>

          </section>
        </div>
      </div>
    </main>

    <!-- =====================================================
         MOCK DATA
    ====================================================== -->

    <script src="/assets/mock-data.js"></script>

    <script>
      // =====================================================
      // FORM
      // =====================================================

      const registerForm = document.getElementById("registerForm");

      const message = document.getElementById("registerMessage");


      // =====================================================
      // LẤY DANH SÁCH USER
      // =====================================================

      function getUsers() {

        // Nếu MOCK_DATA tồn tại
        if (
          typeof MOCK_DATA !== "undefined" &&
          Array.isArray(MOCK_DATA.users)
        ) {
          return MOCK_DATA.users;
        }

        // Nếu chưa có MOCK_DATA
        return [];
      }


      // =====================================================
      // TẠO ID USER MỚI
      // =====================================================

      function createUserId(users) {

        if (users.length === 0) {
          return 1;
        }

        const ids = users
          .map(function (user) {
            return Number(user.id);
          })
          .filter(function (id) {
            return !isNaN(id);
          });

        return Math.max(...ids, 0) + 1;
      }


      // =====================================================
      // HIỂN THỊ THÔNG BÁO
      // =====================================================

      function showMessage(text, type) {

        message.innerText = text;

        message.className = "register-message " + type;
      }


      // =====================================================
      // KIỂM TRA USERNAME
      // =====================================================

      function isValidUsername(username) {

        return /^[a-zA-Z0-9._-]{3,30}$/.test(username);
      }


      // =====================================================
      // KIỂM TRA SỐ ĐIỆN THOẠI
      // =====================================================

      function isValidPhone(phone) {

        if (phone === "") {
          return true;
        }

        return /^(0[3|5|7|8|9])[0-9]{8}$/.test(phone);
      }


      // =====================================================
      // ĐĂNG KÝ
      // =====================================================

      registerForm.addEventListener("submit", function (event) {

        event.preventDefault();


        // -----------------------------------------------------
        // LẤY DỮ LIỆU FORM
        // -----------------------------------------------------

        const fullname =
          document.getElementById("name").value.trim();

        const username =
          document.getElementById("username").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const phone =
          document.getElementById("phone").value.trim();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirm").value;


        // -----------------------------------------------------
        // LẤY USERS
        // -----------------------------------------------------

        const users = getUsers();


        // -----------------------------------------------------
        // KIỂM TRA HỌ TÊN
        // -----------------------------------------------------

        if (fullname.length < 2) {

          showMessage(
            "Vui lòng nhập họ và tên hợp lệ.",
            "error"
          );

          return;
        }


        // -----------------------------------------------------
        // KIỂM TRA USERNAME
        // -----------------------------------------------------

        if (!isValidUsername(username)) {

          showMessage(
            "Username phải có từ 3 đến 30 ký tự và chỉ gồm chữ, số, dấu chấm, gạch dưới hoặc gạch ngang.",
            "error"
          );

          return;
        }


        // -----------------------------------------------------
        // KIỂM TRA USERNAME TRÙNG
        // -----------------------------------------------------

        const usernameExists = users.some(function (user) {

          return (
            String(user.username).toLowerCase() ===
            username.toLowerCase()
          );

        });


        if (usernameExists) {

          showMessage(
            "Username đã được sử dụng.",
            "error"
          );

          return;
        }


        // -----------------------------------------------------
        // KIỂM TRA EMAIL TRÙNG
        // -----------------------------------------------------

        const emailExists = users.some(function (user) {

          return (
            String(user.email).toLowerCase() ===
            email.toLowerCase()
          );

        });


        if (emailExists) {

          showMessage(
            "Email đã được đăng ký.",
            "error"
          );

          return;
        }


        // -----------------------------------------------------
        // KIỂM TRA SỐ ĐIỆN THOẠI
        // -----------------------------------------------------

        if (!isValidPhone(phone)) {

          showMessage(
            "Số điện thoại không hợp lệ.",
            "error"
          );

          return;
        }


        // -----------------------------------------------------
        // KIỂM TRA MẬT KHẨU
        // -----------------------------------------------------

        if (password.length < 8) {

          showMessage(
            "Mật khẩu phải có ít nhất 8 ký tự.",
            "error"
          );

          return;
        }


        // -----------------------------------------------------
        // KIỂM TRA XÁC NHẬN MẬT KHẨU
        // -----------------------------------------------------

        if (password !== confirmPassword) {

          showMessage(
            "Xác nhận mật khẩu không khớp.",
            "error"
          );

          return;
        }


        // -----------------------------------------------------
        // KIỂM TRA ĐIỀU KHOẢN
        // -----------------------------------------------------

        if (!document.getElementById("terms").checked) {

          showMessage(
            "Vui lòng đồng ý với Điều khoản sử dụng và Chính sách bảo mật.",
            "error"
          );

          return;
        }


        // =====================================================
        // TẠO USER MỚI
        // =====================================================

        const newUser = {

          id: createUserId(users),

          username: username,

          full_name: fullname,

          email: email,

          phone: phone,

          date_of_birth: "",

          bio: "",

          avatar:
            "https://i.pravatar.cc/150?img=12",

          password: password,

          role: "user"

        };


        // =====================================================
        // THÊM USER VÀO MOCK_DATA
        // =====================================================

        users.push(newUser);


        // =====================================================
        // LƯU USER ĐĂNG KÝ
        //
        // mock-data.js không thể tự ghi ngược vào file.
        // Vì vậy lưu danh sách user vào localStorage.
        // =====================================================

        localStorage.setItem(
          "registeredUsers",
          JSON.stringify(users)
        );


        // =====================================================
        // LƯU USER HIỆN TẠI
        // =====================================================

        localStorage.setItem(
          "currentUserId",
          String(newUser.id)
        );


        // =====================================================
        // LƯU TRẠNG THÁI ĐĂNG NHẬP
        // =====================================================

        localStorage.setItem(
          "isLoggedIn",
          "true"
        );


        // =====================================================
        // THÔNG BÁO
        // =====================================================

        showMessage(
          "Đăng ký tài khoản thành công. Đang chuyển đến trang đăng nhập...",
          "success"
        );


        // =====================================================
        // KHÓA BUTTON TRÁNH BẤM NHIỀU LẦN
        // =====================================================

        const button =
          registerForm.querySelector("button[type='submit']");

        button.disabled = true;

        button.innerText = "Đang đăng ký...";


        // =====================================================
        // CHUYỂN SANG LOGIN
        // =====================================================

        setTimeout(function () {

          window.location.href = "login.html";

        }, 1000);

      });
    </script>
  </body>
</html>
