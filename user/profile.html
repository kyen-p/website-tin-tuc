     mock-data.js nằm trong assets/

<script src="../assets/mock-data.js"></script>

<script>


/* =====================================================
   LẤY USER HIỆN TẠI
===================================================== */

const storedUserId =
  localStorage.getItem(
    "user_id"
  );


let currentUser = null;



/* =====================================================
   KIỂM TRA MOCK DATA
===================================================== */

if (
  typeof MOCK_DATA !== "undefined" &&
  Array.isArray(MOCK_DATA.users)
) {


  /* =================================================
     ƯU TIÊN USER ĐANG ĐĂNG NHẬP
  ================================================= */

  if (storedUserId) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          String(user.id) ===
          String(storedUserId) &&

          user.role === "user"
      );

  }



  /* =================================================
     NẾU KHÔNG CÓ -> USER ACTIVE
  ================================================= */

  if (!currentUser) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          user.role === "user" &&
          user.status === "active"
      );

  }



  /* =================================================
     NẾU KHÔNG CÓ ACTIVE -> USER BẤT KỲ
  ================================================= */

  if (!currentUser) {

    currentUser =
      MOCK_DATA.users.find(
        user =>
          user.role === "user"
      );

  }

}



/* =====================================================
   ELEMENT
===================================================== */

const sidebarAvatar =
  document.getElementById(
    "sidebarAvatar"
  );


const sidebarInitials =
  document.getElementById(
    "sidebarInitials"
  );


const avatarPreview =
  document.getElementById(
    "avatarPreview"
  );


const sidebarName =
  document.getElementById(
    "sidebarName"
  );


const sidebarRole =
  document.getElementById(
    "sidebarRole"
  );


const message =
  document.getElementById(
    "message"
  );



/* =====================================================
   ROLE
===================================================== */

function roleName(role) {

  if (role === "user") {

    return "Độc giả";

  }


  if (role === "reporter") {

    return "Phóng viên";

  }


  if (role === "editor") {

    return "Biên tập viên";

  }


  if (role === "admin") {

    return "Quản trị viên";

  }


  return role || "Độc giả";

}



/* =====================================================
   INITIALS
===================================================== */

function getInitials(name) {

  if (!name) {

    return "U";

  }


  const words =
    name
      .trim()
      .split(/\s+/);


  if (words.length === 1) {

    return words[0]
      .substring(0, 2)
      .toUpperCase();

  }


  return (

    words[0].charAt(0) +

    words[
      words.length - 1
    ].charAt(0)

  ).toUpperCase();

}



/* =====================================================
   LẤY AVATAR
===================================================== */

function getUserAvatar() {

  if (!currentUser) {

    return "";

  }


  const savedAvatar =
    localStorage.getItem(
      "userAvatar_" +
      currentUser.id
    );


  if (
    savedAvatar &&
    savedAvatar.trim() !== ""
  ) {

    return savedAvatar;

  }


  return currentUser.avatar || "";

}



/* =====================================================
   HIỂN THỊ AVATAR
===================================================== */

function loadAvatar() {

  if (!currentUser) {

    return;

  }


  const avatar =
    getUserAvatar();


  const name =
    currentUser.full_name ||
    currentUser.username ||
    "Người dùng";



  /* =================================================
     INITIALS
  ================================================= */

  sidebarInitials.textContent =
    getInitials(name);

  sidebarInitials.style.display =
    "block";



  /* =================================================
     PROFILE AVATAR
  ================================================= */

  if (avatar) {

    avatarPreview.src =
      avatar;

  }
  else {

    avatarPreview.removeAttribute(
      "src"
    );

  }



  /* =================================================
     SIDEBAR AVATAR
  ================================================= */

  const oldImage =
    sidebarAvatar.querySelector(
      "img"
    );


  if (oldImage) {

    oldImage.remove();

  }



  if (!avatar) {

    return;

  }



  const img =
    document.createElement(
      "img"
    );


  img.src =
    avatar;


  img.alt =
    "Ảnh đại diện " +
    name;



  img.onload =
    function () {

      sidebarInitials.style.display =
        "none";

    };



  img.onerror =
    function () {

      img.remove();

      sidebarInitials.style.display =
        "block";

      avatarPreview.removeAttribute(
        "src"
      );

    };


  sidebarAvatar.appendChild(
    img
  );



  /* =================================================
     PROFILE IMAGE ERROR
  ================================================= */

  avatarPreview.onerror =
    function () {

      avatarPreview.onerror =
        null;

      avatarPreview.removeAttribute(
        "src"
      );

    };

}



/* =====================================================
   LOAD USER SIDEBAR
===================================================== */

function loadUserInfo() {

  if (!currentUser) {

    sidebarName.innerText =
      "Người dùng";

    sidebarRole.innerText =
      "Độc giả";

    sidebarInitials.innerText =
      "U";

    return;

  }


  const name =
    currentUser.full_name ||
    currentUser.username ||
    "Người dùng";


  sidebarName.innerText =
    name;


  sidebarRole.innerText =
    roleName(
      currentUser.role
    );


  sidebarInitials.innerText =
    getInitials(name);

}



/* =====================================================
   LOAD PROFILE FORM
===================================================== */

function loadProfileForm() {

  if (!currentUser) {

    return;

  }


  document.getElementById(
    "fullname"
  ).value =
    currentUser.full_name || "";


  document.getElementById(
    "username"
  ).value =
    currentUser.username || "";


  document.getElementById(
    "email"
  ).value =
    currentUser.email || "";


  document.getElementById(
    "phone"
  ).value =
    currentUser.phone || "";


  document.getElementById(
    "birthday"
  ).value =
    currentUser.date_of_birth || "";


  document.getElementById(
    "bio"
  ).value =
    currentUser.bio || "";

}



/* =====================================================
   SHOW PROFILE
===================================================== */

function showProfile() {

  document.getElementById(
    "profileInfo"
  ).style.display =
    "block";


  document.getElementById(
    "passwordInfo"
  ).style.display =
    "none";


  document.querySelector(
    ".profile-heading"
  ).innerText =
    "Quản lý tài khoản";


  document.querySelector(
    ".profile-description"
  ).innerText =
    "Cập nhật thông tin cá nhân và bảo mật tài khoản.";

}



/* =====================================================
   SHOW PASSWORD
===================================================== */

function showPassword() {

  document.getElementById(
    "profileInfo"
  ).style.display =
    "none";


  document.getElementById(
    "passwordInfo"
  ).style.display =
    "block";


  document.querySelector(
    ".profile-heading"
  ).innerText =
    "Đổi mật khẩu";


  document.querySelector(
    ".profile-description"
  ).innerText =
    "Cập nhật mật khẩu để bảo vệ tài khoản.";

}



/* =====================================================
   MENU ACTIVE
===================================================== */

function setActiveMenu(
  element
) {

  document
    .querySelectorAll(
      ".history-menu-item"
    )
    .forEach(
      function (item) {

        item.classList.remove(
          "active"
        );

      }
    );


  element.classList.add(
    "active"
  );

}



/* =====================================================
   CHỌN AVATAR
===================================================== */

document
  .getElementById("avatar")
  .addEventListener(
    "change",
    function (event) {

      if (!currentUser) {

        return;

      }


      const file =
        event.target.files[0];


      if (!file) {

        return;

      }



      /* =================================================
         KIỂM TRA FILE
      ================================================= */

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        message.innerText =
          "Vui lòng chọn file hình ảnh.";

        return;

      }



      /* =================================================
         GIỚI HẠN 5MB
      ================================================= */

      if (
        file.size >
        5 * 1024 * 1024
      ) {

        message.innerText =
          "Ảnh đại diện không được vượt quá 5MB.";

        return;

      }



      const reader =
        new FileReader();


      reader.onload =
        function (event) {

          const avatarURL =
            event.target.result;



          /* =================================================
             PROFILE
          ================================================= */

          avatarPreview.src =
            avatarURL;



          /* =================================================
             SIDEBAR
          ================================================= */

          const oldImage =
            sidebarAvatar.querySelector(
              "img"
            );


          if (oldImage) {

            oldImage.remove();

          }


          sidebarInitials.style.display =
            "none";



          const img =
            document.createElement(
              "img"
            );


          img.src =
            avatarURL;


          img.alt =
            "Ảnh đại diện";



          sidebarAvatar.appendChild(
            img
          );



          /* =================================================
             SAVE LOCAL STORAGE
          ================================================= */

          localStorage.setItem(
            "userAvatar_" +
            currentUser.id,
            avatarURL
          );


          message.innerText =
            "Đã cập nhật ảnh đại diện.";

        };


      reader.readAsDataURL(
        file
      );

    }
  );



/* =====================================================
   SAVE PROFILE
===================================================== */

function saveProfile() {

  if (!currentUser) {

    message.innerText =
      "Không tìm thấy người dùng hiện tại.";

    return;

  }



  const fullname =
    document.getElementById(
      "fullname"
    ).value.trim();


  const username =
    document.getElementById(
      "username"
    ).value.trim();


  const email =
    document.getElementById(
      "email"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const birthday =
    document.getElementById(
      "birthday"
    ).value;


  const bio =
    document.getElementById(
      "bio"
    ).value.trim();



  /* =================================================
     VALIDATE HỌ TÊN
  ================================================= */

  if (!fullname) {

    message.innerText =
      "Vui lòng nhập họ tên.";

    return;

  }



  /* =================================================
     VALIDATE USERNAME
  ================================================= */

  if (!username) {

    message.innerText =
      "Vui lòng nhập username.";

    return;

  }



  const exist =
    MOCK_DATA.users.find(
      function (u) {

        return (
          String(u.username)
            .toLowerCase() ===
          username.toLowerCase() &&

          String(u.id) !==
          String(currentUser.id)
        );

      }
    );


  if (exist) {

    message.innerText =
      "Username đã được sử dụng.";

    return;

  }



  /* =================================================
     VALIDATE EMAIL
  ================================================= */

  const emailRegex =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


  if (
    !emailRegex.test(email)
  ) {

    message.innerText =
      "Email không đúng định dạng.";

    return;

  }



  /* =================================================
     UPDATE USER
  ================================================= */

  currentUser.full_name =
    fullname;


  currentUser.username =
    username;


  currentUser.email =
    email;


  currentUser.phone =
    phone;


  currentUser.date_of_birth =
    birthday;


  currentUser.bio =
    bio;



  /* =================================================
     UPDATE SIDEBAR
  ================================================= */

  loadUserInfo();


  loadAvatar();



  message.innerText =
    "Cập nhật thông tin tài khoản thành công.";

}



/* =====================================================
   CHANGE PASSWORD
===================================================== */

function changePassword() {

  if (!currentUser) {

    message.innerText =
      "Không tìm thấy người dùng hiện tại.";

    return;

  }


  const oldPassword =
    document.getElementById(
      "oldPassword"
    ).value;


  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;


  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;



  /* =================================================
     MẬT KHẨU CŨ
  ================================================= */

  if (
    oldPassword !==
    currentUser.password
  ) {

    message.innerText =
      "Mật khẩu cũ không chính xác.";

    return;

  }



  /* =================================================
     MẬT KHẨU MỚI
  ================================================= */

  if (
    newPassword.length < 8
  ) {

    message.innerText =
      "Mật khẩu phải có ít nhất 8 ký tự.";

    return;

  }



  /* =================================================
     XÁC NHẬN
  ================================================= */

  if (
    newPassword !==
    confirmPassword
  ) {

    message.innerText =
      "Xác nhận mật khẩu không khớp.";

    return;

  }



  /* =================================================
     KHÔNG DÙNG LẠI
  ================================================= */

  if (
    newPassword ===
    oldPassword
  ) {

    message.innerText =
      "Mật khẩu mới phải khác mật khẩu cũ.";

    return;

  }



  /* =================================================
     UPDATE
  ================================================= */

  currentUser.password =
    newPassword;



  /* =================================================
     CLEAR INPUT
  ================================================= */

  document.getElementById(
    "oldPassword"
  ).value =
    "";


  document.getElementById(
    "newPassword"
  ).value =
    "";


  document.getElementById(
    "confirmPassword"
  ).value =
    "";



  message.innerText =
    "Đổi mật khẩu thành công.";

}



/* =====================================================
   SAVE CURRENT
===================================================== */

function saveCurrent() {

  const passwordInfo =
    document.getElementById(
      "passwordInfo"
    );


  if (
    passwordInfo.style.display ===
    "block"
  ) {

    changePassword();

  }
  else {

    saveProfile();

  }

}



/* =====================================================
   INITIALIZE
===================================================== */

function initProfilePage() {

  if (
    typeof MOCK_DATA ===
      "undefined" ||

    !Array.isArray(
      MOCK_DATA.users
    ) ||

    MOCK_DATA.users.length ===
      0
  ) {

    message.innerText =
      "Không tìm thấy dữ liệu người dùng.";

    return;

  }



  if (!currentUser) {

    message.innerText =
      "Không tìm thấy người dùng hiện tại.";

    loadUserInfo();

    return;

  }



  loadUserInfo();

  loadProfileForm();

  loadAvatar();

}



/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    initProfilePage();

  }
);



/* =====================================================
   PAGE SHOW
===================================================== */

window.addEventListener(
  "pageshow",
  function () {

    if (currentUser) {

      loadUserInfo();

      loadProfileForm();

      loadAvatar();

    }

  }
);



/* =====================================================
   AVATAR CHANGE TỪ TAB KHÁC
===================================================== */

window.addEventListener(
  "storage",
  function (event) {

    if (
      currentUser &&

      event.key ===
        "userAvatar_" +
        currentUser.id
    ) {

      loadAvatar();

    }

  }
);


</script>

</body>

</html>
