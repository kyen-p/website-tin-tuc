<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài viết của tôi — Mạch Tin</title>
    <link rel="stylesheet" href="style.css/my-articles.css" />
  </head>

  <body>
    <div class="reporter-page">
      <aside class="reporter-sidebar">

          <a href="index.html" class="brand-link">

                stroke="currentColor"
                stroke-width="2.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="brand-word">
              <span class="brand-mach">MẠCH</span>
              <span class="brand-tin">TIN</span>
            </span>
          </a>
        </div>

        <div class="reporter-user">
          <div class="reporter-avatar">
            <span id="userInitials">TN</span>
          </div>
          <p class="reporter-name" id="userName">Thanh Ngân</p>
          <div class="reporter-role">Phóng viên</div>
        </div>

        <nav class="reporter-menu">
          <a href="write-article.html" class="reporter-menu-item">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none">
              <path
                d="M4 20h4L19 9l-4-4L4 16v4z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
            <span>Soạn bài</span>
          </a>

          <a href="my-articles.html" class="reporter-menu-item active">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none">
              <path
                d="M5 4h14v16H5z"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="M8 8h8M8 12h8M8 16h5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <span>Bài viết của tôi</span>
          </a>

          <a href="my-topics.html" class="reporter-menu-item">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="8"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="M12 8v4l3 2"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <span>Đề tài của tôi</span>
          </a>

          <a href="profile.html" class="reporter-menu-item">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="8"
                r="3"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="M5 20c.8-3.3 3.1-5 7-5s6.2 1.7 7 5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <span>Thống kê bài viết</span>
          </a>
        </nav>

        <div class="reporter-logout">
          <a href="index.html" class="reporter-menu-item">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none">
              <path
                d="M10 4H6a2 2 0 00-2 2v12a2 2 0 002 2h4"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
              <path
                d="M14 8l4 4-4 4M18 12H9"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Đăng xuất</span>
          </a>
        </div>
      </aside>

      <main class="reporter-main">
        <div class="reporter-content">
          <div class="page-header">
            <div>
              <h1>Bài viết của tôi</h1>
              <p>
                Quản lý các bài viết bạn đã viết và theo dõi trạng thái biên
                tập.
              </p>
            </div>
          </div>

          <div class="page-line"></div>

          <div class="article-stats">
            <div class="stat-card">
              <span class="stat-number" id="totalArticles">0</span>
              <span class="stat-label">Tổng bài</span>
            </div>
            <div class="stat-card">
              <span class="stat-number published">0</span>
              <span class="stat-label">Đã đăng</span>
            </div>
            <div class="stat-card">
              <span class="stat-number pending">0</span>
              <span class="stat-label">Chờ duyệt</span>
            </div>
            <div class="stat-card">
              <span class="stat-number draft">0</span>
              <span class="stat-label">Bản nháp</span>
            </div>
            <div class="stat-card">
              <span class="stat-number rejected">0</span>
              <span class="stat-label">Bị từ chối</span>
            </div>
          </div>

          <div class="article-toolbar">
            <div class="filter-tabs">
              <button class="filter-tab active" data-filter="all">
                Tất cả
              </button>
              <button class="filter-tab" data-filter="published">
                Đã đăng
              </button>
              <button class="filter-tab" data-filter="pending">
                Chờ duyệt
              </button>
              <button class="filter-tab" data-filter="draft">Bản nháp</button>
              <button class="filter-tab" data-filter="rejected">Từ chối</button>
            </div>
            <select id="categoryFilter">
              <option value="all">Tất cả chuyên mục</option>
            </select>
          </div>

          <div id="articleList" class="article-list"></div>

          <div id="emptyState" class="empty-state">
            Không có bài viết phù hợp.
          </div>
        </div>
      </main>
    </div>

    <!-- LINK TRỰC TIẾP TỚI MOCK DATA -->
    <script src="mock-data.js"></script>

    <script>
      const CURRENT_REPORTER_ID = 5;

      let currentStatus = "all";
      let currentCategory = "all";

      const articleList = document.getElementById("articleList");
      const emptyState = document.getElementById("emptyState");
      const categoryFilter = document.getElementById("categoryFilter");

      function loadReporter() {
        const user = MOCK_DATA.users.find(
          (user) => user.id === CURRENT_REPORTER_ID,
        );
        if (!user) return;
        document.getElementById("userName").textContent = user.full_name;
        document.getElementById("userInitials").textContent = getInitials(
          user.full_name,
        );
      }

      function getInitials(name) {
        if (!name) return "U";
        const words = name.trim().split(/\s+/);
        if (words.length === 1) {
          return words[0].substring(0, 2).toUpperCase();
        }
        return (words[0][0] + words[words.length - 1][0]).toUpperCase();
      }

      function getCategoryName(categoryId) {
        const category = MOCK_DATA.categories.find(
          (category) => category.id === categoryId,
        );
        return category ? category.name : "Chưa phân loại";
      }

      function loadCategoryFilter() {
        MOCK_DATA.categories.forEach((category) => {
          const option = document.createElement("option");
          option.value = category.id;
          option.textContent = category.name;
          categoryFilter.appendChild(option);
        });
      }

      function getStatusText(status) {
        const map = {
          published: "Đã đăng",
          pending: "Chờ duyệt",
          draft: "Bản nháp",
          rejected: "Bị từ chối",
        };
        return map[status] || status;
      }

      function formatDate(dateString) {
        if (!dateString) return "—";
        const date = String(dateString).substring(0, 10).split("-");
        if (date.length !== 3) {
          return dateString;
        }
        return `${date[2]}/${date[1]}/${date[0]}`;
      }

      function updateStats(articles) {
        const count = (status) =>
          articles.filter((article) => article.status === status).length;

        document.getElementById("totalArticles").textContent = articles.length;
        document.querySelector(".stat-number.published").textContent =
          count("published");
        document.querySelector(".stat-number.pending").textContent =
          count("pending");
        document.querySelector(".stat-number.draft").textContent =
          count("draft");
        document.querySelector(".stat-number.rejected").textContent =
          count("rejected");
      }

      function createArticleCard(article) {
        const category = getCategoryName(article.category_id);
        const card = document.createElement("article");
        card.className = "article-card";

        let actionHTML = "";

        if (article.status === "published") {
          actionHTML = `
            <a
              href="article-detail.html?slug=${encodeURIComponent(
                article.slug,
              )}"
              class="card-action"
            >
              Xem bài
            </a>
          `;
        }

        if (article.status === "draft") {
          actionHTML = `
            <a
              href="write-article.html"
              class="card-action"
            >
              Tiếp tục viết
            </a>
          `;
        }

        if (article.status === "rejected") {
          actionHTML = `
            <a
              href="write-article.html"
              class="card-action"
            >
              Chỉnh sửa
            </a>
          `;
        }

        if (article.status === "pending") {
          actionHTML = `
            <span
              class="card-action disabled"
            >
              Đang chờ duyệt
            </span>
          `;
        }

        card.innerHTML = `
          <div class="article-image">
            ${
              article.cover_image
                ? `
                  <img
                    src="${article.cover_image}"
                    alt="${article.title}"
                    onerror="this.style.display='none'"
                  >
                `
                : `
                  <div class="image-placeholder">
                    ẢNH
                  </div>
                `
            }
          </div>

          <div class="article-body">
            <div class="article-top">
              <span
                class="status status-${article.status}"
              >
                ${getStatusText(article.status)}
              </span>
              <span class="category">
                ${category}
              </span>
            </div>

            <h2 class="article-title">
              ${article.title}
            </h2>

            <p class="article-description">
              ${article.short_description || ""}
            </p>

            <div class="article-meta">
              <span>
                Tạo:
                ${formatDate(article.created_at)}
              </span>
              <span>
                ${article.view_count || 0}
                lượt xem
              </span>
            </div>

            ${
              article.status === "rejected"
                ? `
                  <div class="rejection-box">
                    <strong>
                      Lý do từ chối
                    </strong>
                    <p>
                      ${article.rejection_reason || "Không có lý do."}
                    </p>
                  </div>
                `
                : ""
            }
          </div>

          <div class="article-actions">
            ${actionHTML}
          </div>
        `;

        return card;
      }

      function renderArticles() {
        articleList.innerHTML = "";

        let articles = MOCK_DATA.articles.filter(
          (article) => article.author_id === CURRENT_REPORTER_ID,
        );

        if (currentStatus !== "all") {
          articles = articles.filter(
            (article) => article.status === currentStatus,
          );
        }

        if (currentCategory !== "all") {
          articles = articles.filter(
            (article) =>
              String(article.category_id) === String(currentCategory),
          );
        }

        articles.sort((a, b) => {
          const dateA = new Date(
            String(a.updated_at || a.created_at).replace(" ", "T"),
          );
          const dateB = new Date(
            String(b.updated_at || b.created_at).replace(" ", "T"),
          );
          return dateB - dateA;
        });

        if (articles.length === 0) {
          emptyState.style.display = "block";
          return;
        }

        emptyState.style.display = "none";

        articles.forEach((article) => {
          articleList.appendChild(createArticleCard(article));
        });
      }

      document.querySelectorAll(".filter-tab").forEach((button) => {
        button.addEventListener("click", function () {
          document
            .querySelectorAll(".filter-tab")
            .forEach((item) => item.classList.remove("active"));
          this.classList.add("active");
          currentStatus = this.dataset.filter;
          renderArticles();
        });
      });

      categoryFilter.addEventListener("change", function () {
        currentCategory = this.value;
        renderArticles();
      });

      const reporterArticles = MOCK_DATA.articles.filter(
        (article) => article.author_id === CURRENT_REPORTER_ID,
      );

      loadReporter();
      loadCategoryFilter();
      updateStats(reporterArticles);
      renderArticles();
    </script>
  </body>
</html>
