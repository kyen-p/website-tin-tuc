<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bình luận của tôi — Mạch Tin</title>

    <!-- CSS chung -->
    <link rel="stylesheet" href="style.css/my-comments.css" />
  </head>

  <body class="user-page comments-page">
    <!-- ==================== SIDEBAR ==================== -->
    <aside class="user-sidebar">
      <!-- Logo -->
      <div class="sidebar-logo">
        <a href="index.html" class="brand-logo">
          <span class="pulse-icon">
            <svg
              viewBox="0 0 48 24"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <polyline points="1,12 10,12 14,4 19,20 24,8 28,12 47,12" />
            </svg>
          </span>

          <span class="brand-mach">MẠCH</span>
          <span class="brand-tin">TIN</span>
        </a>
      </div>

      <!-- User -->
      <div class="sidebar-user">
        <div class="user-avatar" id="userAvatar">NU</div>

        <div class="user-name" id="userName">Nguyễn Văn User</div>

        <div class="user-role" id="userRole">Độc giả</div>
      </div>

      <!-- Menu -->
      <nav class="sidebar-menu">
        <a href="profile.html" class="menu-item">
          <span class="menu-icon">♙</span>
          <span>Thông tin tài khoản</span>
        </a>

        <a href="#" class="menu-item">
          <span class="menu-icon">♙</span>
          <span>Đổi mật khẩu</span>
        </a>

        <a href="favorites.html" class="menu-item">
          <span class="menu-icon heart-icon">♡</span>
          <span>Bài viết yêu thích</span>
        </a>

        <a href="history.html" class="menu-item">
          <span class="menu-icon">▣</span>
          <span>Lịch sử đọc bài</span>
        </a>

        <a href="my-comments.html" class="menu-item active">
          <span class="menu-icon comment-icon">◌</span>
          <span>Bình luận của tôi</span>
        </a>

        <a href="#" class="menu-item">
          <span class="menu-icon">♧</span>
          <span>Thông báo</span>
        </a>
      </nav>
    </aside>

    <!-- ==================== MAIN ==================== -->
    <main class="user-main">
      <section class="page-header">
        <h1>Bình luận của tôi</h1>

        <p>Quản lý các bình luận bạn đã đăng trên Mạch Tin.</p>
      </section>

      <!-- Danh sách bình luận -->
      <section id="commentsList" class="comments-list">
        <!-- JavaScript render -->
      </section>
    </main>

    <!-- ==================================================
         CHỈ LINK TRỰC TIẾP TỚI MOCK-DATA.JS
         ================================================== -->
    <script src="mock-data.js"></script>

    <script>
      /*
       * ==================================================
       * MY COMMENTS — UC-US03
       * ==================================================
       */

      const CURRENT_USER_ID = 1;

      const data =
        typeof MOCK_DATA !== "undefined" ? MOCK_DATA : window.MOCK_DATA;

      /* =========================
         USER
         ========================= */

      function getUser() {
        if (!data || !Array.isArray(data.users)) {
          return null;
        }

        return data.users.find(
          (user) => Number(user.id) === Number(CURRENT_USER_ID),
        );
      }

      function getInitials(name) {
        if (!name) return "NU";

        const words = name.trim().split(/\s+/).filter(Boolean);

        if (words.length === 1) {
          return words[0].substring(0, 2).toUpperCase();
        }

        return (
          words[0].charAt(0) + words[words.length - 1].charAt(0)
        ).toUpperCase();
      }

      function renderUser() {
        const user = getUser();

        if (!user) return;

        const name = user.name || user.full_name || "Nguyễn Văn User";

        document.getElementById("userName").textContent = name;

        document.getElementById("userAvatar").textContent = getInitials(name);

        document.getElementById("userRole").textContent =
          user.role === "reporter" ? "Phóng viên" : "Độc giả";
      }

      /* =========================
         ARTICLE
         ========================= */

      function getArticle(articleId) {
        if (!data || !Array.isArray(data.articles)) {
          return null;
        }

        return data.articles.find(
          (article) => Number(article.id) === Number(articleId),
        );
      }

      function getArticleId(comment) {
        return comment.article_id ?? comment.articleId;
      }

      function getArticleTitle(article) {
        if (!article) {
          return "Bài viết không tồn tại";
        }

        return article.title || article.name || "Bài viết";
      }

      /* =========================
         DATE
         ========================= */

      function formatDate(value) {
        if (!value) return "";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return value;
        }

        return date.toLocaleString("vi-VN", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      /* =========================
         COMMENTS
         ========================= */

      function getUserComments() {
        if (!data || !Array.isArray(data.comments)) {
          return [];
        }

        return data.comments.filter(
          (comment) =>
            Number(comment.user_id ?? comment.userId) ===
            Number(CURRENT_USER_ID),
        );
      }

      function getCommentContent(comment) {
        return comment.content || comment.text || comment.comment || "";
      }

      /* =========================
         EDIT COMMENT
         ========================= */

      function editComment(commentId) {
        const comment = data.comments.find(
          (item) => Number(item.id) === Number(commentId),
        );

        if (!comment) return;

        const card = document.querySelector(`[data-comment-id="${commentId}"]`);

        if (!card) return;

        const content = getCommentContent(comment);

        card.classList.add("comment-editing");

        card.querySelector(".comment-body").innerHTML = `
          <textarea
            class="comment-edit-input"
            id="edit-comment-${commentId}"
          >${content}</textarea>

          <div class="edit-actions">

            <button
              type="button"
              class="save-comment-btn"
              onclick="saveComment(${commentId})"
            >
              Lưu
            </button>

            <button
              type="button"
              class="cancel-edit-btn"
              onclick="renderComments()"
            >
              Hủy
            </button>

          </div>
        `;
      }

      function saveComment(commentId) {
        const textarea = document.getElementById(`edit-comment-${commentId}`);

        if (!textarea) return;

        const newContent = textarea.value.trim();

        if (!newContent) {
          alert("Nội dung bình luận không được để trống.");

          return;
        }

        const comment = data.comments.find(
          (item) => Number(item.id) === Number(commentId),
        );

        if (!comment) return;

        /*
         * Cập nhật trực tiếp mock data
         */
        if ("content" in comment) {
          comment.content = newContent;
        } else if ("text" in comment) {
          comment.text = newContent;
        } else {
          comment.content = newContent;
        }

        renderComments();
      }

      /* =========================
         DELETE COMMENT
         ========================= */

      function deleteComment(commentId) {
        /*
         * UC-US03:
         * Xóa phải xác nhận.
         */

        const confirmed = window.confirm(
          "Bạn có chắc chắn muốn xóa bình luận này?",
        );

        if (!confirmed) {
          return;
        }

        const index = data.comments.findIndex(
          (comment) => Number(comment.id) === Number(commentId),
        );

        if (index !== -1) {
          data.comments.splice(index, 1);
        }

        /*
         * Không chuyển trang.
         * Render lại ngay trên trang.
         */
        renderComments();
      }

      /* =========================
         RENDER
         ========================= */

      function renderComments() {
        const container = document.getElementById("commentsList");

        const comments = getUserComments();

        if (!comments.length) {
          container.innerHTML = `
            <div class="empty-state">

              <div class="empty-icon">
                ◌
              </div>

              <h2>
                Bạn chưa có bình luận nào
              </h2>

              <p>
                Những bình luận bạn đã đăng sẽ xuất hiện ở đây.
              </p>

            </div>
          `;

          return;
        }

        container.innerHTML = comments
          .map((comment) => {
            const article = getArticle(getArticleId(comment));

            const articleId = getArticleId(comment);

            const articleTitle = getArticleTitle(article);

            const content = getCommentContent(comment);

            const date = formatDate(
              comment.created_at ?? comment.createdAt ?? comment.date,
            );

            return `
                <article
                  class="comment-card"
                  data-comment-id="${comment.id}"
                >

                  <div class="comment-top">

                    <div class="comment-label">
                      BÌNH LUẬN CỦA BẠN
                    </div>

                    ${
                      date
                        ? `
                          <time
                            class="comment-date"
                          >
                            ${date}
                          </time>
                        `
                        : ""
                    }

                  </div>


                  <div class="comment-article">

                    <span>
                      Bài viết:
                    </span>

                    <a
                      href="article.html?id=${articleId}"
                      class="article-link"
                    >
                      ${articleTitle}
                    </a>

                  </div>


                  <div class="comment-body">
                    ${content}
                  </div>


                  <div class="comment-actions">

                    <button
                      type="button"
                      class="edit-comment-btn"
                      onclick="editComment(${comment.id})"
                    >
                      Sửa
                    </button>

                    <button
                      type="button"
                      class="delete-comment-btn"
                      onclick="deleteComment(${comment.id})"
                    >
                      Xóa
                    </button>

                  </div>

                </article>
              `;
          })
          .join("");
      }

      /* =========================
         INIT
         ========================= */

      document.addEventListener("DOMContentLoaded", () => {
        renderUser();

        renderComments();
      });
    </script>
  </body>
</html>
