<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bài viết yêu thích — Mạch Tin</title>

    <!-- STYLE GỐC -->
    <link rel="stylesheet" href="style.css/favorites.css" />

    <!-- DỮ LIỆU DUY NHẤT -->
    <script src="mock-data.js"></script>
  </head>

  <body>
    <div class="user-layout">
      <!-- =========================
         SIDEBAR
         ========================= -->
      <aside class="user-sidebar">
        <div class="user-logo">
          <a href="index.html" class="logo">
            <svg
              class="pulse-mark"
              width="40"
              height="24"
              viewBox="0 0 40 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M1 12H10L13 4L18 20L22 8L25 12H39"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="square"
                stroke-linejoin="miter"
              />
            </svg>

            <span class="logo__word"> MẠCH <em>TIN</em> </span>
          </a>
        </div>

        <div class="user-profile">
          <div class="user-avatar" id="userAvatar">NU</div>

          <div class="user-name" id="userName">Nguyễn Văn User</div>

          <div class="user-role" id="userRole">Độc giả</div>
        </div>

        <nav class="user-nav">
          <a href="profile.html">
            <span class="nav-icon">♙</span>
            <span>Thông tin tài khoản</span>
          </a>

          <a href="change-password.html">
            <span class="nav-icon">♧</span>
            <span>Đổi mật khẩu</span>
          </a>

          <a href="favorites.html" class="is-active">
            <span class="nav-icon">♡</span>
            <span>Bài viết yêu thích</span>
          </a>

          <a href="history.html">
            <span class="nav-icon">▣</span>
            <span>Lịch sử đọc bài</span>
          </a>

          <a href="my-comments.html">
            <span class="nav-icon">☵</span>
            <span>Bình luận của tôi</span>
          </a>

          <a href="notifications.html">
            <span class="nav-icon">♧</span>
            <span>Thông báo</span>
          </a>
        </nav>
      </aside>

      <!-- =========================
         MAIN
         ========================= -->
      <main class="user-main">
        <div class="user-content">
          <div class="page-header">
            <h1>Bài viết yêu thích</h1>

            <p>Danh sách các bài viết bạn đã lưu.</p>
          </div>

          <!-- DANH SÁCH ĐƯỢC JS RENDER TỪ MOCK_DATA -->
          <section
            id="favoritesList"
            class="favorites-list"
            aria-live="polite"
          ></section>

          <!-- TRẠNG THÁI KHÔNG CÓ DỮ LIỆU -->
          <div id="favoritesEmpty" class="empty-state" hidden>
            <div class="empty-state__icon">♡</div>

            <h2>Chưa có bài viết yêu thích</h2>

            <p>Những bài viết bạn yêu thích sẽ xuất hiện tại đây.</p>
          </div>
        </div>
      </main>
    </div>

    <script>
      /*
       * =========================================================
       * BÀI VIẾT YÊU THÍCH
       * =========================================================
       *
       * Dữ liệu lấy TRỰC TIẾP từ:
       * mock-data.js
       *
       * Không nhập dữ liệu bài viết thủ công ở đây.
       */

      const CURRENT_USER_ID = 1;

      const listElement = document.getElementById("favoritesList");
      const emptyElement = document.getElementById("favoritesEmpty");

      function getData() {
        return window.MOCK_DATA || {};
      }

      function getCurrentUser() {
        const data = getData();

        return (data.users || []).find(
          (user) => Number(user.id) === CURRENT_USER_ID,
        );
      }

      function getArticle(articleId) {
        const data = getData();

        return (data.articles || []).find(
          (article) => Number(article.id) === Number(articleId),
        );
      }

      function getCategory(categoryId) {
        const data = getData();

        return (data.categories || []).find(
          (category) => Number(category.id) === Number(categoryId),
        );
      }

      function getAuthor(authorId) {
        const data = getData();

        return (data.users || []).find(
          (user) => Number(user.id) === Number(authorId),
        );
      }

      function getFavorites() {
        const data = getData();

        return (data.favorites || []).filter(
          (favorite) =>
            Number(favorite.user_id ?? favorite.userId) === CURRENT_USER_ID,
        );
      }

      function getInitials(name) {
        if (!name) return "NU";

        return name
          .trim()
          .split(/\s+/)
          .slice(-2)
          .map((word) => word.charAt(0).toUpperCase())
          .join("");
      }

      function formatDate(value) {
        if (!value) return "";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return value;
        }

        return date.toLocaleDateString("vi-VN");
      }

      function getArticleId(favorite) {
        return favorite.article_id ?? favorite.articleId ?? favorite.id_article;
      }

      function renderUser() {
        const user = getCurrentUser();

        if (!user) return;

        document.getElementById("userName").textContent =
          user.name || user.full_name || "Nguyễn Văn User";

        document.getElementById("userRole").textContent =
          user.role === "reporter"
            ? "Phóng viên"
            : user.role === "editor"
              ? "Biên tập viên"
              : "Độc giả";

        document.getElementById("userAvatar").textContent = getInitials(
          user.name || user.full_name,
        );
      }

      function renderFavorites() {
        const favorites = getFavorites();

        listElement.innerHTML = "";

        let renderedCount = 0;

        favorites.forEach((favorite) => {
          const articleId = getArticleId(favorite);
          const article = getArticle(articleId);

          if (!article) return;

          const category = getCategory(
            article.category_id ?? article.categoryId,
          );

          const author = getAuthor(article.author_id ?? article.authorId);

          const item = document.createElement("article");

          item.className = "favorite-item";

          const imageClass = article.image
            ? "favorite-image favorite-image--real"
            : "favorite-image ph ph--4x3";

          const imageContent = article.image
            ? `<img src="${article.image}" alt="${article.title || ""}">`
            : `<span class="ph__label">ẢNH</span>`;

          item.innerHTML = `
          <a
            href="article-detail.html?id=${encodeURIComponent(article.id)}"
            class="${imageClass}"
          >
            ${imageContent}
          </a>

          <div class="favorite-info">

            <div class="favorite-category">
              ${category?.name || article.category || ""}
            </div>

            <h2 class="favorite-title">
              <a
                href="article-detail.html?id=${encodeURIComponent(article.id)}"
              >
                ${article.title || "Không có tiêu đề"}
              </a>
            </h2>

            ${
              article.summary || article.description
                ? `
                  <p class="favorite-description">
                    ${article.summary || article.description}
                  </p>
                `
                : ""
            }

            <div class="favorite-meta">
              <span>
                ${author?.name || article.author || ""}
              </span>

              <span class="dot-sep">·</span>

              <span>
                ${formatDate(article.published_at || article.publishedAt || article.date)}
              </span>
            </div>

          </div>

          <div class="favorite-action">

            <button
              type="button"
              class="remove-favorite"
              data-favorite-id="${favorite.id}"
              aria-label="Bỏ yêu thích"
            >
              Bỏ yêu thích
            </button>

          </div>
        `;

          listElement.appendChild(item);

          renderedCount++;
        });

        if (renderedCount === 0) {
          emptyElement.hidden = false;
          listElement.hidden = true;
        } else {
          emptyElement.hidden = true;
          listElement.hidden = false;
        }

        bindRemoveButtons();
      }

      function bindRemoveButtons() {
        document.querySelectorAll(".remove-favorite").forEach((button) => {
          button.addEventListener("click", function () {
            const favoriteId = this.dataset.favoriteId;

            const data = getData();

            const index = (data.favorites || []).findIndex(
              (favorite) => String(favorite.id) === String(favoriteId),
            );

            if (index === -1) return;

            /*
             * UC-US01:
             * Bỏ yêu thích → XÓA NGAY
             * KHÔNG hỏi xác nhận
             * Ở LẠI TRANG
             */
            data.favorites.splice(index, 1);

            renderFavorites();
          });
        });
      }

      renderUser();
      renderFavorites();
    </script>
  </body>
</html>
