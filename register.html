<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký — Mạch Tin</title>

    <link rel="stylesheet" href="style.css/register.css" />
  </head>

  <body>
    <main>
      <div class="auth-page">
        <div class="auth-wrapper">
          <!-- LOGO -->
          <a href="login.html" class="auth-logo">
            <svg
              class="pulse-mark"
              width="26"
              height="26"
              viewBox="0 0 26 26"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M1 13H7L9.5 6L13.5 20L16 13H25"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="logo__word">MẠCH&nbsp;<em>TIN</em></span>
          </a>

          <!-- FORM ĐĂNG KÝ -->
          <section class="auth-card">
            <div class="auth-head">
              <h1>Tạo tài khoản</h1>
              <p>
                Đăng ký tài khoản để bình luận, lưu bài viết và quản lý hồ sơ.
              </p>
            </div>

            <form action="#" method="post">
              <!-- HỌ VÀ TÊN -->
              <div class="form-group">
                <label for="name">Họ và tên</label>
                <input
                  class="form-control"
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Nguyễn Văn A"
                  required
                />
              </div>

              <!-- EMAIL -->
              <div class="form-group">
                <label for="email">Email</label>
                <input
                  class="form-control"
                  type="email"
                  id="email"
                  name="email"
                  placeholder="example@email.com"
                  required
                />
              </div>

              <!-- MẬT KHẨU + XÁC NHẬN -->
              <div class="row">
                <div class="form-group">
                  <label for="password">Mật khẩu</label>
                  <input
                    class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Tối thiểu 8 ký tự"
                    minlength="8"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="confirm">Xác nhận mật khẩu</label>
                  <input
                    class="form-control"
                    type="password"
                    id="confirm"
                    name="confirm"
                    placeholder="Nhập lại mật khẩu"
                    required
                  />
                </div>
              </div>

              <!-- ĐIỀU KHOẢN -->
              <label class="checkbox">
                <input type="checkbox" required />
                <span>
                  Tôi đồng ý với Điều khoản sử dụng và Chính sách bảo mật.
                </span>
              </label>
              <button class="btn btn-primary btn-block" type="submit">
                Đăng ký tài khoản
              </button>
            </form>

            <p class="form-footer">
              Đã có tài khoản?
              <a href="login.html">Đăng nhập</a>
            </p>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
